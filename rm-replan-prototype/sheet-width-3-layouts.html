<title>Monthly Sheet Width</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE, throwaway (#333). Three layouts of the same South Nov 2026 monthly sheet, switch with the
     bottom bar, the arrow keys, or #a / #b / #c. Styled as the app's own sheet (src/App.jsx, design A #302):
     Inter 12 px, slate greys, indigo accent, 32 px header, 28 px rows, section and size-group rows.
     Sales = real invoices to 13 Nov. Open, made, stock, pending and coil = the 12-Nov snapshot (quick SQL,
     not verified). Indents are EXAMPLES. Planned follows the app's rule. Nothing saves. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the app's monthly sheet as it is (one bordered table, sticky Size column), a short intro per layout, a switcher pill fixed at the bottom. */
:root {
  --bg: #f8fafc; --panel: #ffffff; --strong: #0f172a; --fg: #334155; --muted: #64748b; --faint: #94a3b8;
  --line: #e2e8f0; --line-soft: #f1f5f9; --head: #f1f5f9; --hover: #f8fafc;
  --accent: #4338ca; --ring: #6366f1; --red: #b91c1c; --red-bg: #fef2f2; --green: #15803d;
  --bar-bg: #0f172a; --bar-fg: #ffffff;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f172a; --panel: #1e293b; --strong: #ffffff; --fg: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
  --line: #334155; --line-soft: #2a3649; --head: #334155; --hover: #26324a;
  --accent: #a5b4fc; --ring: #818cf8; --red: #fca5a5; --red-bg: #3b1d1d; --green: #86efac;
  --bar-bg: #e2e8f0; --bar-fg: #0f172a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f172a; --panel: #1e293b; --strong: #ffffff; --fg: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
  --line: #334155; --line-soft: #2a3649; --head: #334155; --hover: #26324a;
  --accent: #a5b4fc; --ring: #818cf8; --red: #fca5a5; --red-bg: #3b1d1d; --green: #86efac;
  --bar-bg: #e2e8f0; --bar-fg: #0f172a; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 12px/1.45 var(--sans); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 96px; display: grid; gap: 12px; max-width: 1180px; }
.wrap > * { min-width: 0; }
h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--strong); text-wrap: balance; }
h2 { font-size: 12px; margin: 0; font-weight: 600; color: var(--strong); }
p { margin: 0; max-width: 72ch; }
.note { font-size: 11px; color: var(--muted); }
.example { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
table { width: 100%; font-size: inherit; color: inherit; border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap; }
thead th { background: var(--head); color: var(--fg); font-weight: 600; font-size: 11px; height: 32px; padding: 0 8px; text-align: left; border-bottom: 1px solid var(--line); }
td { height: 28px; padding: 0 8px; border-top: 1px solid var(--line-soft); }
tr.row:hover td { background: var(--hover); }
.n { text-align: right; }
.rule { border-left: 1px solid var(--line); }
.sticky { position: sticky; left: 0; z-index: 1; background: var(--panel); }
thead .sticky { background: var(--head); z-index: 2; }
tr.sec td { height: 24px; font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--muted); border-top: 1px solid var(--line); }
tr.grp td { border-top: 1px solid var(--line); font-weight: 500; color: var(--strong); }
tr.grp td.size { font-weight: 600; }
tr.grp td.short, tr.grp td.when { color: var(--red); }
tr.grp .caret { color: var(--faint); display: inline-block; width: 10px; }
tr.tot td { border-top: 1px solid var(--line); background: var(--head); font-weight: 600; color: var(--strong); }
.mto { color: var(--faint); }
.sugg { color: var(--faint); }
.add { color: var(--accent); font-weight: 600; }
.short { color: var(--red); font-weight: 600; }
.when { color: var(--red); }
.ok { color: var(--green); }
.quiet { color: var(--faint); font-size: 11px; }
.btn { font: inherit; color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn:focus-visible, .pill button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.coil td.short { background: var(--red-bg); }
.pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; align-items: center; gap: 6px; background: var(--bar-bg); color: var(--bar-fg); border-radius: 999px;
  padding: 4px 6px; box-shadow: 0 4px 16px rgba(15,23,42,.25); max-width: calc(100% - 32px); }
.pill button { font: inherit; background: transparent; color: var(--bar-fg); border: 0; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
</style>

<div class="wrap">
  <div style="display:grid;gap:4px">
    <h1>November 2026 · South</h1>
    <p class="note">Throwaway mock-up for #333: three ways to fit the new columns on the monthly sheet. Same 12 lines in each. Sales are real invoices to 13 Nov; Open, stock, pending and coil are the 12-Nov snapshot. <span class="example">Example Indents</span> Planned follows the app's rule from them. Nothing saves.</p>
  </div>
  <div id="intro"></div>
  <div id="view"></div>
</div>

<div class="pill" role="group" aria-label="Layout switcher">
  <button type="button" id="prev" aria-label="Previous layout">←</button>
  <span id="label"></span>
  <button type="button" id="next" aria-label="Next layout">→</button>
</div>

<script>
const PLANT = { H: 'Hyderabad', L: 'Lepakshi' };
const MONTHS = { H: 7.4, L: 2.4 }; // months of invoicing since 1 Apr (Lepakshi from 31 Aug), #330
const WHEN = ['needed now', 'needed now', 'by Mon 16 Nov', 'by Mon 23 Nov'];
// Slit coil not yet in a production, [width mm, T]; HR coil not yet slit, T. 12-Nov snapshot.
const SLIT = { H: { '1.6': [[64, 1.2], [76, 1.4], [398, 14.6]], '2.0': [[65, 1.1], [76, 5.4], [96, 1.8], [116, 6.3], [147, 2.4], [148, 2.7], [187, 12.7]] },
               L: { '2.5': [[147, 5.1], [156, 2.7], [397, 6.9]], '3.0': [[98, 1.8], [100, 1.8], [116, 2.2], [143, 2.6], [279, 35.6]], '5.0': [[275, 15.1], [276, 10.2], [351, 6.5], [360, 6.6], [385, 14.8]] } };
const HR = { H: { '1.6': 18.9 }, L: {} };
// plant, section, size, thk, Buffer (null = MTO), Indent (example), Open 1 Nov, made in Nov, stock now, pending now, week,
// invoiced Oct, Aug–Oct, L30, L90, YTD since 1 Apr (T, by shipping plant)
const RAW = [
  ['H', 'SHS', '20x20', '2.0', 20, 35, 0, 0, 0, 36.0, 0, 7.1, 40.3, 4.0, 35.1, 74.3],
  ['H', 'SHS', '25x25', '1.6', 60, 30, 0, 17.5, 17.5, 35.2, 0, 10.2, 53.9, 12.9, 51.5, 154.4],
  ['H', 'SHS', '38x38', '1.6', null, 45, 1.2, 0, 1.2, 50.6, 1, 15.7, 58.0, 0, 28.7, 179.8],
  ['H', 'SHS', '50x50', '1.6', 100, 40, 5.6, 17.6, 23.2, 37.4, 1, 29.6, 50.5, 21.7, 42.5, 150.0],
  ['H', 'SHS', '50x50', '2.0', 100, 40, 31.2, 0, 22.1, 44.6, 2, 49.5, 163.3, 27.2, 167.0, 381.6],
  ['L', 'SHS', '100x100', '3.0', 80, 20, 23.1, 19.8, 43.0, 20.5, 2, 3.0, 53.9, 0, 53.9, 53.9],
  ['L', 'SHS', '150x150', '5.0', 40, 10, 24.1, 0, 6.8, 21.7, 2, 40.0, 40.0, 57.3, 57.3, 57.3],
  ['H', 'RHS', '40x20', '1.6', null, 25, 0, 0, 0, 30.7, 2, 0, 15.3, 0, 0, 55.1],
  ['H', 'RHS', '50x25', '1.6', 20, 30, 0, 0, 0, 34.1, 2, 16.6, 57.8, 5.2, 49.4, 100.6],
  ['H', 'RHS', '60x40', '1.6', 60, 45, 0.5, 0, 0.5, 46.3, 3, 34.2, 79.9, 30.2, 56.7, 214.9],
  ['H', 'RHS', '80x40', '1.6', 60, 25, 0, 0, 0, 30.0, 3, 0, 53.9, 0, 34.0, 133.9],
  ['L', 'RHS', '122x61', '2.5', 20, 0, 27.7, 0, 27.7, 20.7, 2, 11.6, 11.6, 6.3, 11.6, 11.6],
];
const up10 = (t) => (t <= 0 ? 0 : Math.ceil(t / 10 - 1e-9) * 10);
const r1 = (t) => Math.round(t * 10) / 10;
const f = (t) => (t == null ? '' : Math.abs(t) < 0.05 ? '–' : r1(t).toFixed(1));
const strip = (size) => { const [a, b] = size.split('x').map(Number); return 2 * (a + b) - 4; };

const ROWS = RAW.map(([p, sec, size, thk, buffer, indent, open, made, stock, pending, week, oct, ao, l30, l90, ytd], i) => {
  // Buffer rows max(Indent, Buffer) − Open, MTO rows Indent − Open, up to the next 10 (the app's suggestion).
  const planned = up10(Math.max(0, Math.max(indent, buffer || 0) - open));
  const left = planned - Math.min(made, planned);
  const gap = pending - stock - left;                     // Add: MTO formula on every row (#325)
  const add = gap >= 2 ? up10(gap) : 0;                   // under 2 T raises nothing (#322)
  return { i, p, sec, size, thk, buffer, indent, open, made, stock, pending, week, oct, ao, l30, l90, ytdMo: ytd / MONTHS[p],
           planned, left, gap, add, strip: strip(size) };
});

// Coil for the plan (Planned still to make, 1 : 1): fitting slit (strip ± 5 mm) first, then HR of the thickness, in week order.
const COIL = (() => {
  const byRow = {}, groups = [];
  Object.keys(PLANT).forEach((p) => {
    [...new Set(ROWS.filter((r) => r.p === p).map((r) => r.thk))].sort().forEach((thk) => {
      const slit = (SLIT[p][thk] || []).map(([w, t]) => ({ w, t }));
      const slitHand = slit.reduce((s, c) => s + c.t, 0);
      let hr = HR[p][thk] || 0; const hrHand = hr;
      const rows = ROWS.filter((r) => r.p === p && r.thk === thk).sort((a, b) => a.week - b.week || a.i - b.i);
      let need = 0, fs = 0, fh = 0, short = 0, by = null;
      rows.forEach((r) => {
        const o = byRow[r.i] = { need: r.left, slit: 0, hr: 0, short: 0, by: null };
        let t = r.left; need += t;
        slit.filter((s) => Math.abs(s.w - r.strip) <= 5).forEach((s) => { const g = Math.min(s.t, t); s.t -= g; t -= g; o.slit += g; fs += g; });
        const h = Math.min(hr, t); hr -= h; t -= h; o.hr += h; fh += h;
        if (t > 0.05) { o.short = t; o.by = r.week; short += t; if (by == null || r.week < by) by = r.week; }
      });
      if (need > 0.05) groups.push({ p, thk, need, onHand: slitHand + hrHand, fs, fh, short, by, rows });
    });
  });
  return { byRow, groups };
})();

// ── the app's sheet: section rows, size-group rows (subtotals), thickness rows; columns passed in ──
// col = { h: header, c: (row) => cell html, g: (rows) => group cell html, cls: header class }
const td = (v, cls = '') => `<td class="${cls}">${v}</td>`;
const sum = (rows, k) => rows.reduce((t, r) => t + r[k], 0);
function sheet(cols, { total = true } = {}) {
  const head = `<tr><th class="sticky">Size</th><th class="n">Thk</th>${cols.map((c) => `<th class="${c.cls ?? 'n'}"${c.title ? ` title="${c.title}"` : ''}>${c.h}</th>`).join('')}</tr>`;
  const span = cols.length + 2;
  let body = '';
  ['SHS', 'RHS'].forEach((sec) => {
    body += `<tr class="sec"><td class="sticky" colspan="${span}">${sec}</td></tr>`;
    [...new Set(ROWS.filter((r) => r.sec === sec).map((r) => r.size))].forEach((size) => {
      const rows = ROWS.filter((r) => r.sec === sec && r.size === size);
      body += `<tr class="grp"><td class="sticky size"><span class="caret" aria-hidden="true">▾</span>${size}</td><td></td>${cols.map((c) => (c.g ? c.g(rows) : `<td class="${c.rule ? 'rule' : ''}"></td>`)).join('')}</tr>`;
      body += rows.map((r) => `<tr class="row"><td class="sticky"></td>${td(r.thk, 'n')}${cols.map((c) => c.c(r)).join('')}</tr>`).join('');
    });
  });
  if (total) body += `<tr class="tot"><td class="sticky">South</td><td></td>${cols.map((c) => (c.g ? c.g(ROWS).replace('<td', '<td data-t') : `<td class="${c.rule ? 'rule' : ''}"></td>`)).join('')}</tr>`;
  return `<div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
const C = {
  buffer: { h: 'Buffer', c: (r) => (r.buffer == null ? td('MTO', 'n mto') : td(r.buffer, 'n')) },
  open: { h: 'Open', c: (r) => td(f(r.open), 'n'), g: (rs) => td(f(sum(rs, 'open')), 'n') },
  oct: { h: 'Oct', c: (r) => td(f(r.oct), 'n'), g: (rs) => td(f(sum(rs, 'oct')), 'n') },
  ao: { h: 'Aug–Oct', c: (r) => td(f(r.ao), 'n'), g: (rs) => td(f(sum(rs, 'ao')), 'n') },
  l30: { h: 'L30', c: (r) => td(f(r.l30), 'n'), g: (rs) => td(f(sum(rs, 'l30')), 'n') },
  l90: { h: 'L90', c: (r) => td(f(r.l90), 'n'), g: (rs) => td(f(sum(rs, 'l90')), 'n') },
  ytd: { h: 'YTD / mo', title: 'Invoiced since 1 Apr, per month the plant has invoiced (#330)', c: (r) => td(f(r.ytdMo), 'n'), g: (rs) => td(f(sum(rs, 'ytdMo')), 'n') },
  indent: { h: 'Indent', cls: 'n rule', rule: true, c: (r) => td(r.indent || '–', 'n rule'), g: (rs) => td(sum(rs, 'indent'), 'n rule') },
  pending: { h: 'Pending', title: 'Pending to Serve, T (raw 12-Nov snapshot here)', c: (r) => td(f(r.pending), 'n'), g: (rs) => td(f(sum(rs, 'pending')), 'n') },
  add: { h: 'Add', title: 'Pending − stock − Planned still to make, up to the next 10; under 2 T raises nothing', c: (r) => (r.add ? td(`+${r.add}`, 'n add') : r.gap > 0.05 ? td(`${f(r.gap)} short`, 'n quiet') : td('–', 'n')), g: (rs) => td(sum(rs, 'add') ? `+${sum(rs, 'add')}` : '–', 'n add') },
  planned: { h: 'Planned', cls: '', c: (r) => td(`<span class="sugg">${r.planned}</span>`), g: (rs) => td(sum(rs, 'planned')) },
  plant: { h: 'Plant', cls: '', c: (r) => td(PLANT[r.p]) },
};
const whenCell = (o) => (o.short > 0.05 ? `${td(f(o.short), 'n short rule')}${td(WHEN[o.by], 'when')}` : o.need > 0.05 ? `${td('covered', 'n ok rule')}${td('')}` : `${td('–', 'n rule')}${td('')}`);
const coilLine = { h: 'Coil short', cls: 'n rule', rule: true, c: (r) => whenCell(COIL.byRow[r.i]), g: (rs) => td('', 'rule') + td('') };
const coilWhen = { h: 'When', cls: '', c: () => '', g: () => '' };
const SALES = [C.oct, C.ao, C.l30, C.l90, C.ytd];

// ── A: sales fold away behind one button; coil short on every line ───────────────────────────────
let showSales = false;
function A() {
  const salesCols = showSales ? SALES : [];
  const cols = [C.buffer, C.open, ...salesCols, C.indent, C.pending, C.add, C.planned, C.plant, coilLine, coilWhen];
  return { name: 'A · Sales fold away, coil on each line',
    intro: `<p>One sheet. The five sales columns sit behind one button, shut by default (<b>11 columns</b> shut, 16 open). Coil short is on each line. The coil goes to lines in week order, so <b>Hyderabad's 18.9 T of 1.6 mm HR covers part of 25x25 and every other 1.6 line reads fully short.</b> Several lines share one coil, which a per-line figure hides.</p>
      <div style="margin-top:8px"><button type="button" class="btn" id="toggleSales" aria-pressed="${showSales}">${showSales ? 'Hide sales ▾' : 'Show sales (5) ▸'}</button></div>`,
    html: sheet(cols) };
}

// ── B: coil once per plant × thickness above the sheet; sales in one cell ─────────────────────────
function B() {
  const coil = COIL.groups.map((g) => `<tr class="row">${td(PLANT[g.p])}${td(`${g.thk} mm`)}${td(f(g.need), 'n')}${td(f(g.onHand), 'n')}${td(f(g.fs + g.fh), 'n')}${g.short > 0.05 ? td(f(g.short), 'n short') + td(WHEN[g.by], 'when') : td('covered', 'n ok') + td('')}${td(g.rows.map((r) => r.size).join(', '), 'quiet')}</tr>`).join('');
  const salesOne = { h: 'Sales', cls: 'rule', rule: true, title: 'L30 · L90 · YTD per month. Hover for Oct and Aug–Oct.',
    c: (r) => `<td class="rule" title="Oct ${f(r.oct)} · Aug–Oct ${f(r.ao)}">${f(r.l30)} · ${f(r.l90)} · <b>${f(r.ytdMo)}</b>/mo</td>` };
  return { name: 'B · Coil on top, sales in one cell',
    intro: '<p>Coil gets one small table above the sheet: one line per plant and thickness, because the lines draw on the same coil. The sheet has no coil column. Sales fit in one cell per line, read as <b>L30 · L90 · YTD per month</b>; hover for Oct and Aug–Oct (<b>10 columns</b>).</p>',
    html: `<div style="display:grid;gap:6px"><h2>Coil for the plan</h2><div class="scroll coil"><table><thead><tr><th>Plant</th><th>Thk</th><th class="n">Need T</th><th class="n">On hand</th><th class="n" title="Slit coil that fits the strip, plus HR">Usable</th><th class="n">Short T</th><th>When</th><th>Lines</th></tr></thead><tbody>${coil}</tbody></table></div></div>
      <div style="display:grid;gap:6px;margin-top:12px"><h2>Lines</h2>${sheet([C.buffer, C.open, salesOne, C.indent, C.pending, C.add, C.planned, C.plant])}</div>` };
}

// ── C: one sheet, three views of the same lines ───────────────────────────────────────────────────
let cView = 'plan';
function Cv() {
  const views = { plan: 'Plan', sales: 'Sales', coil: 'Coil' };
  const seg = `<div class="seg" role="group" aria-label="Sheet view" style="margin-top:8px">${Object.entries(views).map(([k, v]) => `<button type="button" class="btn" data-view="${k}" aria-pressed="${cView === k}">${v}</button>`).join('')}</div>`;
  let html;
  if (cView === 'plan') html = sheet([C.buffer, C.open, C.indent, C.pending, C.add, C.planned, C.plant]);
  else if (cView === 'sales') html = sheet([C.open, ...SALES.map((c, k) => (k === 0 ? { ...c, cls: 'n rule', c: (r) => c.c(r).replace('class="n"', 'class="n rule"') } : c)), C.planned, C.plant]);
  else {
    const rows = COIL.groups.map((g) => g.rows.map((r) => { const o = COIL.byRow[r.i];
      return `<tr class="row">${td(r.sec + ' ' + r.size, 'sticky')}${td(r.thk, 'n')}${td(`<span class="sugg">${r.planned}</span>`)}${td(f(r.left), 'n rule')}${td(r.strip, 'n')}${td(f(o.slit), 'n')}${td(f(o.hr), 'n')}${whenCell(o)}</tr>`; }).join('') +
      `<tr class="grp"><td class="sticky size" colspan="3">${PLANT[g.p]} ${g.thk} mm · on hand ${f(g.onHand)} T</td>${td(f(g.need), 'n rule')}${td('')}${td(f(g.fs), 'n')}${td(f(g.fh), 'n')}${g.short > 0.05 ? td(f(g.short), 'n short rule') + td(WHEN[g.by], 'when') : td('covered', 'n ok rule') + td('')}</tr>`).join('');
    html = `<div class="scroll"><table><thead><tr><th class="sticky">Size</th><th class="n">Thk</th><th>Planned</th><th class="n rule">Still to make</th><th class="n">Strip mm</th><th class="n">From slit</th><th class="n">From HR</th><th class="n rule">Short T</th><th>When</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return { name: 'C · One sheet, three views',
    intro: `<p>The same lines with a switch for what sits beside them: <b>Plan</b> (Buffer, Open, Indent, Pending, Add, Planned, Plant; 9 columns), <b>Sales</b> (the five sales columns) or <b>Coil</b> (lines grouped by plant and thickness, with a total line each).</p>${seg}`,
    html };
}

const VARIANTS = { a: A, b: B, c: Cv };
const KEYS = Object.keys(VARIANTS);
const current = () => (KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a');
function render() {
  const v = VARIANTS[current()]();
  document.getElementById('intro').innerHTML = v.intro;
  document.getElementById('view').innerHTML = v.html + '<p class="note" style="margin-top:10px">Not on the sheet, as decided: the new-thickness warning (Masters tab, #329) and Indent changes (the change list under the sheet, #332). Coil counts slit coil that fits the strip ± 5 mm, then HR of the same thickness, 1 : 1, coil on hand only.</p>';
  document.getElementById('label').textContent = v.name;
  const t = document.getElementById('toggleSales');
  if (t) t.addEventListener('click', () => { showSales = !showSales; render(); });
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { cView = b.dataset.view; render(); }));
}
const go = (d) => { const i = (KEYS.indexOf(current()) + d + KEYS.length) % KEYS.length; location.hash = KEYS[i]; };
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
});
window.addEventListener('hashchange', render);
render();
</script>
