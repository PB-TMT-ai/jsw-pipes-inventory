<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<!--
  PROTOTYPE — throwaway. Ticket #254 (map #248).
  Question: what does the monthly campaign screen look like, and which cells does the planner type into?
  Three structurally different layouts on one page, switched from the bottom bar (or ← / →):
    #sheet — one table per region, a row per size × thickness band
    #grid  — size × thickness matrix (like the source Excel), tap a cell to edit it in a side panel
    #steps — two steps: 1 type the need, 2 hand rows to plants on a board
  Data: live database snapshot taken 4-Nov-2026 — opening stock on 1 Nov (produced − invoiced to 31 Oct,
  per plant), October and Aug–Oct invoices by shipping plant. NOT independently verified.
  Monthly Indent starts blank (it is typed by hand); "Fill example indents" puts in example figures.
  No persistence: everything lives in memory and resets on reload.
-->
<style>
/* Layout: a planner's working sheet — dense tables on a quiet slate ground, indigo for what you can type, amber/red only for state. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2230; --ink-2:#4b5466; --ink-3:#6b7385; --line:#dfe3ea; --line-2:#eef0f4;
  --accent:#3f46c8; --accent-soft:#eceefd; --input:#fbfbff;
  --amber:#9a5b00; --amber-soft:#fff3d6; --red:#b42318; --red-soft:#fde8e6; --green:#1f7a4d; --green-soft:#e3f4ea;
  --bar:#1c2230; --bar-ink:#ffffff;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#1a1e27; --ink:#e7eaf0; --ink-2:#b4bbc9; --ink-3:#8f97a8; --line:#2d3341; --line-2:#232835;
  --accent:#9aa1ff; --accent-soft:#252a52; --input:#1f2333;
  --amber:#f2b648; --amber-soft:#3a2c10; --red:#ff8a7e; --red-soft:#3d1a17; --green:#6fd3a0; --green-soft:#16301f;
  --bar:#e7eaf0; --bar-ink:#12151c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#1a1e27; --ink:#e7eaf0; --ink-2:#b4bbc9; --ink-3:#8f97a8; --line:#2d3341; --line-2:#232835;
  --accent:#9aa1ff; --accent-soft:#252a52; --input:#1f2333;
  --amber:#f2b648; --amber-soft:#3a2c10; --red:#ff8a7e; --red-soft:#3d1a17; --green:#6fd3a0; --green-soft:#16301f;
  --bar:#e7eaf0; --bar-ink:#12151c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-head);font-size:20px;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-head);font-size:15px;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px}
.muted{color:var(--ink-3)}
.proto{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:3px;align-self:flex-start}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 11px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#12151c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#12151c}}
button.act{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:6px;font:inherit;cursor:pointer}
button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.act[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.pill.draft{background:var(--accent-soft);color:var(--accent)}
.pill.final{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.kpis{display:flex;flex-wrap:wrap;gap:6px 18px}
.kpi b{font-family:var(--f-num);font-weight:500}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:4px 7px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-weight:500;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:var(--panel);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
tr.size td{background:var(--line-2);font-weight:600;font-size:12px;padding-top:6px}
tr.size td .muted{font-weight:400}
td.typed{background:var(--input)}
input.cell{width:62px;font:inherit;font-family:var(--f-num);font-size:12px;text-align:right;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--input);color:var(--ink)}
input.cell::placeholder{color:var(--ink-3)}
input.cell.over{border-color:var(--accent);background:var(--accent-soft)}
select.cell{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--input);color:var(--ink);max-width:130px}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.grey{background:var(--line-2);color:var(--ink-3)}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
/* compact sheet: columns as wide as their content, short rows */
.scroll.fit{width:fit-content;max-width:100%}
table.tight{width:auto;min-width:0;line-height:1.2}
table.tight th,table.tight td{padding:2px 6px}
table.tight th{white-space:normal;vertical-align:bottom;line-height:1.15;max-width:64px}
table.tight td.sz{font-weight:600}
table.tight td.sec{color:var(--ink-3);font-size:11px}
table.tight tr.newsize td{border-top:1px solid var(--line)}
table.tight tr.repeat td.sz{color:var(--ink-3);font-weight:400}
table.tight input.cell{width:46px;height:20px;padding:1px 4px}
table.tight .split input.cell{width:38px}
table.tight select.cell{height:20px;padding:0 2px;max-width:92px}
table.tight .tag{padding:0 4px}
select.cell.need{border-color:var(--accent);border-style:dashed;color:var(--accent)}
sup.band{color:var(--accent);cursor:help;font-size:10px}
tr.moved td{box-shadow:inset 3px 0 0 var(--amber)}
tr.moved td~td{box-shadow:none}
.split{display:inline-flex;gap:4px;align-items:center}
.split input.cell{width:52px}
.split .bad{color:var(--red)}
.split .ok{color:var(--green)}
.sub{color:var(--ink-3);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-3);font-size:12px}
.plantsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.plantsum .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.plantsum .card b{font-family:var(--f-num);font-size:18px;font-weight:500}
/* grid variant */
.matrix{min-width:760px}
.matrix td.c{padding:2px;width:74px}
.cellbtn{display:flex;flex-direction:column;align-items:stretch;gap:1px;width:100%;min-height:42px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit;padding:3px 5px;cursor:pointer;text-align:right}
.cellbtn .p{font-family:var(--f-num);font-size:13px;font-weight:500}
.cellbtn .s{font-size:10px;color:var(--ink-3);display:flex;justify-content:space-between;gap:4px}
.cellbtn.zero .p{color:var(--ink-3);font-weight:400}
.cellbtn.need{border-color:var(--accent)}
.cellbtn.amber{border-color:var(--amber);background:var(--amber-soft)}
.cellbtn.red{border-color:var(--red);background:var(--red-soft)}
.cellbtn.choose{border-style:dashed;border-color:var(--accent)}
.cellbtn[aria-current="true"]{outline:2px solid var(--accent)}
.nocell{display:block;min-height:42px;border-radius:5px;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line-2) 5px 6px)}
.gridwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}

.drawer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
.drawer dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.drawer dt{color:var(--ink-3)}
.drawer dd{margin:0;font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.drawer .field{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* steps variant */
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.col header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col header b{font-family:var(--f-num);font-weight:500}
.col.choose header{background:var(--accent-soft)}
.col.gap header{background:var(--red-soft)}
.col ul{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
.col li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line-2)}
.col li .btns{display:flex;gap:4px}
.col li button{border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:4px;font:inherit;font-size:11px;padding:2px 6px;cursor:pointer}
.empty{padding:14px 12px;color:var(--ink-3)}
/* switcher */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:4px;background:var(--bar);color:var(--bar-ink);border-radius:999px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.switcher button{border:0;background:transparent;color:var(--bar-ink);font:inherit;font-size:16px;width:34px;height:34px;border-radius:50%;cursor:pointer}
.switcher span{font-size:13px;padding:0 6px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.cellbtn,button{transition:background .12s,border-color .12s}}
</style>

const PLANTS = {hyderabad:{name:'Hyderabad',short:'Hyd',letter:'N',region:'South'},lepakshi:{name:'Lepakshi',short:'Lep',letter:'L',region:'South'},npmd:{name:'NPMD',short:'NPMD',letter:'P',region:'West'},tapi:{name:'Tapi',short:'Tapi',letter:'T',region:'West'}};
const REGION_PLANTS = {South:['hyderabad','lepakshi'],West:['npmd','tapi']};
const BANDS = [1.2,1.6,2.0,2.5,3.0,4.0,5.0,6.0];
const BAND_NOTE = {3:'also 2.8 · 2.9 · 3.2', 2:'also 1.8 · 2.2'};

// ── rows ──
const rows = DATA.rows.map((r,i)=>({...r,id:i,key:`${r.region}|${r.size}|${r.thk}`,
  indent:null, typed:null, typedAgainst:null, choice:r.plants.length===1?r.plants[0]:null, split:{}}));
const state = {region:'South', view:'region', plant:null, only:true, variant:'sheet', sel:null, step:1, final:{South:null,West:null}, log:[], example:{South:false,West:false}};

const f1 = n => (Math.round(n*10)/10).toFixed(1);
const fmt = n => n===0 ? '–' : f1(n);
const ceil10 = n => Math.ceil(n/10)*10;
function regionSum(r, k){ return REGION_PLANTS[r.region].reduce((s,p)=>s+(r.byPlant[p]?.[k]||0),0) }
function opening(r){ return regionSum(r,'open') }
function suggested(r){
  const ind = r.indent||0, open = opening(r);
  const base = (r.type==='Buffer' && r.buffer) ? Math.max(ind, r.buffer) : ind;
  return Math.max(0, ceil10(Math.max(0, base - open)));
}
function planned(r){ return r.typed!=null ? r.typed : suggested(r) }
function moved(r){ return r.typed!=null && r.typedAgainst!==suggested(r) }
function splitSum(r){ return Object.values(r.split).reduce((s,v)=>s+(+v||0),0) }
function assign(r){ // → {kind:'gap'|'none'|'choose'|'one'|'split', plant, ok}
  const P = planned(r);
  if (!r.plants.length) return {kind: P>0?'gap':'none'};
  if (P===0) return {kind:'none'};
  if (r.choice==='split') return {kind:'split', ok: Math.abs(splitSum(r)-P)<1e-9};
  if (!r.choice) return {kind:'choose'};
  return {kind:'one', plant:r.choice};
}
function share(r, p){ const a=assign(r); if(a.kind==='one') return a.plant===p?planned(r):0; if(a.kind==='split') return +r.split[p]||0; return 0 }
function unticked(r){ return REGION_PLANTS[r.region].filter(p=>!r.plants.includes(p) && ((r.byPlant[p]?.ao||0)>0 || (r.byPlant[p]?.open||0)>0.5)) }
function quiet(r){ return !(opening(r)>0.5 || regionSum(r,'ao')>0 || (r.type==='Buffer'&&r.buffer) || r.indent!=null || r.typed!=null) }
function regionRows(){ return rows.filter(r=>r.region===state.region) }
function visibleRows(){ return regionRows().filter(r=>!state.only || !quiet(r)) }
function blockers(region){ return rows.filter(r=>r.region===region).filter(r=>{const a=assign(r); return a.kind==='choose' || (a.kind==='split'&&!a.ok)}) }
function bandLabel(t){ return t.toFixed(1) }
function sizeKey(s){ const nb=s.endsWith('NB'); const [a,b]=nb?[parseInt(s),0]:s.split('x').map(Number); return [nb?0:(a===b?1:2), a, b] }
function bySize(list){ const m=new Map(); list.forEach(r=>{ if(!m.has(r.size)) m.set(r.size,[]); m.get(r.size).push(r) }); return [...m.entries()].sort((x,y)=>{const a=sizeKey(x[0]),b=sizeKey(y[0]);return a[0]-b[0]||a[1]-b[1]||a[2]-b[2]}) }
function plantSplitText(r,k){ return REGION_PLANTS[r.region].map(p=>`${PLANTS[p].short} ${fmt(r.byPlant[p]?.[k]||0)}`).join(' · ') }

// ── edits ──
function setIndent(r, v){ r.indent = v===''||v==null ? null : Math.max(0, +v); afterEdit(r,'Indent') }
function setPlanned(r, v){
  if (v===''||v==null){ r.typed=null; r.typedAgainst=null }
  else { r.typed=Math.max(0,+v); r.typedAgainst=suggested(r) }
  afterEdit(r,'Planned');
}
function setChoice(r, v){ r.choice = v||null; if(v==='split' && !Object.keys(r.split).length){ const P=planned(r); r.split={[r.plants[0]]:P,[r.plants[1]]:0} } afterEdit(r,'Plant') }
function setSplit(r, p, v){ r.split[p] = v===''?0:Math.max(0,+v); afterEdit(r,'Split') }
function afterEdit(r, what){ if(state.final[r.region]) state.log.unshift(`${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${r.size} ${bandLabel(r.thk)} · ${what} changed after Finalise`); render() }

// ── shared pieces ──
function statusBar(){
  const reg=state.region, list=regionRows();
  const need=list.reduce((s,r)=>s+planned(r),0);
  const gap=list.filter(r=>assign(r).kind==='gap').reduce((s,r)=>s+planned(r),0);
  const bl=blockers(reg), mv=list.filter(moved).length;
  const fin=state.final[reg];
  const plantTot = REGION_PLANTS[reg].map(p=>`<span class="kpi">${PLANTS[p].name} <b>${f1(list.reduce((s,r)=>s+share(r,p),0))}</b></span>`).join('');
  return `<span class="pill ${fin?'final':'draft'}">${fin?'Final · '+fin:'Draft'}</span>${state.example[reg]?'<span class="pill warn" title="Monthly Indent is typed by hand. These are October sales rounded up to 10, filled in only to show the screen working.">Example indents, not real</span>':''}
    <div class="kpis"><span class="kpi">Planned <b>${f1(need)}</b> T</span>${plantTot}
    <span class="kpi">No plant can make <b>${f1(gap)}</b></span></div>
    ${bl.length?`<span class="pill warn">${bl.length} row${bl.length>1?'s':''} need a plant</span>`:''}
    ${mv?`<span class="pill warn">${mv} suggestion${mv>1?'s':''} moved</span>`:''}
    <button class="act primary" id="finalise" ${bl.length||fin?'disabled':''} title="${bl.length?'Give every row with Planned > 0 a plant first':''}">${fin?'Finalised':'Finalise '+reg}</button>
    ${state.log.length?`<span class="sub">Change log: ${state.log.slice(0,2).join(' · ')}${state.log.length>2?' …':''}</span>`:''}`;
}
function plantControl(r){
  const a=assign(r), P=planned(r);
  if (!r.plants.length) return P>0?'<span class="tag red" title="No plant is ticked to make this row (#250)">No plant</span>':'<span class="sub">—</span>';
  if (r.plants.length===1) return `<span class="sub" title="Only plant ticked, assigned automatically">${PLANTS[r.plants[0]].name} (auto)</span>`;
  const opts = `<option value="">Choose…</option>${r.plants.map(p=>`<option value="${p}" ${r.choice===p?'selected':''}>${PLANTS[p].name}</option>`).join('')}<option value="split" ${r.choice==='split'?'selected':''}>Split…</option>`;
  let html = `<select class="cell ${a.kind==='choose'?'need':''}" title="${a.kind==='choose'?'Needs a plant':''}" id="pl-${r.id}" data-act="choice" data-id="${r.id}" aria-label="Plant for ${r.size} ${bandLabel(r.thk)}">${opts}</select>`;
  if (r.choice==='split'){
    const s=splitSum(r);
    html += ` <span class="split">${r.plants.map(p=>`<input class="cell" id="sp-${r.id}-${p}" data-act="split" data-p="${p}" data-id="${r.id}" value="${r.split[p]??''}" inputmode="decimal" aria-label="${PLANTS[p].name} share"> <span class="sub">${PLANTS[p].short}</span>`).join(' ')} <span class="${Math.abs(s-P)<1e-9?'ok':'bad'}">${Math.abs(s-P)<1e-9?'✓':'= '+f1(s)+' ≠ '+P}</span></span>`;
  }
  return html;
}
function notes(r){
  const u=unticked(r).map(p=>`<span class="tag amber" title="${PLANTS[p].name} made or sold this but is not ticked on the master">${PLANTS[p].short} not ticked</span>`).join(' ');
  const band = BAND_NOTE[r.thk]?`<span class="sub" title="Thickness band (#249, #258)">${BAND_NOTE[r.thk]}</span>`:'';
  return [band,u].filter(Boolean).join(' ');
}
function thkCell(r){ return bandLabel(r.thk)+(BAND_NOTE[r.thk]?`<sup class="band" title="Band also holds ${BAND_NOTE[r.thk].replace('also ','')} mm (#249, #258)">*</sup>`:'') }
function untickedTags(r){ return unticked(r).map(p=>`<span class="tag amber" title="${PLANTS[p].name} made or sold this but is not ticked on the master (#250)">${PLANTS[p].short} not ticked</span>`).join(' ') }
function outsideBlock(){
  const list=DATA.outside.filter(o=>o.region===state.region);
  if(!list.length) return '';
  const tr=list.map(o=>{const ps=Object.keys(o.byPlant); const sum=k=>ps.reduce((s,p)=>s+(o.byPlant[p][k]||0),0);
    return `<tr><td>${o.size}</td><td class="num">${bandLabel(o.thk)}</td><td class="r num">${fmt(sum('open'))}</td><td class="r num">${fmt(sum('oct'))}</td><td class="r num">${fmt(sum('ao'))}</td><td class="sub">${ps.map(p=>PLANTS[p].name).join(', ')}</td></tr>`}).join('');
  return `<h2 style="margin-top:6px">Outside the plan <span class="muted" style="font-weight:400">· sizes with no master row (#258)</span></h2>
  <div class="scroll"><table style="min-width:520px"><thead><tr><th>Size</th><th>Thk</th><th class="r">Opening</th><th class="r">Oct</th><th class="r">Aug–Oct</th><th>Plant</th></tr></thead><tbody>${tr}</tbody></table></div>`;
}

// ── plant view (shared by A and B; C is its own) ──
function plantView(){
  const ps=REGION_PLANTS[state.region];
  if(!state.plant || !ps.includes(state.plant)) state.plant=ps[0];
  const p=state.plant;
  const list=regionRows().filter(r=>share(r,p)>0);
  const tabs=`<div class="seg" role="group" aria-label="Plant">${ps.map(x=>`<button id="pt-${x}" data-plant="${x}" aria-pressed="${x===p}">${PLANTS[x].name}</button>`).join('')}</div>`;
  const body = bySize(list).map(([size,rs])=>rs.map((r,i)=>{
      const sh=share(r,p), spl=assign(r).kind==='split';
      return `<tr class="${i?'repeat':'newsize'}"><td class="sz">${size}</td><td class="sec">${r.section}</td><td class="num">${thkCell(r)}</td><td class="sub">${r.type}</td><td class="r num">${r.buffer??''}</td>
      <td class="r num">${fmt(r.byPlant[p]?.open||0)}</td><td class="r num">${fmt(r.byPlant[p]?.oct||0)}</td>
      <td class="r num"><b>${f1(sh)}</b></td><td>${spl?`<span class="tag blue">split · of ${planned(r)}</span>`:''} ${moved(r)?'<span class="tag amber">moved</span>':''}</td></tr>`}).join('')).join('');
  const total=list.reduce((s,r)=>s+share(r,p),0);
  return `<div class="controls" style="justify-content:space-between">${tabs}<span class="kpi">${PLANTS[p].name}'s campaign <b class="num">${f1(total)}</b> T · ${list.length} rows</span></div>
   <div class="scroll fit" style="margin-top:8px"><table class="tight"><thead><tr><th>Size</th><th>Sec</th><th>Thk</th><th>Type</th><th class="r">Buffer</th><th class="r">Open here</th><th class="r">Oct here</th><th class="r">To make</th><th></th></tr></thead>
   <tbody>${body||`<tr><td colspan="9" class="empty">Nothing assigned to ${PLANTS[p].name} yet. Type indents, or press “Fill example indents”, then pick plants in Region view.</td></tr>`}</tbody></table></div>`;
}

// ── A: sheet ──
function variantSheet(){
  if(state.view==='plant') return plantView();
  const vis=visibleRows();
  const head=`<thead><tr><th>Size</th><th>Sec</th><th>Thk</th><th>Type</th><th class="r">Buffer</th><th>Can make</th><th class="r">Open 1 Nov</th><th class="r">Oct</th><th class="r">Aug–Oct</th><th class="r">Indent</th><th class="r">Sugg.</th><th class="r">Planned</th><th>Plant</th><th>Notes</th></tr></thead>`;
  const body=bySize(vis).map(([size,rs])=>rs.map((r,i)=>{
    const sg=suggested(r);
    return `<tr class="${moved(r)?'moved ':''}${i?'repeat':'newsize'}">
     <td class="sz">${size}</td><td class="sec">${r.section}</td>
     <td class="num">${thkCell(r)}</td>
     <td class="sub">${r.type}</td><td class="r num">${r.buffer??''}</td>
     <td class="sub">${r.plants.map(p=>PLANTS[p].letter).join(' ')||'—'}</td>
     <td class="r num" title="${plantSplitText(r,'open')}">${fmt(opening(r))}</td>
     <td class="r num" title="${plantSplitText(r,'oct')}">${fmt(regionSum(r,'oct'))}</td>
     <td class="r num" title="${plantSplitText(r,'ao')}">${fmt(regionSum(r,'ao'))}</td>
     <td class="r typed"><input class="cell" id="in-${r.id}" data-act="indent" data-id="${r.id}" value="${r.indent??''}" placeholder="–" inputmode="decimal" aria-label="Monthly Indent ${r.size} ${bandLabel(r.thk)}"></td>
     <td class="r num">${moved(r)?`<span class="tag amber" title="Suggestion moved from ${r.typedAgainst} since Planned was typed">${sg}</span>`:(sg||'–')}</td>
     <td class="r typed"><input class="cell ${r.typed!=null?'over':''}" id="pn-${r.id}" data-act="planned" data-id="${r.id}" value="${r.typed??''}" placeholder="${sg||'0'}" inputmode="decimal" aria-label="Planned ${r.size} ${bandLabel(r.thk)}"></td>
     <td>${plantControl(r)}</td><td class="sub">${untickedTags(r)}</td></tr>`}).join('')).join('');
  const hidden=regionRows().length-vis.length;
  return `<div class="scroll fit"><table class="tight">${head}<tbody>${body}</tbody></table></div>
   <div class="sub" style="margin-top:6px">${hidden?`${hidden} quiet rows hidden (no stock, no sales, no buffer, nothing typed). `:''}Hover a stock or sales figure for the per-plant split.</div>${outsideBlock()}`;
}

// ── B: grid ──
function cellClass(r){ const a=assign(r),P=planned(r); if(a.kind==='gap')return'red'; if(moved(r)||(a.kind==='split'&&!a.ok))return'amber'; if(a.kind==='choose')return'choose'; return P>0?'need':'zero' }
function variantGrid(){
  if(state.view==='plant') return plantGridView();
  const vis=visibleRows(), groups=bySize(vis);
  const head=`<thead><tr><th>Size</th>${BANDS.map(b=>`<th class="r">${b.toFixed(1)}</th>`).join('')}<th class="r">Row total</th></tr></thead>`;
  const body=groups.map(([size,rs])=>{
    const m=new Map(rs.map(r=>[r.thk,r]));
    const allm=new Map(regionRows().filter(r=>r.size===size).map(r=>[r.thk,r]));
    return `<tr><td><b>${size}</b><div class="sub">${rs[0].section} · ${rs[0].type}</div></td>${BANDS.map(b=>{
      const r=m.get(b); if(!r) return `<td class="c">${allm.get(b)?'<span class="nocell" title="Quiet row hidden"></span>':'<span class="nocell" title="No master row"></span>'}</td>`;
      const a=assign(r), P=planned(r);
      const pl = a.kind==='one'?PLANTS[a.plant].letter : a.kind==='split'?r.plants.map(p=>PLANTS[p].letter).join('+') : a.kind==='gap'?'✕':a.kind==='choose'?'?':'';
      return `<td class="c"><button class="cellbtn ${cellClass(r)}" id="cb-${r.id}" data-act="sel" data-id="${r.id}" aria-current="${state.sel===r.id}" aria-label="${size} ${b}: planned ${P}">
        <span class="p">${P||'0'}</span><span class="s"><span>${r.indent!=null?'I '+r.indent:(r.buffer?'B '+r.buffer:'')}</span><span>${pl}</span></span></button></td>`}).join('')}
      <td class="r num">${f1(rs.reduce((s,r)=>s+planned(r),0))}</td></tr>`}).join('');
  const r = state.sel!=null ? rows[state.sel] : null;
  const drawer = r && r.region===state.region ? drawerHtml(r) : `<div class="drawer"><h2>Pick a cell</h2><div class="muted">Each cell shows <b>Planned</b> (big), then the typed Indent (I) or Buffer (B), and the plant letter: N Hyderabad, L Lepakshi, P NPMD, T Tapi. “?” needs a plant, ✕ no plant can make it.</div></div>`;
  return `<div class="gridwrap"><div style="min-width:0"><div class="scroll"><table class="matrix">${head}<tbody>${body}</tbody></table></div>${outsideBlock()}</div>${drawer}</div>`;
}
function drawerHtml(r){
  const sg=suggested(r);
  return `<div class="drawer"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h2>${r.section} ${r.size} · ${bandLabel(r.thk)} mm</h2><span class="sub">${r.region}</span></div>
   <div class="sub">${r.buffer?`Buffer ${r.buffer} MT`:'MTO'} · can be made at ${r.plants.map(p=>PLANTS[p].name).join(', ')||'no plant'} ${notes(r)}</div>
   <dl><dt>Opening 1 Nov</dt><dd>${f1(opening(r))}</dd><dt class="sub">by plant</dt><dd class="sub">${plantSplitText(r,'open')}</dd>
   <dt>Oct invoiced</dt><dd>${f1(regionSum(r,'oct'))}</dd><dt>Aug–Oct invoiced</dt><dd>${f1(regionSum(r,'ao'))}</dd></dl>
   <div class="field"><label for="in-${r.id}">Monthly Indent</label><input class="cell" id="in-${r.id}" data-act="indent" data-id="${r.id}" value="${r.indent??''}" placeholder="–" inputmode="decimal"></div>
   <div class="field"><span>Suggested <span class="sub">${r.buffer?`max(Indent, ${r.buffer}) − ${f1(opening(r))}`:`Indent − ${f1(opening(r))}`}, up to 10</span></span><span class="num">${moved(r)?`<span class="tag amber">${sg} · moved</span>`:sg}</span></div>
   <div class="field"><label for="pn-${r.id}">Planned</label><input class="cell ${r.typed!=null?'over':''}" id="pn-${r.id}" data-act="planned" data-id="${r.id}" value="${r.typed??''}" placeholder="${sg}" inputmode="decimal"></div>
   <div class="field" style="flex-wrap:wrap"><span>Plant</span><span>${plantControl(r)}</span></div></div>`;
}
function plantGridView(){
  const ps=REGION_PLANTS[state.region]; if(!state.plant||!ps.includes(state.plant)) state.plant=ps[0]; const p=state.plant;
  const list=regionRows().filter(r=>share(r,p)>0), groups=bySize(list);
  const tabs=`<div class="seg" role="group" aria-label="Plant">${ps.map(x=>`<button id="pt-${x}" data-plant="${x}" aria-pressed="${x===p}">${PLANTS[x].name}</button>`).join('')}</div>`;
  const body=groups.map(([size,rs])=>{const m=new Map(rs.map(r=>[r.thk,r]));return `<tr><td><b>${size}</b></td>${BANDS.map(b=>{const r=m.get(b);return `<td class="c">${r?`<span class="cellbtn need" style="cursor:default"><span class="p">${f1(share(r,p))}</span><span class="s"><span>open ${fmt(r.byPlant[p]?.open||0)}</span><span>${assign(r).kind==='split'?'split':''}</span></span></span>`:'<span class="nocell"></span>'}</td>`}).join('')}<td class="r num">${f1(rs.reduce((s,r)=>s+share(r,p),0))}</td></tr>`}).join('');
  return `<div class="controls" style="justify-content:space-between">${tabs}<span class="kpi">${PLANTS[p].name}'s campaign <b class="num">${f1(list.reduce((s,r)=>s+share(r,p),0))}</b> T</span></div>
  <div class="scroll" style="margin-top:8px"><table class="matrix"><thead><tr><th>Size</th>${BANDS.map(b=>`<th class="r">${b.toFixed(1)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>${body||`<tr><td colspan="10" class="empty">Nothing assigned to ${PLANTS[p].name} yet.</td></tr>`}</tbody></table></div>`;
}

// ── C: steps ──
function variantSteps(){
  const stepper=`<div class="stepper"><div class="seg" role="group" aria-label="Step"><button id="st-1" data-step="1" aria-pressed="${state.step===1}">1 · Need for ${state.region}</button><button id="st-2" data-step="2" aria-pressed="${state.step===2}">2 · Give rows to plants</button></div></div>`;
  if(state.step===1){
    const vis=visibleRows();
    const body=bySize(vis).map(([size,rs])=>`<tr class="size"><td colspan="8">${rs[0].section} ${size} <span class="muted">· ${rs[0].type}</span></td></tr>`+rs.map(r=>{const sg=suggested(r);return `<tr class="${moved(r)?'moved':''}"><td class="num">${bandLabel(r.thk)}</td><td>${r.buffer?`Buffer <span class="num">${r.buffer}</span>`:'<span class="sub">MTO</span>'}</td>
      <td class="r num">${fmt(opening(r))}</td><td class="r num">${fmt(regionSum(r,'oct'))}</td><td class="r num">${fmt(regionSum(r,'ao'))}</td>
      <td class="r typed"><input class="cell" id="in-${r.id}" data-act="indent" data-id="${r.id}" value="${r.indent??''}" placeholder="–" inputmode="decimal" aria-label="Monthly Indent"></td>
      <td class="r num">${moved(r)?`<span class="tag amber">${sg}</span>`:(sg||'–')}</td>
      <td class="r typed"><input class="cell ${r.typed!=null?'over':''}" id="pn-${r.id}" data-act="planned" data-id="${r.id}" value="${r.typed??''}" placeholder="${sg||'0'}" inputmode="decimal" aria-label="Planned"></td></tr>`}).join('')).join('');
    return `${stepper}<div class="scroll" style="margin-top:8px"><table style="min-width:700px"><thead><tr><th>Thk</th><th>Type · Buffer</th><th class="r">Opening 1 Nov</th><th class="r">Oct</th><th class="r">Aug–Oct</th><th class="r">Monthly Indent</th><th class="r">Suggested</th><th class="r">Planned</th></tr></thead><tbody>${body}</tbody></table></div>
     <div style="margin-top:8px"><button class="act primary" data-step="2" id="next-step">Next: give rows to plants →</button></div>${outsideBlock()}`;
  }
  const list=regionRows().filter(r=>planned(r)>0);
  const choose=list.filter(r=>{const a=assign(r);return a.kind==='choose'||(a.kind==='split'&&!a.ok)});
  const gap=list.filter(r=>assign(r).kind==='gap');
  const li=(r,extra='')=>`<li><span>${r.section} ${r.size} · ${bandLabel(r.thk)} <span class="sub">${notes(r)}</span></span><span class="num">${extra}</span></li>`;
  const col=(cls,title,total,items,empty)=>`<section class="col ${cls}"><header><h2>${title}</h2><b>${f1(total)} T</b></header><ul>${items||`<li class="empty">${empty}</li>`}</ul></section>`;
  const chooseItems=choose.map(r=>`<li><span>${r.section} ${r.size} · ${bandLabel(r.thk)}<div class="sub">${f1(planned(r))} T${r.choice==='split'?' · split does not add up':''}</div></span><span class="btns">${r.plants.map(p=>`<button data-act="give" data-id="${r.id}" data-p="${p}">→ ${PLANTS[p].short}</button>`).join('')}<button data-act="give" data-id="${r.id}" data-p="split">Split…</button></span></li>${r.choice==='split'?`<li>${plantControl(r)}</li>`:''}`).join('');
  const plantCols=REGION_PLANTS[state.region].map(p=>{const its=list.filter(r=>share(r,p)>0);
    return col('',PLANTS[p].name,its.reduce((s,r)=>s+share(r,p),0),its.map(r=>{const a=assign(r);return `<li><span>${r.section} ${r.size} · ${bandLabel(r.thk)}<div class="sub">${r.plants.length===1?'only plant':a.kind==='split'?'split':'chosen'}${moved(r)?' · suggestion moved':''}</div></span><span class="btns"><span class="num">${f1(share(r,p))}</span>${r.plants.length>1?`<button data-act="give" data-id="${r.id}" data-p="">undo</button>`:''}</span></li>`}).join(''),'Nothing here yet')}).join('');
  return `${stepper}<div class="board" style="margin-top:8px">
    ${col('choose','Choose a plant',choose.reduce((s,r)=>s+planned(r),0),chooseItems,'Every row has a plant ✓')}
    ${plantCols}
    ${col('gap','No plant can make',gap.reduce((s,r)=>s+planned(r),0),gap.map(r=>li(r,f1(planned(r)))).join(''),'None')}
  </div>${outsideBlock()}`;
}

// ── render ──
function render(){
  const focusId=document.activeElement?.id, selStart=document.activeElement?.selectionStart;
  document.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.region===state.region));
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===state.view));
  document.querySelector('.seg[aria-label="View"]').hidden = state.variant==='steps';
  document.getElementById('status').innerHTML=statusBar();
  const main=document.getElementById('main');
  main.innerHTML = state.variant==='grid'?variantGrid():state.variant==='steps'?variantSteps():variantSheet();
  document.getElementById('sw-label').textContent=VARIANTS.find(v=>v[0]===state.variant)[1];
  document.getElementById('legend').innerHTML=`<span><span class="tag blue">indigo</span> needs your input</span><span><span class="tag amber">amber</span> suggestion moved since you typed Planned (#252) · plant made it but isn't ticked (#250)</span><span><span class="tag red">red</span> no plant can make it (#250)</span><span>3.0 band also holds 2.8 · 2.9 · 3.2; 2.0 holds 1.8 · 2.2 (#258)</span>`;
  if(focusId){const el=document.getElementById(focusId); if(el){el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart,selStart) }catch(e){}}}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.region){state.region=t.dataset.region; state.sel=null; render()}
  else if(t.dataset.view){state.view=t.dataset.view; render()}
  else if(t.dataset.plant){state.plant=t.dataset.plant; render()}
  else if(t.dataset.step){state.step=+t.dataset.step; render()}
  else if(t.dataset.act==='sel'){state.sel=+t.dataset.id; render()}
  else if(t.dataset.act==='give'){setChoice(rows[+t.dataset.id], t.dataset.p)}
  else if(t.id==='finalise'){state.final[state.region]=new Date().toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · admin'; render()}
  else if(t.id==='fill'){regionRows().forEach(r=>{const o=regionSum(r,'oct'); r.indent = o>0 ? ceil10(o) : null}); state.example[state.region]=true; render()}
  else if(t.id==='clear'){regionRows().forEach(r=>{r.indent=null;r.typed=null;r.typedAgainst=null;r.split={};r.choice=r.plants.length===1?r.plants[0]:null}); state.final[state.region]=null; state.example[state.region]=false; render()}
  else if(t.id==='sw-prev'||t.id==='sw-next'){cycle(t.id==='sw-next'?1:-1)}
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.id==='only-active'){state.only=t.checked; render(); return}
  const r=rows[+t.dataset.id]; if(!r) return;
  if(t.dataset.act==='indent') setIndent(r,t.value);
  else if(t.dataset.act==='planned') setPlanned(r,t.value);
  else if(t.dataset.act==='choice') setChoice(r,t.value);
  else if(t.dataset.act==='split') setSplit(r,t.dataset.p,t.value);
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea,[contenteditable]')) { if(e.key==='Enter') e.target.blur(); return }
  if(e.key==='ArrowRight') cycle(1); if(e.key==='ArrowLeft') cycle(-1);
});
function cycle(d){const i=VARIANTS.findIndex(v=>v[0]===state.variant); setVariant(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0], true)}
function setVariant(v, push){ state.variant=v; if(push) location.hash=v; render() }
function fromHash(){ const h=location.hash.slice(1); setVariant(VARIANTS.some(v=>v[0]===h)?h:'sheet', false) }
window.addEventListener('hashchange',fromHash);
// open in a working state: example indents filled for South, one split shown
regionRows().forEach(r=>{const o=regionSum(r,'oct'); if(o>0) r.indent=ceil10(o)}); state.example.South=true;
fromHash();
</script>
