<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly B · Week blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared.css">
<style>.blocks{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; align-items:start}
.blk{border:1px solid var(--line); border-radius:6px; min-width:0; overflow:hidden}
.blk header{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:5px 8px; background:var(--head); border-bottom:1px solid var(--line)}
.blk header b{font-size:12.5px}
.blk header .t{font-family:var(--f-num); font-weight:500}
.blk header .over{color:var(--amber)}
.blk table{width:100%}
.blk td.size{min-width:0}
tr.pinrow td{background:var(--accent-bg)}
@media (max-width:900px){ .blocks{grid-template-columns:1fr} }
</style>
</head><body>

<div class="page">
  <div id="flow"></div>
  <div class="top"><h2 id="title"></h2><span id="ctl" style="display:contents"></span><button class="btn" data-reset hidden id="reset">Undo my moves</button></div>
  <div class="sum" id="sum"></div>
  <div class="blocks" id="blocks"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="core.js"></script>
<script src="week.js"></script>
<script>

const {P,T,WEEKS,DAYS,OCT_MADE} = WK, $ = id => document.getElementById(id);
const st = {plant:'hyderabad', order:'size'};
function render(){
  const plant=st.plant, pname=P.PLANTS[plant].name, x=WK.plan(plant, st.order);
  $('flow').innerHTML = WK.flowHtml([6]);
  $('title').textContent = `${pname} · November week sheets`;
  $('ctl').innerHTML = WK.controls(st);
  $('reset').hidden = !x.nPins;
  $('sum').innerHTML = `<span><span class="k">Planned</span> <b>${T(x.total)}</b> T</span><span><span class="k">Rows</span> <b>${x.seq.length}</b></span><span><span class="k">Size changes</span> <b>${x.changes}</b></span><span><span class="k">October made</span> <b>${T(OCT_MADE[plant])}</b> T</span>${x.nPins?`<span style="color:var(--accent)">${x.nPins} moved by planner</span>`:''}`;
  $('blocks').innerHTML = WEEKS.map((w,j)=>{
    const W=x.W[j], over=W.t>W.even*1.15;
    const rows = x.seq.map((s,i)=>({s,i})).filter(o=>x.wk[o.i]===j);
    let prev=null;
    const body = rows.map(({s,i})=>{ const r=s.r, first=r.size!==prev, pin=x.pinned(r.id); prev=r.size;
      const opts = WEEKS.map((ww,k)=>`<option value="${k}"${k===j?' selected':''}>${ww.k}</option>`).join('');
      return `<tr class="${pin?'pinrow':''}"><td class="seq">${i+1}</td><td class="l size${first?'':' rep'}">${first?r.size:'·'}</td><td class="n">${r.thk.toFixed(1)}</td><td class="n">${T(s.t)}${r.choice==='split'?'ˢ':''}</td>
        <td class="l"><select class="sel${pin?' pin':''}" data-id="${r.id}" aria-label="Week for ${r.size} ${r.thk}">${opts}</select>${pin?` <button class="btn" style="padding:0 5px" data-unpin="${r.id}">undo</button>`:''}</td></tr>` }).join('');
    return `<section class="blk"><header><b>${w.k}</b><span class="k">${w.dates} · ${w.days} days</span><span class="t ${over?'over':''}">${T(W.t)} T</span><span class="k">even ${T(W.even)} · ${W.rows} rows · ${W.changes} size changes</span></header>
      <table><thead><tr><th>#</th><th class="l">Size</th><th>Thk</th><th>T</th><th class="l">Week</th></tr></thead><tbody>${body||'<tr><td class="l" colspan="5">Nothing this week.</td></tr>'}</tbody></table></section>` }).join('');
  $('foot').innerHTML = `<div class="ask"><p><b>How to use:</b> each block is one week's sheet, the way a plant would print it. Change a row's <b>Week</b> to move it. A moved row turns blue and stays put even if the run order changes.</p></div><span>${WK.exampleNote(pname,x.total,plant)}</span><span>${WK.defaultsNote}</span><span>ˢ = split row, this plant's share.</span>`;
}
WK.wire(st, render);
document.addEventListener('change', e=>{ const s=e.target; if(!s.dataset.id) return; WK.move(st.plant, s.dataset.id, +s.value); render() });
render();

</script>
</body></html>
