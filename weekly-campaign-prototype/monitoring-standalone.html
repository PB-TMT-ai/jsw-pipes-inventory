<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring · plan vs actual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: A2's light, lean sheet. Two views on one page: the process decided so far, and option A of the weekly split. Light only, by the user's choice on #254. */
:root{
  --bg:#ffffff; --head:#f6f8fa; --ink:#1c2430; --muted:#66717d; --faint:#a3acb6; --line:#e3e7ec; --line2:#cfd5dc;
  --accent:#1f5fae; --accent-bg:#e8f0fb; --input:#f1f6fd; --input-line:#bcd0ea;
  --red:#b42318; --red-bg:#fdf1f0; --amber:#9a5b00; --amber-bg:#fff7e6; --green:#1a7f37; --green-bg:#eaf6ec;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:12px; line-height:1.4}
.page{padding-block:10px 28px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:10px; max-width:1180px}
.top{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px}
h1{font-size:14px; font-weight:600; margin:0}
h2{font-size:13px; font-weight:600; margin:0; text-wrap:balance}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:6px; overflow:hidden}
.seg button{appearance:none; border:0; background:var(--bg); color:var(--ink); font:inherit; padding:3px 10px; cursor:pointer; font-size:11.5px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.lbl{color:var(--muted); font-size:11px}
.tag{margin-left:auto; color:var(--muted); font-size:10.5px}
.note{color:var(--muted); font-size:11px; max-width:75ch}
.btn{appearance:none; font:inherit; font-weight:500; padding:2px 9px; font-size:11px; border-radius:4px; border:1px solid var(--accent); background:var(--bg); color:var(--accent); cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
a{color:var(--accent)}

/* ---------- Process view ---------- */
.flow{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.stage{border:1px solid var(--line); border-radius:6px; display:flex; flex-direction:column; min-width:0}
.stage.now{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.stage header{background:var(--head); padding:6px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:2px; border-radius:6px 6px 0 0}
.stage .n{font-family:var(--f-num); font-size:10.5px; color:var(--muted); letter-spacing:.04em}
.stage .who{color:var(--muted); font-size:11px}
.stage ul{margin:0; padding:8px 10px 10px 24px; display:flex; flex-direction:column; gap:5px}
.stage li{max-width:60ch}
.stage li b{font-weight:600}
.chip{display:inline-block; font-size:10px; font-weight:500; padding:0 6px; border-radius:9px; line-height:16px; vertical-align:1px; white-space:nowrap}
.chip.done{background:var(--green-bg); color:var(--green)}
.chip.now{background:var(--accent-bg); color:var(--accent)}
.chip.wait{background:var(--head); color:var(--muted); border:1px solid var(--line2)}
.chip.out{background:var(--red-bg); color:var(--red)}
.tk{font-family:var(--f-num); font-size:10.5px; text-decoration:none}
.arrow{display:none}
.rail{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:11px; color:var(--muted); padding:6px 10px; background:var(--head); border:1px solid var(--line); border-radius:6px}
.rail b{color:var(--ink); font-weight:500}
.side{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.box{border:1px solid var(--line); border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; min-width:0}
.box p{margin:0; max-width:65ch}
pre.diag{margin:0; font-family:var(--f-num); font-size:11px; line-height:1.45; background:var(--head); border:1px solid var(--line); border-radius:6px; padding:8px 10px; overflow-x:auto; color:var(--ink)}
@media (max-width:900px){ .flow{grid-template-columns:repeat(2, minmax(0,1fr))} .side{grid-template-columns:1fr} }
@media (max-width:560px){ .flow{grid-template-columns:1fr} .tag{margin-left:0; width:100%} }

/* ---------- Weekly view ---------- */
.sum{display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; padding:5px 10px; background:var(--head); font-size:11.5px; border:1px solid var(--line); border-radius:6px}
.sum .k{color:var(--muted)}
.sum b{font-family:var(--f-num); font-weight:500}
.weeks{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; max-width:760px}
.wk{border:1px solid var(--line); border-radius:6px; padding:5px 8px; display:flex; flex-direction:column; gap:2px; min-width:0}
.wk .h{display:flex; justify-content:space-between; gap:6px; color:var(--muted); font-size:10.5px}
.wk .h b{color:var(--ink); font-weight:600; font-size:11.5px}
.wk .t{font-family:var(--f-num); font-size:15px; font-weight:500}
.wk .t small{font-size:10.5px; color:var(--muted); font-weight:400}
.bar{height:5px; background:var(--line); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.bar i.over{background:var(--amber)}
.wk .m{font-size:10.5px; color:var(--muted)}
@media (max-width:560px){ .weeks{grid-template-columns:repeat(2, minmax(0,1fr))} }
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:6px; width:max-content; max-width:100%}
table{border-collapse:collapse; font-variant-numeric:tabular-nums; width:max-content}
th,td{padding:0 6px; height:22px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:right}
thead th{position:sticky; top:0; background:var(--head); color:var(--muted); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.05em; height:24px; border-bottom:1px solid var(--line2); z-index:2}
thead th small{display:block; text-transform:none; letter-spacing:0; font-size:9.5px; color:var(--faint); line-height:1}
th.l,td.l{text-align:left}
td.n{font-family:var(--f-num); font-size:11.5px}
td.seq{color:var(--faint); font-family:var(--f-num); font-size:10.5px}
td.size{font-family:var(--f-num); font-size:11.5px; min-width:58px}
td.size.rep{color:#b3bcc6; text-align:center}
td.sec{color:var(--muted); font-size:10.5px}
tr.wkstart td{border-top:2px solid var(--line2)}
td.w{width:62px; padding:0 3px; text-align:center}
td.w button{appearance:none; width:100%; height:18px; border:1px dashed transparent; border-radius:4px; background:none; font:inherit; font-family:var(--f-num); font-size:11px; color:var(--faint); cursor:pointer; padding:0}
td.w button:hover{border-color:var(--input-line); color:var(--accent); background:var(--input)}
td.w button.on{border:1px solid var(--input-line); background:var(--input); color:var(--ink); cursor:default; font-weight:500}
td.w button.on.pin{border-color:var(--accent); background:var(--accent-bg); color:var(--accent)}
td.mv{font-size:10.5px; color:var(--accent); text-align:left; min-width:70px}
td.mv button{appearance:none; border:0; background:none; color:var(--accent); font:inherit; font-size:10.5px; text-decoration:underline; cursor:pointer; padding:0}
.foot{color:var(--muted); font-size:11px; display:flex; flex-direction:column; gap:4px; max-width:90ch}
.steps{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px}
.steps li{display:flex; gap:6px; align-items:flex-start; border:1px solid var(--line); border-radius:6px; padding:6px 7px; font-size:11px; min-width:0; position:relative}
.steps li.here{border-color:var(--accent); background:var(--accent-bg)}
.steps .sn{flex:none; width:16px; height:16px; border-radius:50%; background:var(--head); border:1px solid var(--line2); font-family:var(--f-num); font-size:10px; display:grid; place-items:center; color:var(--muted)}
.steps li.here .sn{background:var(--accent); border-color:var(--accent); color:#fff}
.steps .chip{margin-top:3px}
@media (max-width:1000px){ .steps{grid-template-columns:repeat(4, minmax(0,1fr))} }
@media (max-width:560px){ .steps{grid-template-columns:1fr 1fr} }
.ask{border:1px solid var(--accent); border-radius:6px; padding:8px 10px; background:var(--accent-bg); max-width:90ch; display:flex; flex-direction:column; gap:4px}
.ask p{margin:0}
/* whole-flow strip shown on every screen */
.flow8{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(9, minmax(0,1fr)); gap:4px}
.flow8 li{display:flex; gap:5px; align-items:flex-start; border:1px solid var(--line); border-radius:5px; padding:4px 6px; font-size:10.5px; line-height:1.3; min-width:0}
.flow8 li b{font-weight:600}
.flow8 .sub{color:var(--muted); font-size:10px}
.flow8 .sn{flex:none; width:15px; height:15px; border-radius:50%; font-family:var(--f-num); font-size:9.5px; display:grid; place-items:center; border:1px solid var(--line2); background:var(--head); color:var(--muted)}
.flow8 li.done .sn{background:var(--green-bg); border-color:#b7dfc0; color:var(--green)}
.flow8 li.now .sn{background:var(--accent); border-color:var(--accent); color:#fff}
.flow8 li.wait{color:var(--muted)}
.flow8 li.here{border-color:var(--accent); background:var(--accent-bg)}
@media (max-width:1000px){ .flow8{grid-template-columns:repeat(4, minmax(0,1fr))} }
@media (max-width:560px){ .flow8{grid-template-columns:repeat(2, minmax(0,1fr))} }
.sel{font:inherit; font-size:11px; height:18px; padding:0 2px; border:1px solid var(--line2); border-radius:4px; background:var(--bg); color:var(--ink)}
.sel.pin{border-color:var(--accent); background:var(--accent-bg); color:var(--accent)}
.k{color:var(--muted)}
</style>

table.mx td.c{font-family:var(--f-num); font-size:11.5px; text-align:right; padding:0 8px}
table.mx td.c small, td small.k{display:block; font-family:var(--f-ui); font-size:9.5px; color:var(--muted); line-height:1.05}
tr.tot td{background:var(--head); font-weight:600}
tr.open td{background:var(--accent-bg)}
tr.sec td{background:var(--head); color:var(--muted); font-weight:600; font-size:10px; letter-spacing:.06em; height:20px; text-align:left}
th.closed{color:var(--faint)} th.cur{color:var(--accent)}
td.w.closed{background:var(--head)}
.red,.redt{color:var(--red)} .amber{color:var(--amber)} .green{color:var(--green)}
td.st{font-size:11px; text-align:left; min-width:96px}
td.st.red{font-weight:500}
.pbtn{appearance:none; border:0; background:none; font:inherit; color:var(--accent); text-decoration:underline; cursor:pointer; padding:0; font-weight:500}
.base{color:var(--faint); font-size:10px; margin-left:3px}
.mon{display:block; color:var(--faint); font-size:9.5px; line-height:1}
.chipw{font-size:10px; padding:0 5px; border-radius:8px; background:var(--amber-bg); color:var(--amber); white-space:nowrap}
.gapbar{display:flex; height:16px; border-radius:4px; overflow:hidden; border:1px solid var(--line); max-width:720px; font-size:9.5px; font-family:var(--f-num)}
.gapbar i{display:flex; align-items:center; justify-content:center; color:#fff; font-style:normal; white-space:nowrap; overflow:hidden}
.g-made{background:var(--green)} .g-plan{background:#8a96a3} .g-miss{background:var(--red)} .g-come{background:#c9d6e8; color:var(--ink)!important}
.lists{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; max-width:1100px}
.box h3{font-size:11.5px; margin:0 0 2px; font-weight:600}
.box ul{margin:0; padding-left:16px; display:flex; flex-direction:column; gap:1px}
.box li{font-size:11px}
.box li b{font-family:var(--f-num); font-weight:500}
@media (max-width:760px){ .lists{grid-template-columns:1fr} }
.rule{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
/* floating variant switcher */
.switch{position:fixed; left:50%; bottom:10px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; background:#fff; border:1px solid var(--line2); border-radius:8px; padding:5px 8px; box-shadow:0 2px 10px rgba(20,30,40,.12); z-index:10; font-size:11px; max-width:calc(100vw - 32px); flex-wrap:wrap}
.switch b{font-weight:600}

  r.choice = r.plants.slice().sort((a,b)=>(r.byPlant[b]?.oct||0)-(r.byPlant[a]?.oct||0))[0]; });

const campaign = plant => P.rows.map(r=>({r, t:P.share(r,plant)})).filter(x=>x.t>0);

  const key = x => { const k=P.sizeKey(x.r.size); return order==='thk'

function propose(seq){
  const total = seq.reduce((s,x)=>s+x.t,0); const edges=[]; let c=0;
  WEEKS.forEach(w=>{ c+=w.days; edges.push(c/DAYS) });

  W.forEach((w,i)=>{ w.even = total*WEEKS[i].days/DAYS });

}
const regionPlants = () => P.REGION_PLANTS[st.region];
const entered = pl => { const d=window.MON.lastProd[pl]; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) };
const w1Cell = (W1, made, pl) => {
  const short = W1 - made, red = st.rule==='plant' ? stats(pl).missed>0 : (st.rule==='week' && stats(pl).nBehind>0);
  return `<span class="${red?'red':''}">${T(W1)} / ${T(made)}</span><small>${S.unentered(pl)?`<span class="amber">entered to ${entered(pl)}</span>`:'complete'}</small>`;
};

function header(){
  $('flow').innerHTML = WK.flowHtml([9]);
  $('title').textContent = `${st.region} · November: plan vs actual`;
  $('region').innerHTML = ['South','West'].map(r=>`<button data-reg="${r}" aria-pressed="${r===st.region}">${r}</button>`).join('');
  $('today').textContent = `Today: Tue 10 Nov · W1 (1–8 Nov) closed · W2 running · prototype ${st.variant}: ${VARIANTS[st.variant]}`;
  $('rule').innerHTML = Object.entries(RULES).map(([k,v])=>`<button data-rule="${k}" aria-pressed="${k===st.rule}">${v[0]}</button>`).join('');
  $('rulenote').textContent = RULES[st.rule][1];
  const ps = regionPlants().map(stats);
  const base=S.sum(ps,'base'), plan=S.sum(ps,'plan'), cred=S.sum(ps,'credited'), miss=S.sum(ps,'missed'), un=S.sum(ps,'un')+S.sum(ps,'over');
  $('sum').innerHTML = `<span><span class="k">Planned (latest)</span> <b>${T(plan)}</b> T${base!==plan?` <span class="base">Baseline ${T(base)}</span>`:''}</span>
    <span><span class="k">Made against plan</span> <b>${T(cred)}</b> T · <b>${pct(plan?cred/plan*100:null)}</b></span>
    <span class="${miss>0?'red':''}"><span class="k">Behind</span> <b>${T(miss)}</b> T</span>
    <span><span class="k">Made off plan</span> <b>${T(un)}</b> T</span>
    <span><span class="k">Month gone</span> <b>6 of 25</b> working days (24%)</span>`;
  $('switch').innerHTML = `<b>Prototype #274</b>` + Object.entries(VARIANTS).map(([k,v])=>`<div class="seg"><button data-var="${k}" aria-pressed="${k===st.variant}">${k} · ${v}</button></div>`).join('');
}

// ---------- A · monitoring folded into the #273 week screen
function viewA(){
  const pls = regionPlants(); if(!pls.includes(st.plant)) st.plant=pls[0];
  let h = `<div class="scroll"><table class="mx"><thead><tr><th class="l">Plant</th><th class="closed">W1<small>plan / made</small></th><th class="cur">W2<small>9–15 Nov</small></th><th>W3<small>16–22</small></th><th>W4<small>23–30</small></th><th>Month<small>plan</small></th><th>Made<small>vs plan</small></th><th>%</th><th>Behind</th><th>Off plan<small>made, not credited</small></th></tr></thead><tbody>`;
  const tot = {W:[0,0,0,0], plan:0, base:0, cred:0, miss:0, un:0, w1m:0};
  pls.forEach(pl=>{ const s=stats(pl);
    s.W.forEach((v,j)=>tot.W[j]+=v); tot.plan+=s.plan; tot.base+=s.base; tot.cred+=s.credited; tot.miss+=s.missed; tot.un+=s.un+s.over; tot.w1m+=s.w1made;
    h += `<tr class="${pl===st.plant?'open':''}"><td class="l"><button class="pbtn" data-open="${pl}">${P.PLANTS[pl].name}</button></td>
      <td class="c">${w1Cell(s.W[0], s.w1made, pl)}</td>${s.W.slice(1).map((v,j)=>`<td class="c">${T(v)}${v!==s.Wm[j+1]?`<small>Mon ${T(s.Wm[j+1])}</small>`:''}</td>`).join('')}
      <td class="c">${T(s.plan)}${s.base!==s.plan?`<small>Base ${T(s.base)}</small>`:''}</td><td class="c">${T(s.credited)}</td><td class="c">${pct(s.plan?s.credited/s.plan*100:null)}</td>
      <td class="c ${s.missed>0?'red':''}">${n0(s.missed)}${s.nBehind?`<small>${s.nBehind} rows</small>`:(s.missed>0?'<small>W1 tonnes</small>':'')}</td><td class="c">${n0(s.un+s.over)}</td></tr>` });
  h += `<tr class="tot"><td class="l">${st.region}</td><td class="c">${T(tot.W[0])} / ${T(tot.w1m)}</td>${tot.W.slice(1).map(v=>`<td class="c">${T(v)}</td>`).join('')}<td class="c">${T(tot.plan)}</td><td class="c">${T(tot.cred)}</td><td class="c">${pct(tot.cred/tot.plan*100)}</td><td class="c">${n0(tot.miss)}</td><td class="c">${n0(tot.un)}</td></tr></tbody></table></div>`;
  const s = stats(st.plant);
  h += `<div class="top"><h2>${P.PLANTS[st.plant].name}: rows by week, plan vs made</h2><span class="k">Coil columns from the #273 screen left out here to keep the question clear.</span></div>
   <div class="scroll"><table><thead><tr><th>#</th><th class="l">Sec</th><th class="l">Size</th><th>Thk</th><th class="closed">W1<small>plan · made</small></th><th class="cur">W2</th><th>W3</th><th>W4</th><th>Plan<small>latest</small></th><th>Made</th><th>%</th><th class="l">Status</th></tr></thead><tbody>`;
  let prev=null;
  s.L.forEach((x,i)=>{ const r=x.r, first=r.size!==prev; prev=r.size;
    const w = [1,2,3].map(j=>`<td class="w"><span class="n">${x.o.w[j]?T(x.o.w[j]):'·'}</span>${x.o.w[j]!==x.o.mon[j]?`<span class="mon">was ${T(x.o.mon[j])} on Mon</span>`:''}</td>`).join('');
    const w1 = x.o.w[0]||x.mk ? `<span class="w1 n">${x.o.w[0]?T(x.o.w[0]):'–'} · ${n0(x.mk)}</span>${x.o.mon[0]!==x.o.w[0]?`<span class="mon">was ${T(x.o.mon[0])} on Mon</span>`:''}` : '<span class="k">·</span>';
    h += `<tr><td class="seq">${i+1}</td><td class="l sec">${first?r.section:''}</td><td class="l size${first?'':' rep'}">${first?r.size:'·'}</td><td class="n">${r.thk.toFixed(1)}</td>
      <td class="w closed">${w1}</td>${w}<td class="n">${T(x.plan)}${x.base!==x.plan?`<span class="base">B ${T(x.base)}</span>`:''}</td><td class="n">${n0(x.mk)}</td><td class="n">${pct(x.pct)}</td><td class="st ${x.c}">${x.s}</td></tr>` });
  const un = S.unplanned.filter(u=>u.pl===st.plant);
  if(un.length) h += `<tr class="sec"><td colspan="12">MADE OFF PLAN · not credited to any row · ${f1(S.sum(un,'t'))} T</td></tr>` + un.map(u=>`<tr><td></td><td class="l" colspan="3">${u.label}</td><td class="w closed n">${f1(u.t)}</td><td colspan="7" class="l k">${u.why}</td></tr>`).join('');
  h += `</tbody></table></div>`;
  return h;
}

// ---------- B · four columns added to A2 (month grain, region rows)
function viewB(){
  const reg = st.region, pls = regionPlants();
  const byRow = {};
  pls.forEach(pl=>stats(pl).L.forEach(x=>{ const a = byRow[x.r.id] ||= {r:x.r, plan:0, base:0, mk:0, cred:0, missed:0, plants:[], worst:null};
    a.plan+=x.plan; a.base+=x.base; a.mk+=x.mk; a.cred+=x.credited; a.missed+=x.missed; a.plants.push(P.PLANTS[pl].short);
    const rank = {red:3, amber:2, k:1, green:0}; if(!a.worst || rank[x.c]>rank[a.worst.c]) a.worst=x; }));
  let h = `<div class="scroll"><table><thead><tr><th class="l">Size</th><th>Thk</th><th>Buffer</th><th>Open</th><th>Indent</th><th>Planned<small>latest</small></th><th class="l">Plant</th>
     <th>Made<small>MTD</small></th><th>%</th><th>Sold<small>MTD</small></th><th>Stock<small>now</small></th><th class="l">Status</th></tr></thead><tbody>`;
  ['SHS','RHS','CHS'].forEach(sec=>{
    const rows = Object.values(byRow).filter(a=>a.r.section===sec && (a.plan>0||a.mk>0));
    if(!rows.length) return;
    h += `<tr class="sec"><td>${sec}</td><td colspan="11">${rows.length} rows · ${T(S.sum(rows,'plan'))} T planned · ${T(S.sum(rows,'cred'))} made</td></tr>`;
    let prev=null;
    rows.sort((a,b)=>{ const x=P.sizeKey(a.r.size), y=P.sizeKey(b.r.size); return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]||a.r.thk-b.r.thk }).forEach(a=>{ const r=a.r, first=r.size!==prev; prev=r.size;
      const stock = S.stockNow(r), buf = r.type==='Buffer'&&r.buffer ? r.buffer : null;
      const design = buf && (r.indent||0) >= buf;   // #252: Planned = Indent − Open, so the month can end under buffer by design
      h += `<tr><td class="l size${first?'':' rep'}">${first?r.size:'·'}</td><td class="n">${r.thk.toFixed(1)}</td><td class="n ${buf?'':'k'}">${buf?T(buf):'MTO'}</td><td class="n">${n0(P.opening(r))}</td><td class="n">${n0(r.indent||0)}</td>
        <td class="n">${T(a.plan)}${a.base!==a.plan?`<span class="base">B ${T(a.base)}</span>`:''}</td><td class="l k">${a.plants.join(' + ')}</td>
        <td class="n">${n0(a.mk)}</td><td class="n">${pct(a.plan?a.cred/a.plan*100:null)}</td><td class="n">${n0(S.sold[r.id]||0)}</td>
        <td class="n">${stock < -0.05 ? `<span class="amber" title="Invoiced more than opening + made (${f1(stock)} T): an entry or band is missing">check</span>` : f1(stock)}${stock>=-0.05&&buf&&stock<buf?` <span class="k" title="${design?'Indent ≥ Buffer: the month ends under buffer by design (#252)':'under buffer today; production still to come'}">${design?'by design':'< buf'}</span>`:''}</td>
        <td class="st ${a.worst.c}">${a.worst.s}</td></tr>` });
  });
  const un = S.unplanned.filter(u=>pls.includes(u.pl));
  if(un.length) h += `<tr class="sec"><td colspan="12">MADE OFF PLAN · ${f1(S.sum(un,'t'))} T · ${un.map(u=>`${P.PLANTS[u.pl].short} ${u.label} ${f1(u.t)}`).join(' · ')}</td></tr>`;
  return h + `</tbody></table></div>`;
}

// ---------- C · a separate exceptions-only screen
function viewC(){
  const pls = regionPlants(), ps = pls.map(pl=>({pl, ...stats(pl)}));
  let h = '';
  ps.forEach(s=>{ const b=s.base||1, seg=(v,c,lab)=> v>0.5?`<i class="${c}" style="width:${v/b*100}%" title="${lab} ${T(v)} T">${v/b>.07?`${lab} ${T(v)}`:''}</i>`:'';
    h += `<div><div class="top"><b>${P.PLANTS[s.pl].name}</b><span class="k">Baseline ${T(s.base)} T = made ${T(s.credited)} + plan changed ${T(s.base-s.plan)} + behind ${T(s.missed)} + still to come ${T(s.toCome)}</span>${S.unentered(s.pl)?`<span class="chipw">production entered to ${entered(s.pl)}</span>`:''}</div>
      <div class="gapbar">${seg(s.credited,'g-made','made')}${seg(s.base-s.plan,'g-plan','changed')}${seg(s.missed,'g-miss','behind')}${seg(s.toCome,'g-come','to come')}</div></div>` });
  const all = ps.flatMap(s=>s.L.map(x=>({...x, pl:s.pl})));
  const behind = all.filter(x=>x.missed>0).sort((a,b)=>b.missed-a.missed);
  const plantShort = st.rule==='plant' ? ps.filter(s=>s.missed>0) : [];
  const li = (x,v) => `<li>${P.PLANTS[x.pl].short} · ${x.r.section} ${x.r.size} ${x.r.thk.toFixed(1)} — ${v}</li>`;
  const un = S.unplanned.filter(u=>pls.includes(u.pl)), over = all.filter(x=>x.over>S.TOL(x.plan));
  const lg = S.log.filter(l=>pls.some(p=>l.what.startsWith(P.PLANTS[p].name)));
  h += `<div class="lists">
    ${plantShort.length?`<div class="box"><h3 class="red">Behind · ${plantShort.length} plant week${plantShort.length>1?'s':''} · ${T(S.sum(plantShort,'missed'))} T</h3><ul>${plantShort.map(s=>`<li>${P.PLANTS[s.pl].name} W1 — planned <b>${T(S.sum(s.L,'dueClosed'))}</b>, made against plan <b>${T(s.credited)}</b>${s.un?`, plus ${f1(s.un)} off plan`:''}</li>`).join('')}</ul></div>`:''}
    ${plantShort.length?'':`<div class="box"><h3 class="red">Behind · ${behind.length} rows · ${T(S.sum(behind,'missed'))} T</h3><ul>${behind.slice(0,8).map(x=>li(x,`<b>${T(x.missed)}</b> of ${T(x.dueClosed||x.plan)} due, made ${n0(x.mk)}`)).join('')||'<li class="k">nothing</li>'}${behind.length>8?`<li class="k">+ ${behind.length-8} more</li>`:''}</ul></div>`}
    <div class="box"><h3>Made off plan · ${T(S.sum(un,'t')+S.sum(over,'over'))} T <span class="k">(explains, never credits)</span></h3><ul>${un.map(u=>`<li>${P.PLANTS[u.pl].short} · ${u.label} — <b>${f1(u.t)}</b> · ${u.why}</li>`).join('')}${over.map(x=>li(x,`<b>${f1(x.over)}</b> over plan`)).join('')}${!un.length&&!over.length?'<li class="k">nothing</li>':''}</ul></div>
    <div class="box"><h3>Plan changed since Finalise <span class="k">(from the logs)</span></h3><ul>${lg.map(l=>`<li>${l.d} · ${l.what} · <span class="k">${l.why}</span></li>`).join('')||'<li class="k">no changes</li>'}</ul></div>
    <div class="box"><h3>Ahead of plan</h3><ul>${all.filter(x=>x.early>0.5 && x.missed===0).sort((a,b)=>b.early-a.early).slice(0,6).map(x=>li(x,`<b>${f1(x.early)}</b> made before its week`)).join('')||'<li class="k">nothing</li>'}</ul></div>
  </div>`;
  return h;
}

function render(){
  header();
  $('view').innerHTML = st.variant==='B' ? viewB() : st.variant==='C' ? viewC() : viewA();
  $('foot').innerHTML = `<div class="ask"><p><b>What this screen is asking (#274):</b> grain, measures, the off-track rule (switch above), and where it lives (switch at the bottom).
     Settled already: target = <b>latest</b> plan, Baseline beside (#255); the 3.0 row is the 2.8–3.2 band (#258); production rolled into rows by #251 / #258.</p></div>
    <span><b>Example plan, real actuals.</b> Plan = the #273 prototype's example (Monthly Indent = October sales rounded up to 10, the app's proposed weeks). It asks Hyderabad for ${T(stats('hyderabad').base)} T against 835 T made in October, so most W1 rows read behind — that is the example plan, not the plant. Production and invoices are live (production entered to 4–5 Nov; NPMD nothing since 28 Oct; invoices 3–6 Nov), snapshot 10-Nov-2026, <b>not independently verified</b>.</span>
    <span><b>Made up for the prototype:</b> ${S.log.map(l=>`${l.d}: ${l.what}`).join(' · ')}.</span>
    <span><b>Rules used here (proposals):</b> a row counts as made within 1 T or 5 %. Production is credited to its row whatever week it was made in, up to the row's plan; tonnes past the plan and tonnes on rows with no plan are "made off plan", shown beside the gap and never credited. Stock now = opening + made − invoiced, region pool. Gap split always adds up: Baseline = made + plan changed + behind + still to come.</span>`;
}
document.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.reg){ st.region=b.dataset.reg; render() }
  else if(b.dataset.open){ st.plant=b.dataset.open; render() }
  else if(b.dataset.rule){ st.rule=b.dataset.rule; url.searchParams.set('rule',st.rule); try{history.replaceState(null,'',url)}catch(_){} render() }
  else if(b.dataset.var){ st.variant=b.dataset.var; url.searchParams.set('variant',st.variant); try{history.replaceState(null,'',url)}catch(_){} render(); scrollTo(0,0) }
});
render();
</script>
</body></html>
