name: Close ticket on merge

# A merged PR closes its ticket, whether or not the commit said "Closes #n".
#
# Ticket numbers are read from the branch name (claude/ticket-125-judv4k) and
# from the PR title ("... (ticket #125)", "... (#121)", "Ticket #120: ..."),
# because both carry it and neither is a closing keyword GitHub acts on.
#
# Only OPEN ISSUES are ever touched. A number that turns out to be a pull
# request, or an issue somebody already closed, is left alone.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const { owner, repo } = context.repo

            // The branch says "ticket-125" / "issue-104"; the title says "#125".
            // Both must name the number explicitly — a bare number is not enough,
            // because branch suffixes like "-7a2f53" are full of stray digits.
            const found = new Set()
            for (const m of pr.head.ref.matchAll(/(?:ticket|issue)s?[-_ ]*#?(\d+)/gi)) found.add(Number(m[1]))
            for (const m of pr.title.matchAll(/#(\d+)/g)) found.add(Number(m[1]))
            found.delete(pr.number)

            if (found.size === 0) {
              core.info(`PR #${pr.number}: no ticket number in branch or title — nothing to close.`)
              return
            }

            for (const number of [...found].sort((a, b) => a - b)) {
              let issue
              try {
                issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data
              } catch (e) {
                core.info(`#${number}: not found (${e.status}) — skipped.`)
                continue
              }

              if (issue.pull_request) { core.info(`#${number}: is a pull request — skipped.`); continue }
              if (issue.state === 'closed') { core.info(`#${number}: already closed — skipped.`); continue }

              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Closed by #${pr.number}, merged into \`${pr.base.ref}\`.\n\n`
                    + `---\n_Generated by [Claude Code](https://claude.ai/code)_`,
              })
              await github.rest.issues.update({
                owner, repo, issue_number: number,
                state: 'closed', state_reason: 'completed',
              })
              core.notice(`Closed #${number} — ${issue.title}`)
            }
