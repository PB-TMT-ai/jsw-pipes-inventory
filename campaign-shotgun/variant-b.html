<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Campaign Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f4f8f6; --sheet:#fbfdfc; --cell:#ffffff;
  --rule:#d6e7dd; --rule-2:#b4d3c1; --rule-strong:#7fae93;
  --ink:#17263a; --ink-2:#3f5063; --muted:#6c7c88; --faint:#9aa8b1;
  --accent:#1d4b9b; --accent-ink:#ffffff; --accent-soft:#e4ecf9; --accent-line:#8fa9d8;
  --amber:#8f5300; --amber-bg:#fff2d3; --amber-line:#dc9a22;
  --red:#b0261c; --red-bg:#fde9e6; --red-line:#e58b82;
  --ok:#1f6b45;
  --hatch:#e1ebe5; --sel:#1d4b9b;
  --shadow:0 1px 0 rgba(23,38,58,.04), 0 6px 24px rgba(23,38,58,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1513; --sheet:#121b18; --cell:#16211d;
    --rule:#21332b; --rule-2:#2d473b; --rule-strong:#4b7a63;
    --ink:#e2ebe6; --ink-2:#b7c6bf; --muted:#8b9b95; --faint:#62736c;
    --accent:#93b4ff; --accent-ink:#0b1426; --accent-soft:#1a2842; --accent-line:#45619a;
    --amber:#f2b955; --amber-bg:#35270c; --amber-line:#a9771f;
    --red:#ff8f85; --red-bg:#3a1714; --red-line:#93413a;
    --ok:#7fd3a5;
    --hatch:#1a2622; --sel:#93b4ff;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1513; --sheet:#121b18; --cell:#16211d;
  --rule:#21332b; --rule-2:#2d473b; --rule-strong:#4b7a63;
  --ink:#e2ebe6; --ink-2:#b7c6bf; --muted:#8b9b95; --faint:#62736c;
  --accent:#93b4ff; --accent-ink:#0b1426; --accent-soft:#1a2842; --accent-line:#45619a;
  --amber:#f2b955; --amber-bg:#35270c; --amber-line:#a9771f;
  --red:#ff8f85; --red-bg:#3a1714; --red-line:#93413a;
  --ok:#7fd3a5;
  --hatch:#1a2622; --sel:#93b4ff;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-size:14px;line-height:1.4}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:75%;margin:0;letter-spacing:.005em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Page frame ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding-bottom:12px;border-bottom:3px double var(--rule-strong)}
.top .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:28px;font-weight:700;line-height:1.05}
.top h1 span{color:var(--muted);font-weight:500}
.top .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden;background:var(--cell)}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:600;font-stretch:87.5%}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button .sub{font-weight:400;opacity:.75;font-size:12px;margin-left:6px}
.ghost{border:1px solid var(--rule-2);background:var(--cell);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--rule-strong)}

.notes{display:grid;gap:4px;margin:12px 0;padding:8px 12px;border:1px solid var(--rule-2);border-left:4px solid var(--amber-line);background:var(--sheet);font-size:12.5px;color:var(--ink-2);border-radius:4px}
.notes b{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;color:var(--amber);margin-right:8px;font-weight:700}

/* ---------- Summary ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--rule-2);background:var(--sheet);border-radius:4px;margin-bottom:12px}
.sum{padding:9px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.sum .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .v{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;line-height:1.2}
.sum .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.sum .d{font-size:12px;color:var(--muted)}
.sum.red .v{color:var(--red)} .sum.warn .v{color:var(--accent)}
.sum.fin{display:flex;flex-direction:column;gap:6px;justify-content:center;grid-column:span 2;min-width:240px}
.finbtn{border:0;border-radius:6px;padding:9px 14px;font-weight:700;font-stretch:87.5%;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px}
.finbtn.blocked{background:var(--rule-2);color:var(--ink-2)}
.finmsg{font-size:12.5px;color:var(--ink-2)}
.finmsg.bad{color:var(--red)} .finmsg.good{color:var(--ok)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1000px){ .layout{grid-template-columns:minmax(0,1fr) 370px} }

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.toolbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ---------- Ledger matrix ---------- */
.ledger{position:relative;overflow:auto;max-height:74vh;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:4px;box-shadow:var(--shadow);overscroll-behavior:contain}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0;vertical-align:top}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--sheet);border-bottom:2px solid var(--rule-strong);padding:6px 6px 5px;text-align:right;font-weight:600}
.grid thead th .b{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;color:var(--ink)}
.grid thead th .b small{font-size:10px;font-weight:400;color:var(--muted);margin-left:1px}
.grid thead th .bn{display:block;font-size:10px;color:var(--muted);font-weight:400;white-space:nowrap;line-height:1.2}
.grid .stick{position:sticky;left:0;z-index:2;background:var(--sheet);border-right:2px solid var(--rule-strong)}
.grid thead th.stick{z-index:4;text-align:left;vertical-align:bottom;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid thead th.tot{text-align:right;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.grid th.size{padding:6px 8px;text-align:left;white-space:nowrap;min-width:84px}
.grid th.size .s{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13.5px}
.grid th.size .k{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.grid tr.sec th,.grid tr.sec td{background:var(--paper);border-bottom:1px solid var(--rule-strong);border-top:1px solid var(--rule-strong)}
.grid tr.sec th{padding:10px 8px 4px;text-align:left}
.grid tr.sec th h3{font-size:16px;font-weight:700}
.grid tr.sec th h3 span{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.grid tr.sec td.tot{padding:10px 8px 4px}
.grid td.tot{text-align:right;padding:6px 8px;min-width:78px;background:var(--paper);border-left:2px solid var(--rule-strong)}
.grid td.tot .big{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;display:block}
.grid td.tot .sm{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);display:block}
.grid tfoot th,.grid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--sheet);border-top:3px double var(--rule-strong);border-bottom:0}
.grid tfoot th.stick{z-index:4}
.grid tfoot td{text-align:right;padding:6px 8px}
.grid tfoot td .big{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;display:block}
.grid tfoot td .sm{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);display:block}
.grid tfoot th{padding:6px 8px;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

td.na{background-color:var(--sheet);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 7px)}
td.c{min-width:88px;width:88px;background:var(--cell)}
.cell{display:block;width:100%;height:100%;min-height:56px;border:0;background:transparent;text-align:right;padding:5px 7px 4px;cursor:pointer;position:relative;border-radius:0}
.cell:hover{background:var(--accent-soft)}
.cell .p{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;line-height:1.15;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.cell .p .zero{color:var(--faint);font-weight:400}
.cell .meta{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);display:block;white-space:nowrap;margin-top:2px}
.cell.quiet .p{color:var(--faint)}
.cell.moved{background:var(--amber-bg);box-shadow:inset 0 0 0 1.5px var(--amber-line)}
.cell.gap{background:var(--red-bg);box-shadow:inset 0 0 0 1.5px var(--red-line)}
.cell.gap .p{color:var(--red)}
.cell.choose{box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.cell.badsplit{box-shadow:inset 0 0 0 1.5px var(--red-line)}
.cell[aria-current="true"]{box-shadow:inset 0 0 0 2.5px var(--sel)!important}
.cell .flag{position:absolute;top:0;left:0;width:0;height:0;border-top:9px solid var(--amber-line);border-right:9px solid transparent}

.chip{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:18px;padding:0 4px;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;line-height:1;border:1px solid var(--accent-line);color:var(--accent);background:var(--cell)}
.chip.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.ask{border-style:dashed;color:var(--accent)}
.chip.x{background:var(--red);border-color:var(--red);color:var(--cell)}
.chip.bad{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.chip.dim{border-color:var(--rule-2);color:var(--faint);background:transparent;font-weight:500}

.outside{margin-top:10px;font-size:12.5px;color:var(--ink-2);padding:8px 12px;border:1px dashed var(--rule-2);border-radius:4px;background:var(--sheet)}
.outside b{font-weight:700;margin-right:6px}
.log{margin-top:12px;border:1px solid var(--rule-2);border-radius:4px;background:var(--sheet)}
.log h3{font-size:15px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.log ol{margin:0;padding:6px 12px 10px 32px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-2);max-height:180px;overflow:auto}
.log p{margin:0;padding:8px 12px;font-size:12.5px;color:var(--muted)}

/* ---------- Edit panel ---------- */
.panel{background:var(--sheet);border:1px solid var(--rule-strong);border-radius:4px;box-shadow:var(--shadow)}
@media (min-width:1000px){ .panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto} }
@media (max-width:999.98px){
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:78vh;overflow:auto;border-radius:12px 12px 0 0;
    transform:translateY(105%);transition:transform .22s ease;border-bottom:0}
  .panel.open{transform:translateY(0)}
  .panel.empty{display:none}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--rule-2);margin:8px auto 0}
}
@media (min-width:1000px){ .grab{display:none} #pn-close{display:none} }
.pn-head{padding:12px 14px 10px;border-bottom:3px double var(--rule-strong);display:flex;gap:10px;align-items:flex-start}
.pn-head .kk{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pn-head h2{font-size:24px;font-weight:700;line-height:1.1}
.pn-head h2 .mono{font-size:21px}
.pn-head .bn{font-size:12px;color:var(--muted)}
.pn-head .grow{flex:1;min-width:0}
.pn-sec{padding:12px 14px;border-bottom:1px solid var(--rule)}
.pn-sec:last-child{border-bottom:0}
.pn-sec h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;font-stretch:87.5%}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px;color:var(--ink-2)}
.field input{width:100%;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--cell);font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:700;text-align:right}
.field input::placeholder{color:var(--faint);font-weight:500}
.field input:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.field.amber input{background:var(--amber-bg);border-color:var(--amber-line)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.calc{margin-top:8px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;line-height:1.5}
.calc b{color:var(--ink)}
.msg{margin-top:8px;padding:8px 10px;border-radius:4px;font-size:12.5px;line-height:1.45}
.msg.amber{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--ink)}
.msg.amber strong{color:var(--amber)}
.msg.red{background:var(--red-bg);border:1px solid var(--red-line);color:var(--ink)}
.msg.red strong{color:var(--red)}
.msg.info{background:var(--accent-soft);border:1px solid var(--accent-line)}
.msg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--rule-strong);background:var(--cell);border-radius:5px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.radios{display:flex;flex-wrap:wrap;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden;background:var(--cell)}
.radios label{flex:1 1 auto;position:relative;cursor:pointer}
.radios input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.radios span{display:block;text-align:center;padding:7px 8px;font-weight:600;font-size:13px;border-left:1px solid var(--rule-2);white-space:nowrap}
.radios label:first-child span{border-left:0}
.radios input:checked+span{background:var(--accent);color:var(--accent-ink)}
.radios input:focus-visible+span{outline:2px solid var(--sel);outline-offset:-3px}
.splits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.splitsum{margin-top:6px;font-family:"JetBrains Mono",monospace;font-size:12px}
.splitsum.ok{color:var(--ok)} .splitsum.bad{color:var(--red)}
table.st{width:100%;border-collapse:collapse;font-size:12.5px}
table.st th,table.st td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:2px solid var(--rule-strong)}
table.st td{font-family:"JetBrains Mono",monospace}
table.st td:first-child{font-family:inherit;color:var(--ink-2)}
table.st td.rg{font-weight:700}
table.st tr.tk td .chip{margin-left:4px}
.empty-p{padding:16px 14px;color:var(--ink-2);font-size:13px}
.empty-p h2{font-size:20px;margin-bottom:6px}
.empty-p ul{padding-left:18px;margin:8px 0}
.empty-p li{margin:4px 0}

.foot{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--faint)}
.vlabel{font-family:"JetBrains Mono",monospace;letter-spacing:.04em}

@media (max-width:640px){
  .top h1{font-size:23px}
  .sum .v{font-size:17px}
  .sum.fin{grid-column:1/-1;min-width:0}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  td.c{min-width:80px;width:80px}
  .grid th.size{min-width:72px;padding:6px 6px}
  .ledger{max-height:66vh}
  .fields{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">JSW Pipes &amp; Tubes · Production planning</div>
      <h1>Monthly Campaign <span>· November 2026</span></h1>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Region">
      <button id="region-South" type="button" data-region="South">South<span class="sub">Hyd + Lep</span></button>
      <button id="region-West" type="button" data-region="West">West<span class="sub">NPMD + Tapi</span></button>
    </div>
    <button id="theme-toggle" class="ghost" type="button">Dark</button>
  </header>

  <div class="notes" id="notes"></div>

  <section class="summary" id="summary" aria-label="Region summary"></section>

  <div class="layout">
    <main>
      <div class="toolbar">
        <label for="f-quiet"><input type="checkbox" id="f-quiet"> Hide quiet sizes</label>
        <button id="next-blocker" class="ghost" type="button">Next row needing a plant</button>
        <div class="legend" aria-label="Legend">
          <span><span class="chip solid">L</span> plant</span>
          <span><span class="chip solid">N+L</span> split</span>
          <span><span class="chip ask">?</span> needs a plant</span>
          <span><span class="chip x">✕</span> no plant can make</span>
          <span><span class="chip dim">N L</span> can make, nothing planned</span>
        </div>
      </div>
      <div class="ledger" id="ledger" tabindex="-1">
        <table class="grid" id="grid" aria-label="Planned tonnes by size and thickness band"></table>
      </div>
      <div class="outside" id="outside"></div>
      <section class="log" id="log" aria-label="Change log"></section>
    </main>
    <aside class="panel empty" id="panel" aria-label="Edit selected row"></aside>
  </div>

  <footer class="foot">
    <span id="foot-snap"></span>
    <span class="vlabel">Variant B — Ledger grid</span>
  </footer>
</div>

<script src="core.js"></script>
<script>
(function(){
const P = window.PP;
const SEC_ORDER = ['SHS','RHS','CHS'];
const SEC_NAME = {SHS:'Square hollow',RHS:'Rectangular hollow',CHS:'Circular · NB'};
const state = {region:'South', sel:null, hideQuiet:false, finMsg:{South:null,West:null}};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = n => { if(!n) return '–'; return Number.isInteger(n) ? n.toLocaleString('en-IN') : P.f1(n) };
const t0 = n => Number.isInteger(n) ? n.toLocaleString('en-IN') : P.f1(n);
const band = b => b.toFixed(1);
const L = k => P.PLANTS[k].letter;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rowById = id => P.rows[id];

/* ---------- theme ---------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
function isDark(){ const d=document.documentElement.dataset.theme; return d ? d==='dark' : mq.matches }
function paintThemeBtn(){ $('theme-toggle').textContent = isDark() ? 'Light' : 'Dark';
  $('theme-toggle').setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme') }
$('theme-toggle').addEventListener('click', ()=>{ document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; paintThemeBtn() });
paintThemeBtn();

/* ---------- helpers ---------- */
const regionRows = () => P.rows.filter(r=>r.region===state.region);
function chipFor(r){
  const a = P.assign(r);
  if(a.kind==='gap') return '<span class="chip x" title="No plant can make">✕</span>';
  if(a.kind==='choose') return '<span class="chip ask" title="Needs a plant">?</span>';
  if(a.kind==='one') return `<span class="chip solid" title="${esc(P.PLANTS[a.plant].name)}">${L(a.plant)}</span>`;
  if(a.kind==='split'){ const lab = r.plants.map(L).join('+');
    return `<span class="chip ${a.ok?'solid':'bad'}" title="${a.ok?'Split':'Split does not add up'}">${lab}</span>` }
  // none
  if(!r.plants.length) return '';
  return `<span class="chip dim" title="Ticked plants">${r.plants.map(L).join(' ')}</span>`;
}
function cellClass(r){
  const a = P.assign(r), c=['cell'];
  if(P.quiet(r)) c.push('quiet');
  if(a.kind==='gap') c.push('gap');
  else if(P.moved(r)) c.push('moved');
  else if(a.kind==='choose') c.push('choose');
  else if(a.kind==='split' && !a.ok) c.push('badsplit');
  return c.join(' ');
}
function cellLabel(r){
  const a=P.assign(r), pl=P.planned(r);
  let who = a.kind==='gap'?'no plant can make':a.kind==='choose'?'needs a plant':a.kind==='one'?P.PLANTS[a.plant].name:a.kind==='split'?('split '+(a.ok?'':'not adding up')):'';
  return `${r.section} ${r.size} ${band(r.thk)} mm, planned ${t0(pl)} tonnes${who?', '+who:''}${P.moved(r)?', suggestion moved':''}`;
}
function groups(){
  let list = regionRows();
  const bs = P.bySize(list);
  const out = SEC_ORDER.map(s=>[s, bs.filter(([,rs])=>rs[0].section===s)]);
  if(state.hideQuiet) out.forEach(g=>{ g[1]=g[1].filter(([,rs])=>!rs.every(P.quiet)) });
  return out.filter(g=>g[1].length);
}

/* ---------- notes & summary ---------- */
function renderNotes(){
  $('notes').innerHTML = `<div><b>EXAMPLE</b>${esc(P.EXAMPLE_NOTE)}</div><div><b>SNAPSHOT</b>${esc(P.SNAPSHOT)}</div>`;
  $('foot-snap').textContent = P.SNAPSHOT;
}
function renderSummary(){
  const rs = regionRows(), reg=state.region;
  const total = rs.reduce((s,r)=>s+P.planned(r),0);
  const per = P.REGION_PLANTS[reg].map(p=>[p, rs.reduce((s,r)=>s+P.share(r,p),0)]);
  const gapRows = rs.filter(r=>P.assign(r).kind==='gap');
  const gapT = gapRows.reduce((s,r)=>s+P.planned(r),0);
  const bl = P.blockers(reg);
  const blT = bl.reduce((s,r)=>s+P.planned(r),0);
  const fin = P.final[reg], m = state.finMsg[reg];
  let msg = '';
  if(fin) msg = `<div class="finmsg good" id="fin-msg">Finalised ${esc(fin)}. Still editable — every change goes into the change log.</div>`;
  else if(m==='blocked' && bl.length) msg = `<div class="finmsg bad" id="fin-msg" role="alert">Blocked: ${bl.length} row${bl.length>1?'s':''} still need${bl.length>1?'':'s'} a plant. <button class="linkbtn" id="fin-show" type="button">Show the first</button></div>`;
  else if(bl.length) msg = `<div class="finmsg" id="fin-msg">${bl.length} row${bl.length>1?'s':''} need a plant before Finalise.</div>`;
  else msg = `<div class="finmsg good" id="fin-msg">Every row with Planned &gt; 0 has a plant. Ready.</div>`;
  $('summary').innerHTML = `
    <div class="sum"><div class="l">Planned · ${reg}</div><div class="v">${t0(total)}<small>T</small></div><div class="d">${rs.filter(r=>P.planned(r)>0).length} of ${rs.length} rows</div></div>
    ${per.map(([p,v])=>`<div class="sum"><div class="l">${esc(P.PLANTS[p].name)}</div><div class="v">${t0(v)}<small>T</small></div><div class="d"><span class="chip solid">${L(p)}</span> assigned</div></div>`).join('')}
    <div class="sum ${bl.length?'warn':''}"><div class="l">Needs a plant</div><div class="v">${bl.length}<small>rows</small></div><div class="d">${t0(blT)} T unassigned</div></div>
    <div class="sum ${gapT?'red':''}"><div class="l">No plant can make</div><div class="v">${t0(gapT)}<small>T</small></div><div class="d">${gapRows.length} row${gapRows.length===1?'':'s'}, never assigned</div></div>
    <div class="sum fin">
      <button class="finbtn ${bl.length&&!fin?'blocked':''}" id="finalise" type="button" aria-describedby="fin-msg">${fin?'Finalised · '+reg:'Finalise '+reg}</button>
      ${msg}
    </div>`;
}

/* ---------- matrix ---------- */
let nav = []; // nav[rowIdx][bandIdx] = row id | null
function renderMatrix(){
  const reg = state.region, all = regionRows();
  const gs = groups();
  nav = [];
  let h = '<thead><tr><th class="stick" scope="col">Size</th>';
  P.BANDS.forEach(b=>{ const n=P.BAND_NOTE[b]; h+=`<th scope="col"><span class="b">${band(b)}<small>mm</small></span>${n?`<span class="bn">${esc(n)}</span>`:'<span class="bn">&nbsp;</span>'}</th>` });
  h += '<th class="tot" scope="col">Size total</th></tr></thead><tbody>';
  gs.forEach(([sec, sizes])=>{
    const secRows = sizes.flatMap(([,rs])=>rs);
    const secT = secRows.reduce((s,r)=>s+P.planned(r),0);
    h += `<tr class="sec"><th class="stick" scope="rowgroup"><h3>${sec}</h3></th><td colspan="${P.BANDS.length}" style="padding:10px 8px 4px;font-size:12px;color:var(--muted)">${SEC_NAME[sec]} · ${sizes.length} sizes</td><td class="tot"><span class="big">${t(secT)}</span></td></tr>`;
    sizes.forEach(([size, rs])=>{
      const ri = nav.length; const navRow = [];
      const sumP = rs.reduce((s,r)=>s+P.planned(r),0), sumI = rs.reduce((s,r)=>s+(r.indent||0),0);
      const typ = rs.some(r=>r.type==='Buffer') ? 'Buffer' : 'MTO';
      h += `<tr><th class="stick size" scope="row"><span class="s">${esc(size)}</span><span class="k">${typ} · ${rs.length} bands</span></th>`;
      P.BANDS.forEach((b,bi)=>{
        const r = rs.find(x=>x.thk===b);
        if(!r){ navRow.push(null); h+='<td class="na" aria-label="No master row"></td>'; return }
        navRow.push(r.id);
        const pl = P.planned(r);
        const meta = `I ${r.indent!=null?t0(r.indent):'–'} · ${r.type==='Buffer'&&r.buffer?'B '+t0(r.buffer):'MTO'}`;
        const flag = P.unticked(r).length ? '<span class="flag" aria-hidden="true"></span>' : '';
        h += `<td class="c"><button type="button" class="${cellClass(r)}" id="cell-${r.id}" data-id="${r.id}" data-ri="${ri}" data-bi="${bi}" aria-current="${state.sel===r.id}" aria-label="${esc(cellLabel(r))}" tabindex="${state.sel===r.id?0:-1}">${flag}<span class="p">${chipFor(r)}${pl?t0(pl):'<span class="zero">–</span>'}</span><span class="meta">${meta}</span></button></td>`;
      });
      nav.push(navRow);
      h += `<td class="tot"><span class="big">${t(sumP)}</span><span class="sm">I ${t(sumI)}</span></td></tr>`;
    });
  });
  h += '</tbody><tfoot><tr><th class="stick" scope="row">Band total</th>';
  let grand=0, grandI=0;
  P.BANDS.forEach(b=>{ const rs=all.filter(r=>r.thk===b); const v=rs.reduce((s,r)=>s+P.planned(r),0), vi=rs.reduce((s,r)=>s+(r.indent||0),0); grand+=v; grandI+=vi;
    h+=`<td><span class="big">${t(v)}</span><span class="sm">I ${t(vi)}</span></td>` });
  h += `<td class="tot"><span class="big">${t(grand)}</span><span class="sm">I ${t(grandI)}</span></td></tr></tfoot>`;
  $('grid').innerHTML = h;
  // keep one cell in tab order
  if(state.sel==null || !$('cell-'+state.sel)){ const first=$('grid').querySelector('.cell'); if(first) first.tabIndex=0 }
}

/* ---------- outside & log ---------- */
function renderOutside(){
  const o = (P.outside||[]).filter(x=>x.region===state.region);
  if(!o.length){ $('outside').innerHTML = '<b>Outside the plan</b>Nothing — every size with stock or sales has a master row.'; return }
  $('outside').innerHTML = '<b>Outside the plan</b>' + o.map(x=>{
    const parts = Object.entries(x.byPlant).map(([p,v])=>`${P.PLANTS[p].short} open ${P.f1(v.open)} · Oct ${P.f1(v.oct)} · Aug–Oct ${P.f1(v.ao)}`).join('; ');
    return `<span class="mono">${esc(x.size)} ${band(x.thk)}</span> (${parts})`;
  }).join(' &nbsp;|&nbsp; ') + ' — no master row, so not planned here.';
}
function renderLog(){
  const fin = P.final[state.region];
  const items = P.log;
  $('log').innerHTML = `<h3>Change log</h3>` + (items.length
    ? `<ol>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`
    : `<p>${fin?'Finalised '+esc(fin)+'. No changes since.':'Empty until a region is finalised. After Finalise the plan stays editable and each change is listed here.'}</p>`);
}

/* ---------- panel ---------- */
function stockTable(r){
  const ps = P.REGION_PLANTS[r.region];
  const line = (lab,k) => `<tr><td>${lab}</td><td class="rg">${P.f1(P.regionSum(r,k))}</td>${ps.map(p=>`<td>${P.f1(r.byPlant[p]?.[k]||0)}</td>`).join('')}</tr>`;
  return `<table class="st"><thead><tr><th>Tonnes</th><th>${r.region}</th>${ps.map(p=>`<th>${esc(P.PLANTS[p].short)} <span class="chip ${r.plants.includes(p)?'solid':'dim'}" title="${r.plants.includes(p)?'ticked':'not ticked'}">${L(p)}</span></th>`).join('')}</tr></thead>
    <tbody>${line('Opening 1 Nov','open')}${line('Oct · L30','oct')}${line('Aug–Oct · L90','ao')}</tbody></table>
    <div class="hint" style="font-size:11.5px;color:var(--muted);margin-top:6px">Filled chip = plant ticked in the master for this size and band.</div>`;
}
function calcText(r){
  const ind=r.indent||0, open=P.opening(r), s=P.suggested(r);
  const base = (r.type==='Buffer'&&r.buffer) ? `max(Indent <b>${t0(ind)}</b>, Buffer <b>${t0(r.buffer)}</b>)` : `Indent <b>${t0(ind)}</b>`;
  const raw = ((r.type==='Buffer'&&r.buffer)?Math.max(ind,r.buffer):ind) - open;
  return `${base} − Opening <b>${P.f1(open)}</b> = ${P.f1(raw)}<br>${raw<=0?'floor at 0':'round up to 10'} → suggested <b>${t0(s)} T</b>`;
}
function plantSection(r){
  const a = P.assign(r), pl = P.planned(r);
  const un = P.unticked(r);
  const unNote = un.length ? `<div class="msg amber"><strong>Not ticked:</strong> ${un.map(p=>esc(P.PLANTS[p].name)).join(' and ')} ${un.length>1?'have':'has'} sales or stock in this size and band but ${un.length>1?'are':'is'} not ticked in the Plant master, so ${un.length>1?'they':'it'} cannot be picked here.</div>` : '';
  if(!r.plants.length){
    return `<div class="msg ${pl>0?'red':'info'}"><strong>${pl>0?'No plant can make this.':'No plant ticked.'}</strong> No plant in ${r.region} is ticked for ${esc(r.size)} ${band(r.thk)} mm. ${pl>0?`The ${t0(pl)} T is never auto-assigned and is counted under “No plant can make”.`:'Nothing is planned, so nothing is lost.'}</div>${unNote}`;
  }
  if(r.plants.length===1){
    return `<div class="msg info"><strong>${esc(P.PLANTS[r.plants[0]].name)}</strong> — the only ticked plant, assigned automatically.</div>${unNote}`;
  }
  const opts = [['','Choose…'], ...r.plants.map(p=>[p,P.PLANTS[p].name]), ['split','Split…']];
  const cur = r.choice || '';
  let h = `<div class="radios" role="radiogroup" aria-label="Plant">${opts.map(([v,lab])=>`<label><input type="radio" name="ed-plant" id="ed-plant-${v||'choose'}" value="${v}" ${cur===v?'checked':''}><span>${esc(lab)}</span></label>`).join('')}</div>`;
  if(pl===0) h += `<div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">Planned is 0, so no plant is needed yet.</div>`;
  else if(a.kind==='choose') h += `<div class="msg info"><strong>Needs a plant.</strong> Both ${r.plants.map(p=>esc(P.PLANTS[p].name)).join(' and ')} can make it. Pick one or split — Finalise waits for this.</div>`;
  if(r.choice==='split'){
    const sum = P.splitSum(r), diff = pl - sum;
    h += `<div class="splits">${r.plants.map(p=>`<div class="field"><label for="ed-split-${p}">${esc(P.PLANTS[p].name)} (T)</label><input id="ed-split-${p}" inputmode="decimal" autocomplete="off" value="${r.split[p]!=null?r.split[p]:''}"></div>`).join('')}</div>
      <div class="splitsum ${a.ok?'ok':'bad'}">${r.plants.map(p=>t0(+r.split[p]||0)).join(' + ')} = ${t0(sum)} of ${t0(pl)} T ${a.ok?'· adds up':`· ${t0(Math.abs(diff))} T ${diff>0?'short':'over'}`}</div>
      ${a.ok?'':`<div class="row" style="display:flex;gap:8px;margin-top:6px"><button class="btn" type="button" id="ed-balance">Put the rest on ${esc(P.PLANTS[r.plants[1]].name)}</button></div>`}`;
  }
  return h + unNote;
}
function renderPanel(){
  const pn = $('panel');
  const r = state.sel!=null ? rowById(state.sel) : null;
  if(!r){
    pn.classList.add('empty'); pn.classList.remove('open');
    pn.innerHTML = `<div class="empty-p"><h2>Pick a cell</h2>
      <p>Each cell is one row of the plan: a size in one thickness band. Click it (or use the arrow keys and Enter) to edit.</p>
      <ul><li>Big figure: <b>Planned T</b>. Small line: <b>I</b> Indent · <b>B</b> Buffer (or MTO).</li>
      <li><span class="chip ask">?</span> both plants can make it — choose one or split.</li>
      <li><span class="chip x">✕</span> no plant is ticked: never assigned.</li>
      <li>Amber cell: you typed over Planned and the suggestion has since moved.</li>
      <li>Amber corner: a plant with sales or stock here is not ticked.</li>
      <li>Hatched: no master row for that band.</li></ul></div>`;
    return;
  }
  pn.classList.remove('empty');
  const pl = P.planned(r), sug = P.suggested(r), mv = P.moved(r);
  const amber = mv ? `<div class="msg amber"><strong>Suggestion moved.</strong> You typed <b class="mono">${t0(r.typed)}</b> when the suggestion was <b class="mono">${t0(r.typedAgainst)}</b>; it is now <b class="mono">${t0(sug)}</b>. Your figure is kept until you decide.
     <div class="row"><button class="btn" type="button" id="ed-keep">Keep ${t0(r.typed)}</button><button class="btn" type="button" id="ed-usesug">Use ${t0(sug)}</button></div></div>`
    : (r.typed!=null ? `<div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">Typed over the suggestion (${t0(sug)} T). <button class="linkbtn" type="button" id="ed-usesug">Use ${t0(sug)}</button></div>` : '');
  pn.innerHTML = `<span class="grab" aria-hidden="true"></span>
    <div class="pn-head"><div class="grow">
      <div class="kk">${r.section} · ${r.region} · ${r.type==='Buffer'?(r.buffer?'Buffer '+t0(r.buffer)+' T':'Buffer (no level)'):'Make to order'}</div>
      <h2><span class="mono">${esc(r.size)}</span> · ${band(r.thk)} mm</h2>
      ${P.BAND_NOTE[r.thk]?`<div class="bn">This band also covers ${esc(P.BAND_NOTE[r.thk].replace(/^also /,''))} mm</div>`:''}
    </div><button class="ghost" type="button" id="pn-close">Close</button></div>
    <div class="pn-sec"><h3>Plan</h3>
      <div class="fields">
        <div class="field"><label for="ed-indent">Monthly Indent (T)</label><input id="ed-indent" inputmode="decimal" autocomplete="off" value="${r.indent!=null?r.indent:''}" placeholder="0"></div>
        <div class="field ${mv?'amber':''}"><label for="ed-planned">Planned (T)</label><input id="ed-planned" inputmode="decimal" autocomplete="off" value="${r.typed!=null?r.typed:''}" placeholder="${sug}" aria-describedby="pn-calc"><div class="hint">${r.typed!=null?'Typed':'Blank = suggestion '+t0(sug)}</div></div>
      </div>
      <div class="calc" id="pn-calc">${calcText(r)}</div>
      ${amber}
    </div>
    <div class="pn-sec"><h3>Plant${pl?` · ${t0(pl)} T`:''}</h3>${plantSection(r)}</div>
    <div class="pn-sec"><h3>Stock &amp; sales · per plant</h3>${stockTable(r)}</div>`;
}

/* ---------- render with focus preservation ---------- */
function renderAll(){
  const a = document.activeElement, keep = a && a.id ? {id:a.id, val:a.value, s:null, e:null} : null;
  if(keep && a.tagName==='INPUT' && a.type!=='radio' && a.type!=='checkbox'){ try{ keep.s=a.selectionStart; keep.e=a.selectionEnd }catch(_){} }
  const sc = $('ledger'), st=sc.scrollTop, sl=sc.scrollLeft, ps=$('panel').scrollTop;
  ['South','West'].forEach(r=>{ const b=$('region-'+r); b.setAttribute('aria-pressed', String(state.region===r)) });
  renderSummary(); renderMatrix(); renderPanel(); renderOutside(); renderLog();
  sc.scrollTop=st; sc.scrollLeft=sl; $('panel').scrollTop=ps;
  if(keep){ const el=$(keep.id); if(el){
    if(el.tagName==='INPUT' && el.type!=='radio' && el.type!=='checkbox'){ el.value=keep.val; el.focus({preventScroll:true}); if(keep.s!=null){ try{ el.setSelectionRange(keep.s,keep.e) }catch(_){} } }
    else el.focus({preventScroll:true});
  } }
}

/* ---------- selection ---------- */
function select(id, opts={}){
  state.sel = id;
  renderAll();
  const pn=$('panel'); if(id!=null) pn.classList.add('open');
  const c = $('cell-'+id);
  if(c){ if(opts.focusCell) c.focus({preventScroll:true}); if(opts.scroll) c.scrollIntoView({block:'nearest',inline:'nearest',behavior:reduceMotion?'auto':'smooth'}) }
  if(opts.focusEdit){ const i=$('ed-indent'); if(i) i.focus() }
}
function closePanel(){ const id=state.sel; $('panel').classList.remove('open'); const c=$('cell-'+id); if(c) c.focus({preventScroll:true}) }

$('grid').addEventListener('click', e=>{
  const b = e.target.closest('.cell'); if(!b) return;
  select(+b.dataset.id, {focusCell:e.detail!==0, focusEdit:e.detail===0});
});
$('grid').addEventListener('keydown', e=>{
  const b = e.target.closest('.cell'); if(!b) return;
  const d = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key]; if(!d) return;
  e.preventDefault();
  let ri=+b.dataset.ri, bi=+b.dataset.bi;
  for(let k=0;k<60;k++){ ri+=d[0]; bi+=d[1]; if(ri<0||ri>=nav.length||bi<0||bi>=P.BANDS.length) return;
    const id = nav[ri][bi]; if(id!=null){ b.tabIndex=-1; const n=$('cell-'+id); n.tabIndex=0; n.focus(); n.scrollIntoView({block:'nearest',inline:'nearest'}); return } }
});

/* ---------- panel events ---------- */
const num = v => { v=String(v).trim().replace(/,/g,''); return v===''?'':(isNaN(+v)?null:+v) };
$('panel').addEventListener('input', e=>{
  const r = rowById(state.sel); if(!r) return; const id=e.target.id; const v=num(e.target.value);
  if(v===null) return;
  if(id==='ed-indent') P.setIndent(r,v);
  else if(id==='ed-planned') P.setPlanned(r,v);
  else if(id.startsWith('ed-split-')) P.setSplit(r,id.slice(9),v);
  else return;
  renderAll();
});
$('panel').addEventListener('change', e=>{
  const r = rowById(state.sel); if(!r) return;
  if(e.target.name==='ed-plant'){ P.setChoice(r, e.target.value); renderAll() }
});
$('panel').addEventListener('click', e=>{
  const r = rowById(state.sel); const id=e.target.id; if(!r) return;
  if(id==='pn-close') closePanel();
  else if(id==='ed-keep'){ P.setPlanned(r, r.typed); renderAll() }
  else if(id==='ed-usesug'){ P.setPlanned(r, ''); renderAll(); const p=$('ed-planned'); if(p) p.focus() }
  else if(id==='ed-balance'){ const pl=P.planned(r), a=r.plants[0], b=r.plants[1]; P.setSplit(r,b,Math.max(0,pl-(+r.split[a]||0))); renderAll() }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('panel').classList.contains('open') && matchMedia('(max-width:999.98px)').matches) closePanel() });

/* ---------- top-level events ---------- */
document.querySelectorAll('[data-region]').forEach(b=>b.addEventListener('click', ()=>{
  state.region=b.dataset.region; if(state.sel!=null && rowById(state.sel).region!==state.region) state.sel=null;
  $('ledger').scrollTop=0; $('ledger').scrollLeft=0; renderAll();
}));
$('f-quiet').addEventListener('change', e=>{ state.hideQuiet=e.target.checked; renderAll() });
function nextBlocker(){
  const bl = P.blockers(state.region); if(!bl.length) return;
  const order = groups().flatMap(([,sz])=>sz.flatMap(([,rs])=>rs)).map(r=>r.id);
  const ids = order.filter(id=>bl.some(r=>r.id===id));
  const cur = state.sel!=null ? order.indexOf(state.sel) : -1;
  const nx = ids.find(id=>order.indexOf(id)>cur) ?? ids[0];
  select(nx, {scroll:true, focusCell:true});
}
$('next-blocker').addEventListener('click', nextBlocker);
$('summary').addEventListener('click', e=>{
  if(e.target.id==='finalise'){
    const reg=state.region; if(P.final[reg]) return;
    if(P.finalise(reg)) state.finMsg[reg]='done'; else state.finMsg[reg]='blocked';
    renderAll(); const f=$('finalise'); if(f) f.focus();
  } else if(e.target.id==='fin-show'){ nextBlocker() }
});

renderNotes();
renderAll();
})();
</script>
</body>
</html>
