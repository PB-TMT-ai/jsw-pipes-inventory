<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Campaign Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0b1017; --bg2:#0f1620; --panel:#121b27; --row:#0e151e; --rowalt:#111a25; --line:#1d2a3a; --line2:#27384c;
  --tx:#d5dee8; --tx2:#93a4b8; --tx3:#6a7d93;
  --cyan:#3fc6dc; --cyan-dim:#1d5866;
  --amber:#e8a93a; --amber-bg:rgba(232,169,58,.10); --amber-line:#7a5a22;
  --red:#d06a5f; --red-bg:rgba(208,106,95,.12); --red-line:#7a3a33;
  --ok:#6fb58a;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-width:0}

/* command bar */
.cmd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.brand b{color:var(--tx);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 10px;font:500 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cyan-dim);color:#e9fbff}
.seg button+button{border-left:1px solid var(--line2)}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--tx2);font-size:12px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--cyan);margin:0}
.search{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:3px;padding:0 8px;background:var(--bg)}
.search span{font:500 11px var(--mono);color:var(--tx3)}
.search input{background:transparent;border:0;outline:0;width:110px;padding:4px 0;font:12px var(--mono)}
.search:focus-within{border-color:var(--cyan)}
.keys{margin-left:auto;font:11px var(--mono);color:var(--tx3);white-space:nowrap}
.keys kbd{border:1px solid var(--line2);border-radius:2px;padding:0 3px;color:var(--tx2);font:inherit}

/* status line */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);font:12px var(--mono)}
.st{display:inline-flex;align-items:baseline;gap:6px;padding:0 12px 0 0;margin-right:12px;border-right:1px solid var(--line2);white-space:nowrap}
.st:last-of-type{border-right:0}
.st i{font:500 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-style:normal}
.st b{font-weight:600;color:var(--tx)}
.st.red b{color:var(--red)} .st.amb b{color:var(--amber)}
.fin{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--line2);border-radius:3px;padding:4px 10px;font:600 11.5px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--tx)}
.btn.go{border-color:var(--cyan);color:var(--cyan)}
.btn.go:hover{background:var(--cyan-dim);color:#e9fbff}
.btn.blocked{border-color:var(--amber-line);color:var(--amber)}
.btn.small{padding:1px 6px;font-size:10.5px}
.finmsg{font:12px var(--sans);color:var(--tx2)}
.finmsg.amb{color:var(--amber)} .finmsg.ok{color:var(--ok)}

/* notices */
.notes{display:flex;flex-wrap:wrap;gap:2px 18px;padding:4px 12px;border-bottom:1px solid var(--line);background:var(--bg);font:11.5px var(--sans);color:var(--tx2)}
.notes span::before{content:'';display:inline-block;width:6px;height:6px;margin-right:6px;vertical-align:1px;background:var(--amber)}
.notes span.snap::before{background:var(--tx3)}

/* table */
.wrap{flex:1;min-height:0;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px;font:12px/1 var(--mono);font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:2;background:var(--bg2);border-bottom:1px solid var(--line2);padding:6px 6px;font:500 10.5px/1.15 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);text-align:right;white-space:nowrap}
thead th.l{text-align:left}
thead th small{display:block;font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--tx3);opacity:.8}
tbody td{height:24px;padding:0 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;color:var(--tx)}
tbody tr:nth-child(even) td{background:var(--rowalt)}
tbody tr td{background:var(--row)}
tbody tr.g1 td{border-top:1px solid var(--line2)}
tbody tr.focus td{background:#152234}
td.l{text-align:left}
td.dim,span.dim{color:var(--tx3)}
td.size{font-weight:500;color:var(--tx)}
td.size.rep{color:#33475e}
td.code,th:nth-child(1){position:sticky;left:0;z-index:1}
td.size,th:nth-child(2){position:sticky;left:38px;z-index:1;min-width:62px;box-shadow:1px 0 0 var(--line2)}
thead th:nth-child(1),thead th:nth-child(2){z-index:3}
th:nth-child(1){width:38px;min-width:38px}
td.sec,td.typ{font:11px var(--sans);color:var(--tx2);text-align:left}
td.code{width:38px;min-width:38px;padding:0 0 0 0;text-align:left;font:600 10px/1 var(--sans);letter-spacing:.06em}
td.code span{display:block;height:24px;line-height:24px;padding-left:6px;border-left:3px solid transparent}
tr.k-gap td.code span{border-color:var(--red);color:var(--red)}
tr.k-plt td.code span{border-color:var(--amber);color:var(--amber)}
tr.k-spl td.code span{border-color:var(--red);color:var(--red)}
tr.k-mov td.code span{border-color:var(--amber);color:var(--amber)}
tr.k-gap td{background:var(--red-bg)!important}
tr.k-mov td{background:var(--amber-bg)!important}
tr.resolved td.code span{color:var(--ok);border-color:var(--ok)}
.band{color:var(--cyan);font-size:9px;vertical-align:4px;margin-left:1px}
td.num.z{color:var(--tx3)}

/* cover strip */
td.cov{padding:0 8px;text-align:left}
.strip{display:inline-flex;gap:1px;vertical-align:middle}
.strip i{display:block;width:5px;height:10px;background:#1b2735}
.strip.c0 i.on{background:var(--red)} .strip.c1 i.on{background:var(--amber)} .strip.c2 i.on{background:#4d9fb0} .strip.c3 i.on{background:var(--ok)}
.covp{display:inline-block;width:34px;margin-left:5px;font-size:10.5px;color:var(--tx2);text-align:right;vertical-align:middle}

/* inputs */
td.in{padding:0 2px}
.cell{width:62px;height:20px;border:1px solid var(--line2);border-radius:2px;background:#0a0f15;padding:0 5px;text-align:right;font:12px var(--mono);font-variant-numeric:tabular-nums;color:var(--tx)}
.cell::placeholder{color:#62758a}
.cell:hover{border-color:#3a5068}
.cell:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:var(--cyan);background:#0c1a22}
.cell.typed{color:var(--cyan);border-color:var(--cyan-dim)}
tr.k-mov .cell.typed{color:var(--amber);border-color:var(--amber-line)}
td.sug{color:var(--tx2)}
select.cell{width:118px;text-align:left;padding:0 3px;cursor:pointer;font:12px var(--sans)}
select.cell.need{border-color:var(--amber);color:var(--amber)}
td.plant{text-align:left}
.auto{color:var(--tx)} .auto small{color:var(--tx3);font:10.5px var(--sans);margin-left:4px}
.gaptxt{color:var(--red);font:600 11px var(--sans);letter-spacing:.04em;text-transform:uppercase}
.split{display:inline-flex;align-items:center;gap:3px;margin-left:4px;vertical-align:middle}
.split label{font:10.5px var(--sans);color:var(--tx3)}
.split .cell{width:44px}
.ssum{font-size:10.5px;margin-left:3px}
.ssum.bad{color:var(--red)} .ssum.good{color:var(--ok)}
.split.bad .cell{border-color:var(--red-line)}
td.note{text-align:left;font:11.5px var(--sans);color:var(--tx2);min-width:180px}
td.note .a{color:var(--amber)} td.note .r{color:var(--red)}
.linkbtn{background:none;border:0;padding:0 2px;color:var(--cyan);font:11.5px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.foot td{height:auto;padding:8px 10px;text-align:left;white-space:normal;font:11.5px var(--sans);color:var(--tx2);background:var(--bg)!important;border-bottom:0}
.empty td{text-align:center!important;color:var(--tx3);padding:18px!important;height:auto}

/* inspector + log */
.insp{border-top:1px solid var(--line2);background:var(--bg2);padding:6px 12px;font:11.5px var(--mono);color:var(--tx2);min-height:46px}
.insp .h{font:600 12px var(--sans);color:var(--tx);letter-spacing:.03em}
.insp .h span{color:var(--tx3);font-weight:400;margin-left:8px}
.insp .pl{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:2px}
.insp .pl b{color:var(--tx);font-weight:500}
.insp .pl em{font-style:normal;color:var(--tx3);font-family:var(--sans)}
.insp .fx{color:var(--tx3);margin-top:2px}
.insp .fx b{color:var(--cyan);font-weight:500}
.log{border-top:1px solid var(--line);background:var(--bg);padding:4px 12px;max-height:72px;overflow:auto;font:11px var(--mono);color:var(--tx2)}
.log .h{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.variant{position:fixed;right:8px;bottom:6px;z-index:5;font:10px var(--mono);letter-spacing:.04em;color:var(--tx3);background:rgba(11,16,23,.85);padding:1px 6px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:700px){
  .keys{display:none}
  .fin{margin-left:0;width:100%}
  .st{margin-right:8px;padding-right:8px}
  .search input{width:84px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="cmd" role="toolbar" aria-label="Campaign controls">
    <div class="brand"><b>Monthly Campaign</b> · Nov 2026</div>
    <div class="seg" role="group" aria-label="Region">
      <button id="reg-South" type="button" data-region="South">South</button>
      <button id="reg-West" type="button" data-region="West">West</button>
    </div>
    <label class="chk"><input type="checkbox" id="f-action"> Only rows needing action</label>
    <label class="chk"><input type="checkbox" id="f-quiet"> Show quiet rows <span id="quietn" class="dim"></span></label>
    <label class="search"><span>SIZE/</span><input id="f-search" type="search" placeholder="50x50, 25NB" autocomplete="off" aria-label="Search by size"></label>
    <div class="keys"><kbd>↑↓</kbd> row <kbd>←→</kbd> cell <kbd>Enter</kbd> save+down <kbd>Esc</kbd> undo · plant: <kbd>1</kbd><kbd>2</kbd><kbd>S</kbd> · <kbd>/</kbd> search</div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="notes" id="notes"></div>
  <div class="wrap" id="wrap">
    <table id="grid" aria-label="Campaign rows">
      <thead><tr>
        <th class="l" title="Row state">St</th>
        <th class="l">Size</th>
        <th class="l">Sec</th>
        <th>Thk<small>mm</small></th>
        <th class="l">Type</th>
        <th>Buffer<small>T</small></th>
        <th title="October invoiced, region total (L30)">Oct<small>L30 T</small></th>
        <th title="Aug–Oct invoiced, region total (L90)">Aug–Oct<small>L90 T</small></th>
        <th title="Opening stock 1 Nov, region total">Open<small>1 Nov T</small></th>
        <th class="l" title="Opening stock as a share of what the month needs (Indent, or Buffer if higher)">Cover<small>open ÷ need</small></th>
        <th>Indent<small>T</small></th>
        <th>Sugg<small>T</small></th>
        <th>Planned<small>T</small></th>
        <th class="l">Plant</th>
        <th class="l">Note</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="insp" id="insp"></div>
  <div class="log" id="log" hidden></div>
</div>
<div class="variant">Variant A — Control room</div>

<script src="core.js"></script>
<script>
(function(){
const P = window.PP;
const S = { region:'South', action:false, quiet:false, q:'', focusId:null, keep:new Set(), confirm:false, finMsg:'' };
const $ = id => document.getElementById(id);
const t0 = n => Math.round(n).toLocaleString('en-IN');
const byId = new Map(P.rows.map(r=>[r.id,r]));
const plantsOf = reg => P.REGION_PLANTS[reg];

function state(r){
  const a = P.assign(r);
  if(a.kind==='gap') return 'gap';
  if(a.kind==='choose') return 'plt';
  if(a.kind==='split' && !a.ok) return 'spl';
  if(P.moved(r)) return 'mov';
  return '';
}
const CODE = {gap:'GAP', plt:'PLT', spl:'SPL', mov:'MOV', '':''};
const CODE_T = {gap:'No plant can make this row', plt:'Needs a plant', spl:'Split does not add up to Planned', mov:'Typed Planned kept; the suggestion has moved since'};
const needsAction = r => state(r)!=='';

function need(r){ return (r.type==='Buffer' && r.buffer) ? Math.max(r.indent||0, r.buffer) : (r.indent||0) }
function cover(r){
  const o = P.opening(r), n = need(r);
  if(n<=0) return o>0.5 ? {pct:null,txt:'no need',cls:'c3',seg:10} : {pct:null,txt:'',cls:'c0',seg:0};
  const p = o/n, seg = Math.min(10, Math.round(p*10));
  const cls = p<0.25?'c0':p<0.75?'c1':p<1?'c2':'c3';
  return {pct:p, txt:Math.round(p*100)+'%', cls, seg};
}
function weeks(r){ const o=P.opening(r), oct=P.regionSum(r,'oct'); return oct>0 ? o/(oct/(31/7)) : null }

function visible(){
  const q = S.q.trim().toLowerCase().replace(/\s+/g,'').replace('×','x');
  return P.rows.filter(r=>{
    if(r.region!==S.region) return false;
    if(q && !(r.size.toLowerCase().includes(q) || (r.section+r.size).toLowerCase().includes(q))) return false;
    if(S.action) return needsAction(r) || S.keep.has(r.id);
    if(!S.quiet && P.quiet(r) && !S.keep.has(r.id)) return false;
    return true;
  });
}
function snapshotKeep(){ S.keep = new Set() }

/* ---------- render ---------- */
function plantCell(r, st){
  const a = P.assign(r), ps = r.plants;
  if(a.kind==='gap') return '<span class="gaptxt">No plant can make</span>';
  if(!ps.length) return '<span class="dim">–</span>';
  if(a.kind==='none' && ps.length>1 && r.choice!=='split') return `<span class="dim" title="Planned is 0 — nothing to assign">– <small>(${ps.map(p=>P.PLANTS[p].short).join('/')})</small></span>`;
  if(ps.length===1){
    const nm = P.PLANTS[ps[0]].name;
    return a.kind==='none' ? `<span class="dim">${nm}</span>` : `<span class="auto">${nm}<small>(auto)</small></span>`;
  }
  const opts = [['', 'Choose…'], ...ps.map(p=>[p, P.PLANTS[p].name]), ['split','Split…']]
    .map(([v,l])=>`<option value="${v}"${(r.choice||'')===v?' selected':''}>${l}</option>`).join('');
  let h = `<select class="cell nav${a.kind==='choose'?' need':''}" id="plt-${r.id}" data-c="2" data-id="${r.id}" aria-label="Plant for ${r.section} ${r.size} ${r.thk.toFixed(1)}">${opts}</select>`;
  if(r.choice==='split'){
    const sum = P.splitSum(r), Pl = P.planned(r), ok = a.kind==='split' ? a.ok : true;
    h += `<span class="split${ok?'':' bad'}">` + ps.map((p,i)=>
      `<label for="spl-${r.id}-${p}">${P.PLANTS[p].letter}</label><input class="cell nav" id="spl-${r.id}-${p}" data-c="${3+i}" data-id="${r.id}" data-plant="${p}" inputmode="decimal" autocomplete="off" value="${r.split[p]??''}" aria-label="${P.PLANTS[p].name} share">`
    ).join('') + `<span class="ssum ${ok?'good':'bad'}">${P.f1(sum)}/${P.f1(Pl)}</span></span>`;
  }
  return h;
}
function noteCell(r, st){
  const out = [];
  if(st==='gap') out.push('<span class="r">No ticked plant — not assigned</span>');
  if(st==='plt') out.push('<span class="a">Needs a plant</span>');
  if(st==='spl') out.push(`<span class="r">Split ${P.f1(P.splitSum(r))} ≠ Planned ${P.f1(P.planned(r))}</span>`);
  if(P.moved(r)) out.push(`<span class="a">Sugg moved ${P.f1(r.typedAgainst)}→${P.f1(P.suggested(r))}</span> <button type="button" class="linkbtn" data-use="${r.id}" id="use-${r.id}">use ${P.f1(P.suggested(r))}</button>`);
  const un = P.unticked(r);
  if(un.length) out.push(`<span class="a">${un.map(p=>P.PLANTS[p].short).join('+')} has sales/stock, not ticked</span>`);
  if(S.keep.has(r.id) && !st && S.action) out.push('<span class="dim">resolved</span>');
  return out.join(' · ');
}
function rowHtml(r, first, idx){
  const st = state(r), cv = cover(r), wk = weeks(r);
  const oct = P.regionSum(r,'oct'), ao = P.regionSum(r,'ao'), op = P.opening(r);
  const per = k => plantsOf(r.region).map(p=>`${P.PLANTS[p].short} ${P.fmt(r.byPlant[p]?.[k]||0)}`).join(' · ');
  const band = P.BAND_NOTE[r.thk] ? `<span class="band" title="Band ${r.thk.toFixed(1)} ${P.BAND_NOTE[r.thk]}">+</span>` : '';
  const segs = Array.from({length:10},(_,i)=>`<i class="${i<cv.seg?'on':''}"></i>`).join('');
  const covT = need(r)>0 ? `Opening ${P.f1(op)} T covers ${cv.txt} of need ${P.f1(need(r))} T${wk!=null?` · ≈${wk.toFixed(1)} wks at Oct rate`:''}` : (op>0.5?`Opening ${P.f1(op)} T, no indent or buffer`:'No stock, no need');
  const sug = P.suggested(r), typed = r.typed!=null;
  return `<tr id="row-${r.id}" data-id="${r.id}" class="k-${st||'ok'}${first?' g1':''}${S.focusId&&+S.focusId.split('-')[1]===r.id?' focus':''}${S.keep.has(r.id)&&!st&&S.action?' resolved':''}">
<td class="code" title="${CODE_T[st]||'OK'}"><span>${CODE[st]}</span></td>
<td class="l size${first?'':' rep'}">${first?r.size:'·'}</td>
<td class="sec">${r.section}</td>
<td class="num">${r.thk.toFixed(1)}${band}</td>
<td class="typ">${r.type}</td>
<td class="num${r.buffer?'':' z'}">${r.buffer?P.f1(r.buffer):'–'}</td>
<td class="num${oct?'':' z'}" title="Oct (L30) by plant: ${per('oct')}">${P.fmt(oct)}</td>
<td class="num${ao?'':' z'}" title="Aug–Oct (L90) by plant: ${per('ao')}">${P.fmt(ao)}</td>
<td class="num${op>0.05?'':' z'}" title="Opening 1 Nov by plant: ${per('open')}">${P.fmt(op)}</td>
<td class="cov" title="${covT}"><span class="strip ${cv.cls}" aria-hidden="true">${segs}</span><span class="covp">${cv.txt}</span></td>
<td class="in"><input class="cell nav${r.indent!=null?'':''}" id="ind-${r.id}" data-c="0" data-id="${r.id}" inputmode="decimal" autocomplete="off" value="${r.indent??''}" aria-label="Monthly Indent T, ${r.section} ${r.size} ${r.thk.toFixed(1)}"></td>
<td class="num sug${sug?'':' z'}">${P.fmt(sug)}</td>
<td class="in"><input class="cell nav${typed?' typed':''}" id="pln-${r.id}" data-c="1" data-id="${r.id}" inputmode="decimal" autocomplete="off" value="${typed?r.typed:''}" placeholder="${sug?P.f1(sug):'0'}" aria-label="Planned T, ${r.section} ${r.size} ${r.thk.toFixed(1)}; empty uses suggestion ${sug}"></td>
<td class="plant">${plantCell(r, st)}</td>
<td class="note">${noteCell(r, st)}</td>
</tr>`;
}
function renderTable(){
  const list = visible();
  const groups = P.bySize(list);
  let h = '', idx = 0;
  groups.forEach(([size, rs])=>{ rs.forEach((r,i)=>{ h += rowHtml(r, i===0, idx++) }) });
  if(!list.length) h = `<tr class="empty"><td colspan="15">${S.action?'Nothing needs action in '+S.region+'.':'No rows match.'}</td></tr>`;
  const out = P.outside.filter(o=>o.region===S.region);
  const legend = Object.entries(P.BAND_NOTE).map(([b,n])=>`${(+b).toFixed(1)} band ${n}`).join(' · ');
  h += `<tr class="foot"><td colspan="15"><b style="color:var(--tx)">Outside the plan</b> (sizes with no master row): ${out.length?out.map(o=>`${o.size} ${o.thk.toFixed(1)} — `+Object.entries(o.byPlant).map(([p,v])=>`${P.PLANTS[p].short} open ${P.f1(v.open)}, Oct ${P.f1(v.oct)}, Aug–Oct ${P.f1(v.ao)}`).join('; ')).join(' · '):'none'}<br><span class="band">+</span> Thickness bands: ${legend}. Cover strip = opening stock ÷ month need (Indent, or Buffer if higher); red &lt;25%, amber &lt;75%, teal &lt;100%, green covered.</td></tr>`;
  $('tb').innerHTML = h;
  const allR = P.rows.filter(r=>r.region===S.region);
  $('quietn').textContent = `(${allR.filter(P.quiet).length})`;
}
function renderStatus(){
  const reg = S.region, rs = P.rows.filter(r=>r.region===reg);
  const tot = rs.reduce((s,r)=>s+(r.plants.length?P.planned(r):0),0);
  const per = plantsOf(reg).map(p=>[p, rs.reduce((s,r)=>s+P.share(r,p),0)]);
  const gapR = rs.filter(r=>P.assign(r).kind==='gap'), gapT = gapR.reduce((s,r)=>s+P.planned(r),0);
  const bl = P.blockers(reg), blT = bl.reduce((s,r)=>s+P.planned(r),0);
  const fin = P.final[reg];
  let finH;
  if(S.confirm && !bl.length){
    finH = `<span class="finmsg">Finalise ${reg}: ${t0(tot)} T across ${per.filter(x=>x[1]>0).length} plants?</span><button class="btn go" id="fin-yes" type="button">Confirm</button><button class="btn" id="fin-no" type="button">Cancel</button>`;
  } else if(fin){
    finH = `<span class="finmsg ok">FINALISED ${fin} · rows stay editable, changes are logged</span>`;
  } else if(bl.length){
    finH = `<span class="finmsg amb">Finalise blocked: ${bl.length} row${bl.length>1?'s':''} need a plant</span><button class="btn blocked" id="fin-jump" type="button">Go to first</button><button class="btn" id="fin" type="button" aria-disabled="true" title="Assign a plant to every row first">Finalise ${reg}</button>`;
  } else {
    finH = `<button class="btn go" id="fin" type="button">Finalise ${reg}</button>`;
  }
  $('status').innerHTML =
    `<span class="st"><i>${reg} plan</i><b>${t0(tot)}</b> T</span>` +
    per.map(([p,v])=>`<span class="st"><i>${P.PLANTS[p].name}</i><b>${t0(v)}</b> T</span>`).join('') +
    `<span class="st${blT?' amb':''}"><i>Unassigned</i><b>${t0(blT)}</b> T</span>` +
    `<span class="st${gapT?' red':''}"><i>No plant can make</i><b>${t0(gapT)}</b> T <span class="dim">/ ${gapR.length} rows</span></span>` +
    `<span class="st${bl.length?' amb':''}"><i>Need a plant</i><b>${bl.length}</b> rows</span>` +
    `<span class="fin">${finH}</span>` + (S.finMsg?`<span class="finmsg amb" style="width:100%">${S.finMsg}</span>`:'');
  document.querySelectorAll('.seg button').forEach(b=>{
    const r = b.dataset.region, n = P.blockers(r).length;
    b.setAttribute('aria-pressed', r===reg);
    b.textContent = `${r}${P.final[r]?' ✓':n?' · '+n:''}`;
    b.title = P.final[r] ? `Finalised ${P.final[r]}` : `${n} rows need a plant`;
  });
}
function renderNotes(){
  $('notes').innerHTML = `<span>${P.EXAMPLE_NOTE}</span><span class="snap">${P.SNAPSHOT}</span>`;
}
function renderInsp(){
  const id = S.focusId ? +S.focusId.split('-')[1] : null;
  const r = id!=null ? byId.get(id) : null;
  if(!r || r.region!==S.region){
    $('insp').innerHTML = `<div class="h">Row inspector<span>focus any cell to see per-plant stock and sales, and how Planned is worked out</span></div>`;
    return;
  }
  const op = P.opening(r), ind = r.indent||0, sug = P.suggested(r);
  const base = (r.type==='Buffer' && r.buffer) ? `max(Indent ${P.f1(ind)}, Buffer ${P.f1(r.buffer)})` : `Indent ${P.f1(ind)}`;
  const tick = p => r.plants.includes(p) ? '' : ' <em>(not ticked)</em>';
  $('insp').innerHTML = `<div class="h">${r.section} ${r.size} · ${r.thk.toFixed(1)} mm${P.BAND_NOTE[r.thk]?' ('+P.BAND_NOTE[r.thk]+')':''}<span>${r.type}${r.buffer?' · buffer '+P.f1(r.buffer)+' T':''} · ticked: ${r.plants.length?r.plants.map(p=>P.PLANTS[p].name).join(', '):'none'}</span></div>
  <div class="pl">${plantsOf(r.region).map(p=>{const b=r.byPlant[p]||{};return `<span><b>${P.PLANTS[p].name}</b>${tick(p)} open ${P.fmt(b.open||0)} · Oct ${P.fmt(b.oct||0)} · Aug–Oct ${P.fmt(b.ao||0)}</span>`}).join('')}<span><b>Region</b> open ${P.fmt(op)} · Oct ${P.fmt(P.regionSum(r,'oct'))} · Aug–Oct ${P.fmt(P.regionSum(r,'ao'))}</span></div>
  <div class="fx">Sugg = ${base} − Open ${P.f1(op)}, floor 0, up to 10 = <b>${P.f1(sug)}</b>${r.typed!=null?` · typed ${P.f1(r.typed)} kept${P.moved(r)?' (suggestion moved from '+P.f1(r.typedAgainst)+')':''}`:''}</div>`;
}
function renderLog(){
  const el = $('log');
  if(!P.log.length){ el.hidden = true; return }
  el.hidden = false;
  el.innerHTML = `<div class="h">Change log after Finalise</div>` + P.log.map(l=>`<div>${l}</div>`).join('');
}
function render(focusId){
  renderStatus(); renderTable(); renderInsp(); renderLog();
  if(focusId){
    const el = $(focusId);
    if(el){ el.focus({preventScroll:true}); if(el.select && el.tagName==='INPUT') el.select(); scrollIntoRow(el) }
  }
}
function scrollIntoRow(el){
  const w = $('wrap'), tr = el.closest('tr'); if(!tr) return;
  const head = w.querySelector('thead').offsetHeight;
  const top = tr.offsetTop - head, bot = tr.offsetTop + tr.offsetHeight;
  if(top < w.scrollTop) w.scrollTop = top;
  else if(bot > w.scrollTop + w.clientHeight) w.scrollTop = bot - w.clientHeight;
}

/* ---------- commit ---------- */
function parse(v){ v = String(v).trim().replace(/,/g,''); if(v==='') return ''; const n = Number(v); return isFinite(n) && n>=0 ? n : null }
function commit(el){
  if(!el || !el.dataset || el.dataset.id==null || el.tagName!=='INPUT') return false;
  const r = byId.get(+el.dataset.id), c = +el.dataset.c, v = parse(el.value);
  if(v===null){ el.value = el.defaultValue; return false }
  if(c===0){ const cur = r.indent??''; if(String(cur)===String(v)) return false; P.setIndent(r, v) }
  else if(c===1){ const cur = r.typed??''; if(String(cur)===String(v)) return false; P.setPlanned(r, v) }
  else { const p = el.dataset.plant, cur = r.split[p]??''; if(String(cur)===String(v===''?0:v) ) return false; P.setSplit(r, p, v) }
  if(S.action) S.keep.add(r.id);
  if(!S.quiet) S.keep.add(r.id);
  return true;
}

/* ---------- keyboard grid ---------- */
function navEls(){ return [...$('tb').querySelectorAll('.nav')] }
function rowEls(tr){ return [...tr.querySelectorAll('.nav')] }
function vert(el, dir){
  let tr = el.closest('tr'), c = +el.dataset.c;
  while((tr = dir>0 ? tr.nextElementSibling : tr.previousElementSibling)){
    const cand = tr.querySelector(`.nav[data-c="${c}"]`) || (c>=2 ? null : null);
    if(cand) return cand.id;
  }
  return null;
}
function horiz(el, dir){
  const els = rowEls(el.closest('tr')), i = els.indexOf(el), n = els[i+dir];
  return n ? n.id : null;
}
function go(fromEl, targetId){
  const changed = commit(fromEl);
  if(!targetId) { if(changed) render(fromEl.id); return }
  S.focusId = targetId;
  if(changed) render(targetId);
  else { const t = $(targetId); t.focus({preventScroll:true}); if(t.tagName==='INPUT') t.select(); scrollIntoRow(t); markFocus() }
}
function markFocus(){
  document.querySelectorAll('tr.focus').forEach(t=>t.classList.remove('focus'));
  const el = S.focusId && $(S.focusId); if(el) el.closest('tr').classList.add('focus');
  renderInsp();
}

const tb = $('tb');
tb.addEventListener('keydown', e=>{
  const el = e.target; if(!el.classList.contains('nav')) return;
  const isIn = el.tagName==='INPUT', isSel = el.tagName==='SELECT';
  const atStart = isIn ? el.selectionStart===0 && el.selectionEnd===0 || (el.selectionStart===0 && el.selectionEnd===el.value.length) : true;
  const atEnd = isIn ? el.selectionEnd===el.value.length : true;
  if(e.key==='ArrowDown' || (e.key==='Enter' && isIn)){
    e.preventDefault(); go(el, vert(el, e.shiftKey && e.key==='Enter' ? -1 : 1) );
  } else if(e.key==='ArrowUp'){
    e.preventDefault(); go(el, vert(el, -1));
  } else if(e.key==='ArrowLeft' && atStart){
    const t = horiz(el,-1); if(t){ e.preventDefault(); go(el, t) }
  } else if(e.key==='ArrowRight' && atEnd){
    const t = horiz(el, 1); if(t){ e.preventDefault(); go(el, t) }
  } else if(e.key==='Escape' && isIn){
    el.value = el.defaultValue; el.select();
  } else if(isSel && !e.altKey && !e.ctrlKey && !e.metaKey){
    const r = byId.get(+el.dataset.id), k = e.key.toLowerCase();
    let v;
    if(k==='1') v = r.plants[0]; else if(k==='2') v = r.plants[1]; else if(k==='s') v = 'split'; else if(k==='0' || k==='backspace') v = '';
    if(v!==undefined){ e.preventDefault(); applyChoice(r, v, el.id) }
  }
});
function applyChoice(r, v, fid){
  P.setChoice(r, v);
  S.keep.add(r.id);
  let target = fid;
  if(v==='split') target = `spl-${r.id}-${r.plants[0]}`;
  S.focusId = target; S.finMsg = '';
  render(target);
}
tb.addEventListener('change', e=>{
  const el = e.target;
  if(el.tagName==='SELECT' && el.dataset.id!=null) applyChoice(byId.get(+el.dataset.id), el.value, el.id);
});
tb.addEventListener('focusin', e=>{
  const el = e.target; if(!el.classList.contains('nav')) return;
  S.focusId = el.id; markFocus();
});
tb.addEventListener('focusout', e=>{
  const el = e.target; if(el.tagName!=='INPUT' || !el.classList.contains('nav')) return;
  const next = e.relatedTarget;
  if(commit(el)){
    const nid = next && next.id ? next.id : null;
    if(nid) S.focusId = nid;
    render(nid);
  }
});
tb.addEventListener('click', e=>{
  const b = e.target.closest('[data-use]'); if(!b) return;
  const r = byId.get(+b.dataset.use); P.setPlanned(r, ''); S.keep.add(r.id);
  render(`pln-${r.id}`);
});

/* ---------- controls ---------- */
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  S.region = b.dataset.region; S.confirm = false; S.finMsg = ''; S.focusId = null; snapshotKeep();
  $('wrap').scrollTop = 0; render(b.id);
}));
$('f-action').addEventListener('change', e=>{ S.action = e.target.checked; snapshotKeep(); render() });
$('f-quiet').addEventListener('change', e=>{ S.quiet = e.target.checked; snapshotKeep(); render() });
$('f-search').addEventListener('input', e=>{ S.q = e.target.value; renderTable() });
document.addEventListener('keydown', e=>{
  if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); $('f-search').focus() }
  if(e.key==='Escape' && document.activeElement===$('f-search')){ $('f-search').value=''; S.q=''; renderTable(); const f = navEls()[0]; if(f) f.focus() }
  if(e.key==='Enter' && document.activeElement===$('f-search')){ const f = navEls()[0]; if(f){ e.preventDefault(); f.focus(); f.select && f.select() } }
});
$('status').addEventListener('click', e=>{
  const id = e.target.id;
  if(id==='fin'){
    if(P.blockers(S.region).length){ S.finMsg = 'Every row with Planned > 0 and two ticked plants needs Choose → a plant or a split that adds up.'; render('fin-jump'); return }
    S.confirm = true; S.finMsg=''; render('fin-yes');
  } else if(id==='fin-no'){ S.confirm = false; render('fin') }
  else if(id==='fin-yes'){
    S.confirm = false;
    if(!P.finalise(S.region)){ S.finMsg = 'Blocked — a row still needs a plant.'; render('fin-jump'); return }
    S.finMsg = ''; render();
  } else if(id==='fin-jump'){
    const r = P.blockers(S.region)[0]; if(!r) return;
    if(P.quiet(r) && !S.quiet) S.keep.add(r.id);
    if(S.q){ S.q=''; $('f-search').value='' }
    const fid = r.choice==='split' ? `spl-${r.id}-${r.plants[0]}` : `plt-${r.id}`;
    S.focusId = fid; S.finMsg = ''; render(fid);
  }
});

renderNotes();
render();
})();
</script>
</body>
</html>
