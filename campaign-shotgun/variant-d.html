<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eaeef3; --surface-3:#dfe5ec;
  --border:#d3dae3; --border-strong:#aab5c3; --text:#18212c; --muted:#596777; --faint:#8794a3;
  --primary:#24344d; --primary-text:#ffffff; --focus:#2f6fe0;
  --manual-bg:#e9f0fe; --manual-border:#8eb0ee; --manual-text:#1c4db3;
  --auto-bg:#e6f5eb; --auto-border:#93cfa8; --auto-text:#1b7139;
  --warn-bg:#fff5d1; --warn-border:#e2bd3c; --warn-text:#7d5800;
  --gap-bg:#fdeceb; --gap-border:#e49b95; --gap-text:#b0261b;
  --plant-1:#4b627f; --plant-2:#8a9bb0;
  --shadow:0 1px 2px rgba(20,32,48,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#151c25; --surface-2:#1b2430; --surface-3:#243041;
    --border:#2a3646; --border-strong:#435268; --text:#e2e8f0; --muted:#97a5b7; --faint:#6b7a8d;
    --primary:#c9d6e8; --primary-text:#0e131a; --focus:#79a6ff;
    --manual-bg:#14264a; --manual-border:#3c63ad; --manual-text:#9dbdff;
    --auto-bg:#0f2a1b; --auto-border:#2f7048; --auto-text:#77d59a;
    --warn-bg:#30270b; --warn-border:#8a6d1c; --warn-text:#f0ca5c;
    --gap-bg:#371615; --gap-border:#8d3a33; --gap-text:#ff9389;
    --plant-1:#8fa6c4; --plant-2:#55667d;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --surface-2:#1b2430; --surface-3:#243041;
  --border:#2a3646; --border-strong:#435268; --text:#e2e8f0; --muted:#97a5b7; --faint:#6b7a8d;
  --primary:#c9d6e8; --primary-text:#0e131a; --focus:#79a6ff;
  --manual-bg:#14264a; --manual-border:#3c63ad; --manual-text:#9dbdff;
  --auto-bg:#0f2a1b; --auto-border:#2f7048; --auto-text:#77d59a;
  --warn-bg:#30270b; --warn-border:#8a6d1c; --warn-text:#f0ca5c;
  --gap-bg:#371615; --gap-border:#8d3a33; --gap-text:#ff9389;
  --plant-1:#8fa6c4; --plant-2:#55667d;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
.mono,.n,input.in{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
a{color:inherit}

/* app bar */
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:700;letter-spacing:.01em}
.crumbs{color:var(--muted);font-size:14px}
.crumbs b{color:var(--text);font-weight:600}
.appbar .spacer{flex:1}
.variant{font-size:12px;color:var(--faint)}
.btn-theme{border:1px solid var(--border);background:var(--surface-2);border-radius:4px;padding:3px 10px;font-size:13px;cursor:pointer}

.wrap{max-width:1320px;margin:0 auto;padding:0 16px}

/* progress header */
.ph{padding:18px 0 14px;border-bottom:1px solid var(--border)}
.ph-top{display:flex;align-items:flex-start;gap:16px 24px;flex-wrap:wrap}
.ph-title{flex:1 1 320px;min-width:0}
.ph h1{font-size:24px;line-height:1.2;font-weight:700}
.ph .sub{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:5px;overflow:hidden;background:var(--surface);flex-wrap:nowrap}
.seg button{border:0;border-right:1px solid var(--border-strong);background:transparent;padding:6px 14px;min-height:34px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
.counts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.counts a{text-decoration:none;display:inline-flex;align-items:baseline;gap:6px;border-bottom:1px solid transparent}
.counts a:hover{border-bottom-color:currentColor}
.counts .num{font-family:"Roboto Mono",monospace;font-weight:600}
.c-warn{color:var(--warn-text)} .c-gap{color:var(--gap-text)} .c-ok{color:var(--auto-text)} .c-muted{color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.bar{flex:1 1 260px;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;min-width:0}
.bar>span{display:block;height:100%;background:var(--auto-text);border-radius:4px;transition:width .3s ease}
.prog .lbl{font-size:13px;color:var(--muted)}
.fin{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 1 auto;max-width:100%}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:5px;padding:6px 14px;min-height:36px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn[aria-disabled="true"]{background:var(--surface-3);color:var(--faint);border-color:var(--border);cursor:not-allowed;filter:none}
.btn.small{min-height:30px;padding:3px 10px;font-size:14px}
.btn.link{border:0;background:none;padding:4px 6px;text-decoration:underline;color:var(--muted);min-height:30px;font-weight:500}
.reason{font-size:13px;color:var(--warn-text);text-align:right}
.reason.done{color:var(--auto-text)}
.confirm{margin-top:12px;padding:10px 12px;border:1px solid var(--border-strong);border-left:3px solid var(--primary);background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.confirm p{flex:1 1 280px}
.notes{display:flex;flex-direction:column;gap:4px;padding:10px 0;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--border)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:0 6px;border-radius:3px;border:1px solid var(--border-strong);color:var(--muted);margin-right:6px;line-height:18px;vertical-align:1px}
.tag.warn{border-color:var(--warn-border);background:var(--warn-bg);color:var(--warn-text)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding-top:20px;padding-bottom:40px;align-items:start}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:19px;font-weight:700}
.sec-head .meta{color:var(--muted);font-size:14px}

/* queue */
.grp{margin-bottom:22px}
.grp h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;outline-offset:4px}
.grp h3 .n{font-family:"Roboto Mono",monospace;font-size:13px;font-weight:600;padding:0 7px;border-radius:10px;background:var(--surface-3)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.g-choose .dot,.g-split .dot,.g-moved .dot,.g-unticked .dot{background:var(--warn-border)}
.g-gap .dot{background:var(--gap-text)}
.blk{font-size:12px;font-weight:600;color:var(--warn-text);border:1px solid var(--warn-border);border-radius:3px;padding:0 5px}
.info{font-size:12px;font-weight:600;color:var(--muted)}
.ghelp{font-size:14px;color:var(--muted);margin:2px 0 8px}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.card{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.4fr) minmax(0,auto);gap:8px 18px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn-border);border-radius:6px;box-shadow:var(--shadow);transition:height .2s ease,opacity .2s ease,padding .2s ease,margin .2s ease,border-width .2s ease,background-color .2s ease}
.card.g-gap{border-left-color:var(--gap-text)}
.card.leaving{height:0!important;opacity:0;padding-top:0;padding-bottom:0;margin-top:-6px;border-top-width:0;border-bottom-width:0;overflow:hidden;background:var(--auto-bg)}
.c-name{font-weight:700;font-size:15.5px;white-space:nowrap}
.c-name .sec{color:var(--muted);font-weight:600;font-size:13px;margin-right:2px}
.c-thk{font-family:"Roboto Mono",monospace;font-weight:500;font-size:14px}
.c-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.typ{font-weight:600}
.typ.buf{color:var(--text)}
.figs{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0}
.fig{min-width:0}
@media (min-width: 1180px){
  .card{grid-template-columns:minmax(140px,1fr) auto minmax(170px,auto)}
  .figs{display:grid;grid-template-columns:48px 132px 132px 56px 78px;gap:4px 12px}
}
@media (min-width: 900px) and (max-width: 1179px){
  .card{grid-template-columns:minmax(0,1fr) auto}
  .card .figs{grid-column:1 / -1;grid-row:2}
}
.fig dt{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.fig dd{margin:0;font-family:"Roboto Mono",monospace;font-size:14px;font-weight:500;white-space:nowrap}
.fig dd small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.chip{display:inline-block;padding:0 6px;border-radius:3px;border:1px solid transparent}
.chip.manual{background:var(--manual-bg);color:var(--manual-text);border-color:var(--manual-border)}
.chip.auto{background:var(--auto-bg);color:var(--auto-text);border-color:var(--auto-border)}
.chip.warn{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)}
.chip.gap{background:var(--gap-bg);color:var(--gap-text);border-color:var(--gap-border)}
.fix{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:13px;color:var(--muted)}
.split{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sp{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.sp-state{font-size:13px;font-weight:600;min-width:9em}
.sp-state.ok{color:var(--auto-text)} .sp-state.bad{color:var(--gap-text)}
.more{margin-top:6px}
.clearline{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:14px;color:var(--muted);padding:8px 0 4px;border-top:1px dashed var(--border)}
.clearline .ok{color:var(--auto-text);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.clearline span[tabindex]{outline-offset:3px}
.allclear{padding:14px;border:1px solid var(--auto-border);background:var(--auto-bg);color:var(--auto-text);border-radius:6px;font-weight:600;margin-bottom:16px}

/* inputs */
input.in{width:76px;text-align:right;padding:4px 6px;border:1px solid var(--manual-border);background:var(--manual-bg);color:var(--manual-text);border-radius:4px;font-size:13.5px;min-height:30px}
input.in.auto{background:var(--auto-bg);border-color:var(--auto-border);color:var(--auto-text)}
input.in.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
input.in.bad{background:var(--gap-bg);border-color:var(--gap-border);color:var(--gap-text)}
input.in.zero{opacity:.7}
input.in.sm{width:60px}
input.in::placeholder{color:var(--faint)}
select.sel{padding:4px 6px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);min-height:30px;font-size:13.5px}
select.sel.warn{border-color:var(--warn-border);background:var(--warn-bg);color:var(--warn-text);font-weight:600}

/* everything else */
.rest{margin-top:30px;padding-top:18px;border-top:2px solid var(--border)}
.sect{border-bottom:1px solid var(--border)}
.sect h3{margin:0}
.sect-btn{display:flex;width:100%;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 4px;border:0;background:none;cursor:pointer;text-align:left}
.sect-btn:hover{background:var(--surface-2)}
.chev{width:14px;height:14px;flex:none;transition:transform .15s ease;color:var(--muted)}
.sect-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sect-btn .nm{font-weight:700;font-size:16px}
.sect-btn .full{color:var(--muted);font-size:14px}
.sect-btn .meta{margin-left:auto;font-size:14px;color:var(--muted)}
.sect-btn .meta b{font-family:"Roboto Mono",monospace;color:var(--auto-text);font-weight:600}
.panel{padding:2px 0 14px}
.tscroll{overflow-x:auto;border:1px solid var(--border);background:var(--surface);-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;min-width:820px;font-size:13.5px}
table.grid th,table.grid td{padding:4px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;white-space:nowrap}
table.grid thead th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
table.grid .n{text-align:right}
table.grid tbody th{font-weight:700;font-family:"Source Sans 3",sans-serif}
table.grid tr.first td,table.grid tr.first th{border-top:1px solid var(--border-strong)}
table.grid tr.inq{background:var(--warn-bg)}
table.grid small{display:block;font-size:10.5px;color:var(--muted);font-family:"Roboto Mono",monospace;line-height:1.1}
.bandnote{font-size:10.5px;color:var(--muted);font-family:"Source Sans 3",sans-serif}
.auto-t{color:var(--auto-text);font-weight:600}
.muted{color:var(--muted)}
.note-warn{display:inline-block;font-size:11.5px;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:3px;padding:0 4px;margin-left:6px}
.badge-gap{display:inline-block;font-size:12px;font-weight:700;color:var(--gap-text);background:var(--gap-bg);border:1px solid var(--gap-border);border-radius:3px;padding:0 6px}
.badge-q{display:inline-block;font-size:11.5px;font-weight:600;color:var(--warn-text);margin-left:6px}
.quietbar{display:flex;gap:10px;align-items:center;padding:6px 0 0;font-size:13px;color:var(--muted);flex-wrap:wrap}
.outside{margin-top:14px;font-size:13.5px;color:var(--muted)}
.outside b{color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid;vertical-align:-2px;margin-right:4px}

/* summary */
.sum{position:sticky;top:16px}
.sum-in{background:var(--surface);border:1px solid var(--border);padding:16px}
.sum h2{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.big{margin-top:6px;display:flex;align-items:baseline;gap:6px}
.big .mono{font-size:30px;font-weight:600;color:var(--auto-text);line-height:1.1}
.big span:last-child{color:var(--muted)}
.stack{display:flex;height:10px;margin:10px 0 12px;background:var(--surface-3);gap:2px;overflow:hidden;border-radius:2px}
.stack span{display:block;height:100%;min-width:0}
.s-p0{background:var(--plant-1)} .s-p1{background:var(--plant-2)} .s-wait{background:var(--warn-border)} .s-gap{background:var(--gap-text)}
.sumlist{margin:0;display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:baseline;font-size:14px}
.sumlist dt{display:contents}
.sumlist .sw{width:10px;height:10px;border-radius:2px;align-self:center}
.sumlist dd{margin:0;font-family:"Roboto Mono",monospace;text-align:right;font-weight:500}
.sumlist .r{color:var(--muted);font-size:12px;font-family:"Source Sans 3",sans-serif;font-weight:400}
.needs{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:14px}
.needs .num{font-family:"Roboto Mono",monospace;font-weight:600}
.sum .btn{width:100%;margin-top:10px}
.sum h3{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;letter-spacing:.02em}
table.mini{border-collapse:collapse;width:100%;font-size:13px}
table.mini th,table.mini td{padding:3px 4px;border-bottom:1px solid var(--border);text-align:right}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini thead th{font-size:11.5px;color:var(--muted);font-weight:600}
table.mini td{font-family:"Roboto Mono",monospace}
table.mini td:first-child{font-family:"Source Sans 3",sans-serif;font-weight:600}
table.mini tfoot td{font-weight:600;border-bottom:0}
.log{list-style:none;padding:0;margin:0;font-size:12.5px;color:var(--muted);max-height:160px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px dashed var(--border)}
.pbar{display:none}

@media (max-width: 899px){
  .layout{grid-template-columns:minmax(0,1fr);gap:20px;padding-bottom:96px}
  .sum{position:static}
  .card{grid-template-columns:minmax(0,1fr)}
  .fix,.split{justify-content:flex-start}
  .fin{align-items:flex-start;width:100%}
  .reason{text-align:left}
  .pbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--border-strong);padding:8px 16px;gap:4px 14px;flex-wrap:wrap;font-size:13px;align-items:baseline}
  .pbar b{font-family:"Roboto Mono",monospace;font-weight:600}
  .pbar .tot b{color:var(--auto-text);font-size:15px}
  .ph h1{font-size:21px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="appbar">
  <span class="brand">JSW Pipes &amp; Tubes</span>
  <nav class="crumbs" aria-label="Breadcrumb">Planning / <b>Monthly Campaign</b></nav>
  <span class="spacer"></span>
  <span class="variant">Variant D — Exceptions first</span>
  <button type="button" class="btn-theme" id="theme-toggle" aria-label="Switch colour theme">Theme</button>
</div>
<div class="wrap">
  <div id="hdr"></div>
  <div id="notes" class="notes"></div>
  <div class="layout">
    <main id="main">
      <section class="queue" aria-labelledby="q-h" id="queue"></section>
      <section class="rest" aria-labelledby="rest-h" id="rest"></section>
    </main>
    <aside class="sum" aria-label="Plan summary" id="sum"></aside>
  </div>
</div>
<div class="pbar" id="pbar"></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>

<script src="core.js"></script>
<script>
(function(){
const P = window.PP;
const SECTIONS = ['SHS','RHS','CHS'];
const SECT_NAME = {SHS:'Square hollow', RHS:'Rectangular hollow', CHS:'Circular hollow'};
const MONTH = 'November';
const S = {region:'South', open:{}, quiet:{}, more:{}, ack:new Set(), openSplit:new Set(), pinned:new Set(), confirm:null};
const GROUPS = [
  {key:'choose', title:'Needs a plant', blocks:true, help:'Two plants can make these. Pick one, or split the tonnage between them.'},
  {key:'split', title:"Split doesn't add up", blocks:true, help:'The plant shares must add up to Planned before you can Finalise.'},
  {key:'gap', title:'No plant can make', blocks:false, help:'No plant is ticked for this size in the SKU master, so this tonnage is never assigned and sits outside every plant total. Set Planned to 0 to drop it, or tick a plant in Masters.'},
  {key:'moved', title:'Suggestion moved', blocks:false, help:'You typed a Planned figure, then the Indent or stock changed and the suggestion moved. Your figure is kept until you decide.'},
  {key:'unticked', title:'Made at an unticked plant', blocks:false, help:'This plant has stock or sales on the size but is not ticked for it, so it is never offered here. Check the master; mark as noted to clear.'}
];

const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = n => { const v = Math.round(n*10)/10; return Number.isInteger(v) ? v.toLocaleString('en-IN') : v.toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1}); };
const short = p => P.PLANTS[p].short;
const pname = p => P.PLANTS[p].name;
const thk = r => r.thk.toFixed(1);
const rowName = r => `${r.section} ${r.size} ${thk(r)} mm`;
const regionRows = () => P.rows.filter(r => r.region === S.region);
const plantsHere = () => P.REGION_PLANTS[S.region];
const plural = (n, one, many) => `${n} ${n===1?one:many}`;
const parseNum = v => { v = String(v).trim(); if (v === '') return ''; const n = parseFloat(v); return isNaN(n) ? null : n; };

function groupOf(r){
  if (S.openSplit.has(r.id)) return 'choose';
  const a = P.assign(r);
  if (a.kind === 'choose') return 'choose';
  if (a.kind === 'split' && !a.ok) return 'split';
  if (a.kind === 'gap') return 'gap';
  if (P.moved(r)) return 'moved';
  if (P.unticked(r).length && !S.ack.has(r.id)) return 'unticked';
  return null;
}
function sortRows(list){
  return list.slice().sort((a,b) => {
    const s = SECTIONS.indexOf(a.section) - SECTIONS.indexOf(b.section); if (s) return s;
    const x = P.sizeKey(a.size), y = P.sizeKey(b.size);
    return x[0]-y[0] || x[1]-y[1] || x[2]-y[2] || a.thk-b.thk;
  });
}
const queueSig = () => regionRows().map(r => groupOf(r) || '').join(',');

function stats(){
  const rows = regionRows(), plants = plantsHere();
  const by = {}; plants.forEach(p => by[p] = {t:0, n:0});
  let total=0, gapT=0, gapN=0, waitT=0, assignable=0, done=0, movedN=0, splitBad=0, choose=0;
  rows.forEach(r => {
    const pl = P.planned(r), a = P.assign(r); total += pl;
    let shares = 0;
    plants.forEach(p => { const s = P.share(r,p); if (s>0){ by[p].t += s; by[p].n++; shares += s; } });
    if (a.kind === 'gap'){ gapT += pl; gapN++; }
    if (a.kind === 'choose'){ waitT += pl; choose++; }
    if (a.kind === 'split' && !a.ok){ waitT += Math.max(0, pl - shares); splitBad++; }
    if (a.kind === 'one' || a.kind === 'split' || a.kind === 'choose'){ assignable++; if (a.kind === 'one' || (a.kind === 'split' && a.ok)) done++; }
    if (P.moved(r)) movedN++;
  });
  const blockers = P.blockers(S.region).length;
  return {rows, plants, by, total, gapT, gapN, waitT, assignable, done, movedN, splitBad, choose, blockers};
}

/* ---------- header ---------- */
function finControl(st, where){
  const fin = P.final[S.region];
  if (fin){
    return `<button type="button" class="btn" id="fin-${where}" aria-disabled="true">Finalised ${fin}</button>
      <span class="reason done">Still editable · every change goes to the change log</span>`;
  }
  if (st.blockers){
    const parts = [];
    if (st.choose) parts.push(plural(st.choose,'row needs','rows need') + ' a plant');
    if (st.splitBad) parts.push(plural(st.splitBad,"split doesn't","splits don't") + ' add up');
    return `<button type="button" class="btn primary" id="fin-${where}" aria-disabled="true" aria-describedby="fin-why-${where}">Finalise ${S.region}</button>
      <span class="reason" id="fin-why-${where}">Blocked: ${parts.join(' · ')}</span>`;
  }
  return `<button type="button" class="btn primary" id="fin-${where}">Finalise ${S.region}</button>
    <span class="reason done">Every row with tonnage has a plant</span>`;
}
function confirmBox(st, where){
  if (S.confirm !== where) return '';
  const per = st.plants.map(p => `${pname(p)} ${T(st.by[p].t)} T`).join(', ');
  const gap = st.gapN ? ` ${plural(st.gapN,'row','rows')} (${T(st.gapT)} T) that no plant can make stay out of every plant total.` : '';

    <p>Finalise ${S.region} for ${MONTH}: <b class="mono">${T(st.total - st.gapT)}</b> T across plants — ${per}.${gap} You can still edit afterwards; changes are logged.</p>

/* ---------- queue ---------- */
function salesFig(r,k){
  const tot = P.regionSum(r,k);
  const parts = P.REGION_PLANTS[r.region].filter(p => (r.byPlant[p]?.[k]||0) > 0);
  let sub = '';
  if (parts.length > 1) sub = parts.map(p => `${short(p)} ${P.f1(r.byPlant[p][k])}`).join(' · ');
  else if (parts.length === 1) sub = `all ${short(parts[0])}`;
  return {tot, sub};
}
function plannedCls(r){ return r.typed == null ? 'auto' : (P.moved(r) ? 'warn' : 'manual'); }
function typeLabel(r){ return r.type === 'Buffer' ? `<span class="typ buf">Buffer${r.buffer?` ${T(r.buffer)} T`:' (no level set)'}</span>` : `<span class="typ">MTO</span>`; }
function bandNote(r){ const n = P.BAND_NOTE[r.thk]; return n ? `<span>band ${n}</span>` : ''; }
function fig(label, val, sub, cls){
  return `<div class="fig"><dt>${label}</dt><dd>${cls?`<span class="chip ${cls}">${val}</span>`:val}${sub?`<small>${sub}</small>`:''}</dd></div>`;
}
function splitEditor(r, g){
  const pl = P.planned(r), sum = P.splitSum(r), ok = Math.abs(sum - pl) < 1e-9;
  const inputs = r.plants.map((p,i) => `<label class="sp" for="q-${r.id}-s-${p}">${short(p)}
      <input id="q-${r.id}-s-${p}" class="in sm ${ok?'manual':'bad'}" type="text" inputmode="decimal" autocomplete="off" value="${+r.split[p]||0}" data-act="qsplit" data-id="${r.id}" data-p="${p}" ${i===0?'data-first':''}></label>`).join('');
  const state = splitState(r);
  const tail = g === 'choose'
    ? `<button type="button" class="btn small" id="q-${r.id}-done" data-act="splitdone" data-id="${r.id}" ${ok?'':'aria-disabled="true"'}>Done</button>
       <button type="button" class="btn link" id="q-${r.id}-back" data-act="splitback" data-id="${r.id}">Back</button>`
    : r.plants.map(p => `<button type="button" class="btn link" id="q-${r.id}-only-${p}" data-act="pick" data-id="${r.id}" data-p="${p}">All ${short(p)}</button>`).join('');
  return `<div class="split">${inputs}<span class="sp-state ${state.ok?'ok':'bad'}" id="q-${r.id}-state">${state.text}</span>${tail}</div>`;
}
function splitState(r){
  const pl = P.planned(r), sum = P.splitSum(r), d = Math.round((pl - sum)*10)/10;
  if (Math.abs(d) < 1e-9) return {ok:true, text:`Adds up to ${T(pl)} T`};
  return {ok:false, text: d > 0 ? `${T(d)} T short of ${T(pl)}` : `${T(-d)} T over ${T(pl)}`};
}
function fixHtml(r, g){
  const id = r.id;
  if (g === 'choose'){
    if (S.openSplit.has(id)) return splitEditor(r, g);
    return `<div class="seg" role="group" aria-label="Plant for ${rowName(r)}">
      ${r.plants.map((p,i) => `<button type="button" id="q-${id}-p-${p}" data-act="pick" data-id="${id}" data-p="${p}" ${i===0?'data-first':''}>${short(p)}</button>`).join('')}
      <button type="button" id="q-${id}-p-split" data-act="opensplit" data-id="${id}">Split</button></div>`;
  }
  if (g === 'split') return splitEditor(r, g);
  if (g === 'gap'){
    return `<label class="hint" for="q-${id}-planned">Planned</label>
      <input id="q-${id}-planned" class="in ${plannedCls(r)}" type="text" inputmode="decimal" autocomplete="off" value="${P.planned(r)}" data-act="qplanned" data-id="${id}" data-first>
      <span class="badge-gap">No plant can make</span>`;
  }
  if (g === 'moved'){
    return `<span class="hint">You typed <b class="chip warn mono">${T(r.typed)}</b> · suggestion now <b class="chip auto mono">${T(P.suggested(r))}</b></span>
      <div class="seg" role="group" aria-label="Resolve moved suggestion for ${rowName(r)}">
        <button type="button" id="q-${id}-keep" data-act="keep" data-id="${id}" data-first>Keep my figure</button>
        <button type="button" id="q-${id}-use" data-act="use" data-id="${id}">Use suggestion</button></div>`;
  }
  if (g === 'unticked'){
    const txt = P.unticked(r).map(p => { const b = r.byPlant[p] || {}; return `<b>${pname(p)}</b> ${P.f1(b.open||0)} T stock · ${P.f1(b.ao||0)} T Aug–Oct`; }).join('; ');
    return `<span class="hint">${txt} — not ticked</span>
      <button type="button" class="btn small" id="q-${id}-ack" data-act="ack" data-id="${id}" data-first>Noted</button>`;
  }
  return '';
}
function card(r, g){
  const oct = salesFig(r,'oct'), ao = salesFig(r,'ao');
  const pl = P.planned(r);
  const plCls = g === 'gap' ? 'gap' : plannedCls(r);
  return `<li class="card g-${g}" data-row="${r.id}" data-group="${g}">
    <div class="c-id"><div class="c-name"><span class="sec">${r.section}</span> ${r.size} <span class="c-thk">${thk(r)} mm</span></div>
      <div class="c-meta">${typeLabel(r)}${bandNote(r)}</div></div>
    <dl class="figs">
      ${fig('Open', P.fmt(P.opening(r)))}
      ${fig('Oct', P.fmt(oct.tot), oct.sub)}
      ${fig('Aug–Oct', P.fmt(ao.tot), ao.sub)}
      ${fig('Indent', r.indent==null?'–':T(r.indent), '', 'manual')}
      ${fig('Planned', T(pl), r.typed!=null?'typed':'suggested', plCls)}
    </dl>
    <div class="fix">${fixHtml(r,g)}</div>
  </li>`;
}
const CHECK = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function renderQueue(){
  const rows = regionRows();
  const groups = GROUPS.map(g => ({...g, rows: sortRows(rows.filter(r => groupOf(r) === g.key))}));
  const live = groups.filter(g => g.rows.length), empty = groups.filter(g => !g.rows.length);
  const items = live.reduce((s,g) => s + g.rows.length, 0);
  const blocking = live.filter(g => g.blocks).reduce((s,g) => s + g.rows.length, 0);
  let html = `<div class="sec-head"><h2 id="q-h">Action needed</h2><span class="meta">${plural(items,'item','items')}${blocking?` · ${blocking} block Finalise`:' · nothing blocks Finalise'}</span></div>`;
  if (!live.length) html += `<div class="allclear">${CHECK} Nothing left to fix in ${S.region}. Finalise when ready.</div>`;
  live.forEach(g => {
    const limit = 8, showAll = S.more[g.key] || g.rows.length <= limit + 2;
    const shown = showAll ? g.rows : g.rows.slice(0, limit);
    html += `<div class="grp g-${g.key}" id="g-${g.key}">
      <h3 id="gh-${g.key}" tabindex="-1"><span class="dot" aria-hidden="true"></span>${g.title} <span class="n">${g.rows.length}</span>${g.blocks?'<span class="blk">blocks Finalise</span>':'<span class="info">does not block</span>'}</h3>
      <p class="ghelp">${g.help}</p>
      <ul class="cards">${shown.map(r => card(r, g.key)).join('')}</ul>
      ${showAll ? '' : `<div class="more"><button type="button" class="btn small" id="q-more-${g.key}" data-act="more" data-g="${g.key}">Show ${g.rows.length - limit} more</button></div>`}
    </div>`;
  });
  if (empty.length){
    html += `<div class="clearline" aria-label="Clear groups"><span>Clear:</span>${empty.map(g => `<span class="ok" id="g-${g.key}" tabindex="-1">${CHECK}${g.title}</span>`).join('')}</div>`;
  }
  document.getElementById('queue').innerHTML = html;
}

/* ---------- everything else ---------- */
function salesCell(r,k){
  const f = salesFig(r,k);
  return `${P.fmt(f.tot)}${f.sub && f.sub.indexOf('·')>0 ? `<small>${f.sub}</small>` : ''}`;
}
function plantCell(r){
  const pl = P.planned(r), a = P.assign(r), id = r.id;
  let html = '';
  if (!r.plants.length){
    html = pl > 0 ? '<span class="badge-gap">No plant can make</span>' : '<span class="muted">No plant ticked</span>';
  } else if (r.plants.length === 1){
    html = pl > 0 ? `<span class="auto-t">${pname(r.plants[0])}</span>` : `<span class="muted">${pname(r.plants[0])}</span>`;
  } else {
    const warn = a.kind === 'choose' || (a.kind === 'split' && !a.ok);
    html = `<select class="sel ${warn?'warn':''}" id="plant-${id}" data-act="plant" data-id="${id}" aria-label="Plant for ${rowName(r)}">
      <option value="" ${!r.choice?'selected':''}>${pl>0?'Choose…':'–'}</option>
      ${r.plants.map(p => `<option value="${p}" ${r.choice===p?'selected':''}>${pname(p)}</option>`).join('')}
      <option value="split" ${r.choice==='split'?'selected':''}>Split</option></select>`;
    if (r.choice === 'split'){
      const st = splitState(r);
      html += ' ' + r.plants.map(p => `<input class="in sm ${st.ok?'manual':'bad'}" id="sp-${id}-${p}" type="text" inputmode="decimal" autocomplete="off" value="${+r.split[p]||0}" data-act="tsplit" data-id="${id}" data-p="${p}" aria-label="${pname(p)} share, ${rowName(r)}">`).join(' ')
        + ` <span class="sp-state ${st.ok?'ok':'bad'}" id="sp-${id}-state" style="min-width:0">${st.ok?'adds up':st.text}</span>`;
    }
  }
  const un = P.unticked(r);
  if (un.length) html += `<span class="note-warn" title="Has stock or sales here but is not ticked">${un.map(short).join(', ')} not ticked</span>`;
  if (groupOf(r)) html += `<span class="badge-q">In Action needed</span>`;
  return html;
}
function tableRow(r, first){
  const id = r.id, pl = P.planned(r), sug = P.suggested(r);
  const note = P.BAND_NOTE[r.thk] ? `<span class="bandnote"> ${P.BAND_NOTE[r.thk]}</span>` : '';
  return `<tr data-row="${id}" class="${first?'first':''} ${groupOf(r)?'inq':''}">
    <th scope="row">${first ? r.size : '<span class="sr-only">'+r.size+'</span>'}</th>
    <td class="mono">${thk(r)}${note}</td>
    <td>${r.type}</td>
    <td class="n">${r.type==='Buffer'&&r.buffer?T(r.buffer):'–'}</td>
    <td class="n">${P.fmt(P.opening(r))}</td>
    <td class="n">${salesCell(r,'oct')}</td>
    <td class="n">${salesCell(r,'ao')}</td>
    <td class="n"><input class="in" id="ind-${id}" type="text" inputmode="decimal" autocomplete="off" value="${r.indent==null?'':r.indent}" placeholder="–" data-act="indent" data-id="${id}" aria-label="Monthly Indent T, ${rowName(r)}"></td>
    <td class="n"><input class="in ${plannedCls(r)} ${pl===0?'zero':''}" id="pl-${id}" type="text" inputmode="decimal" autocomplete="off" value="${pl}" data-act="planned" data-id="${id}" aria-label="Planned T, ${rowName(r)}" title="Suggested ${sug} T. Clear to go back to the suggestion."></td>
    <td id="pc-${id}">${plantCell(r)}</td>
  </tr>`;
}
const CHEV = '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
function renderRest(){
  const rows = regionRows();
  const restAll = rows.filter(r => !groupOf(r) || S.pinned.has(r.id));
  const restT = restAll.reduce((s,r) => s + P.planned(r), 0);
  let html = `<div class="sec-head"><h2 id="rest-h">Everything else</h2><span class="meta">${plural(restAll.length,'row','rows')} with nothing to fix · <span class="mono">${T(restT)}</span> T planned</span></div>
    <div class="legend" aria-hidden="true"><span><i style="background:var(--manual-bg);border-color:var(--manual-border)"></i>typed by you</span><span><i style="background:var(--auto-bg);border-color:var(--auto-border)"></i>suggested</span><span><i style="background:var(--warn-bg);border-color:var(--warn-border)"></i>check</span><span><i style="background:var(--gap-bg);border-color:var(--gap-border)"></i>gap</span></div>`;
  SECTIONS.forEach(sec => {
    const list = restAll.filter(r => r.section === sec);
    if (!list.length) return;
    const quiet = list.filter(r => P.quiet(r) && !S.pinned.has(r.id));
    const vis = S.quiet[sec] ? list : list.filter(r => !(P.quiet(r) && !S.pinned.has(r.id)));
    const t = list.reduce((s,r) => s + P.planned(r), 0);
    const per = plantsHere().map(p => `${short(p)} ${T(list.reduce((s,r) => s + P.share(r,p), 0))}`).join(' · ');
    const open = !!S.open[sec];
    html += `<div class="sect"><h3><button type="button" class="sect-btn" id="sec-${sec}" aria-expanded="${open}" aria-controls="panel-${sec}">${CHEV}<span class="nm">${sec}</span><span class="full">${SECT_NAME[sec]}</span>
      <span class="meta">${plural(list.length,'row','rows')} · <b>${T(t)}</b> T · ${per}</span></button></h3>
      <div class="panel" id="panel-${sec}" ${open?'':'hidden'}>`;
    if (open){
      let body = '';
      P.bySize(vis).forEach(([size, rs]) => { rs.sort((a,b) => a.thk-b.thk).forEach((r,i) => { body += tableRow(r, i===0); }); });
      html += `<div class="tscroll"><table class="grid"><caption class="sr-only">${sec} rows</caption><thead><tr>
        <th scope="col">Size</th><th scope="col">Thk mm</th><th scope="col">Type</th><th scope="col" class="n">Buffer T</th><th scope="col" class="n">Open T</th>
        <th scope="col" class="n">Oct T</th><th scope="col" class="n">Aug–Oct T</th><th scope="col" class="n">Indent T</th><th scope="col" class="n">Planned T</th><th scope="col">Plant</th></tr></thead>
        <tbody>${body || '<tr><td colspan="10" class="muted">Only quiet rows here.</td></tr>'}</tbody></table></div>`;
      if (quiet.length) html += `<div class="quietbar"><span>${quiet.length} quiet ${quiet.length===1?'row':'rows'}: no stock, no sales, no buffer, no indent.</span>
        <button type="button" class="btn link" id="quiet-${sec}" data-act="quiet" data-sec="${sec}">${S.quiet[sec]?'Hide':'Show'} quiet rows</button></div>`;
    }
    html += `</div></div>`;
  });
  const out = (P.outside || []).filter(o => o.region === S.region);
  if (out.length){
    html += `<p class="outside"><b>Outside the plan</b> (stock or sales on a size with no master row, not planned): ${out.map(o => {
      const b = Object.entries(o.byPlant).map(([p,v]) => `${short(p)} ${P.f1(v.open)} T stock, ${P.f1(v.oct)} Oct, ${P.f1(v.ao)} Aug–Oct`).join('; ');
      return `<span class="mono">${o.size} ${(+o.thk).toFixed(1)}</span> (${b})`; }).join(' · ')}</p>`;
  }
  document.getElementById('rest').innerHTML = html;
}

/* ---------- summary ---------- */

  const segs = st.plants.map((p,i) => ({cls:'s-p'+i, t:st.by[p].t}))

    const sum = k => st.rows.reduce((s,r) => s + (r.byPlant[p]?.[k]||0), 0);
    return {p, open:sum('open'), oct:sum('oct'), ao:sum('ao')};
  });
  const tt = k => salesRows.reduce((s,x) => s + x[k], 0);
  const logs = P.log.filter(l => l.indexOf(` ${S.region} `) > -1);
  document.getElementById('sum').innerHTML = `<div class="sum-in">
    <h2>${S.region} · ${MONTH}</h2>
    <div class="big"><span class="mono">${T(st.total)}</span><span>T planned</span></div>
    <div class="stack" aria-hidden="true">${segs.filter(x => x.t > 0).map(x => `<span class="${x.cls}" style="flex:${x.t/tot}"></span>`).join('')}</div>
    <dl class="sumlist">
      ${st.plants.map((p,i) => `<dt><span class="sw s-p${i}"></span><span>${pname(p)} <span class="r">${plural(st.by[p].n,'row','rows')}</span></span></dt><dd>${T(st.by[p].t)} T</dd>`).join('')}
      <dt><span class="sw s-wait"></span><span class="c-warn">Waiting for a plant</span></dt><dd class="c-warn">${T(st.waitT)} T</dd>
      <dt><span class="sw s-gap"></span><span class="c-gap">No plant can make <span class="r">${plural(st.gapN,'row','rows')}</span></span></dt><dd class="c-gap">${T(st.gapT)} T</dd>
    </dl>
    <div class="needs">${st.blockers ? `<span class="num c-warn">${st.blockers}</span> ${st.blockers===1?'row needs':'rows need'} a plant · <a href="#g-${st.choose?'choose':'split'}">go to queue</a>` : `<span class="c-ok">${CHECK} No row needs a plant</span>`}</div>
    <div class="fin" style="align-items:stretch">${finControl(st,'side').replace('class="reason','class="reason sr-only')}</div>
    ${confirmBox(st,'side')}
    <h3>Stock and sales by plant</h3>
    <table class="mini"><thead><tr><th scope="col">Plant</th><th scope="col">Open T</th><th scope="col">Oct T</th><th scope="col">Aug–Oct T</th></tr></thead>
      <tbody>${salesRows.map(x => `<tr><td>${pname(x.p)}</td><td>${T(x.open)}</td><td>${T(x.oct)}</td><td>${T(x.ao)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${S.region}</td><td>${T(tt('open'))}</td><td>${T(tt('oct'))}</td><td>${T(tt('ao'))}</td></tr></tfoot></table>
    <p class="hint" style="margin-top:6px">Oct = October invoiced (L30) · Aug–Oct = L90</p>
    ${P.final[S.region] ? `<h3>Change log after Finalise</h3>${logs.length ? `<ul class="log">${logs.map(l => `<li>${l}</li>`).join('')}</ul>` : '<p class="hint">No changes since Finalise.</p>'}` : ''}
  </div>`;
  document.getElementById('pbar').innerHTML = `<span class="tot">Planned <b>${T(st.total)}</b> T</span>
    ${st.plants.map(p => `<span>${short(p)} <b>${T(st.by[p].t)}</b></span>`).join('')}
    <span class="c-gap">No plant <b>${T(st.gapT)}</b></span>
    <span class="${st.blockers?'c-warn':'c-ok'}">${st.blockers ? `<b>${st.blockers}</b> need a plant` : 'Ready to finalise'}</span>`;
}

/* ---------- render ---------- */
function renderChrome(){ const st = stats(); renderHeader(st); renderSummary(st); }
function render(){
  const ae = document.activeElement, fid = ae && ae.id;
  let sel = null; if (ae && ae.tagName === 'INPUT'){ try { sel = [ae.selectionStart, ae.selectionEnd]; } catch(e){} }
  renderChrome(); renderQueue(); renderRest();
  if (fid){ const el = document.getElementById(fid); if (el && el !== document.activeElement){ el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
}
function announce(msg){
  const st = stats();
  const s = document.getElementById('status');
  s.textContent = `${msg}. ${st.blockers ? plural(st.blockers,'row','rows') + ' still need a plant' : 'No row needs a plant'}.`;
}
function focusId(id){ const el = document.getElementById(id); if (el) el.focus(); }

// fix one queue item; animate the card out if it left its group
function finish(r, cardEl, g, msg, stayFocusId){
  const left = !!cardEl && groupOf(r) !== g;
  let next = null;
  if (left){ const sib = cardEl.nextElementSibling || cardEl.previousElementSibling; next = sib ? sib.dataset.row : null; }
  const go = () => {
    render(); announce(msg);
    if (left){
      const t = (next != null && document.querySelector(`.card[data-row="${next}"][data-group="${g}"] [data-first]`)) || document.getElementById('gh-' + g) || document.getElementById('q-h');
      if (t){ if (!t.hasAttribute('tabindex') && t.tagName === 'H2') t.setAttribute('tabindex','-1'); t.focus({preventScroll:false}); }
    } else if (stayFocusId) focusId(stayFocusId);
  };
  if (left && !reduceMotion()){
    cardEl.style.height = cardEl.offsetHeight + 'px'; void cardEl.offsetHeight;
    cardEl.classList.add('leaving'); setTimeout(go, 230);
  } else go();
}

function updateRowLight(r){
  const pl = document.getElementById('pl-' + r.id);
  if (pl && pl !== document.activeElement){ const v = P.planned(r); pl.value = v; pl.className = `in ${plannedCls(r)} ${v===0?'zero':''}`; }
  else if (pl){ pl.className = `in ${plannedCls(r)}`; }
  const pc = document.getElementById('pc-' + r.id);
  if (pc && !pc.contains(document.activeElement)) pc.innerHTML = plantCell(r);
  if (r.choice === 'split'){
    const st = splitState(r);
    const s = document.getElementById('sp-' + r.id + '-state'); if (s){ s.className = `sp-state ${st.ok?'ok':'bad'}`; s.textContent = st.ok ? 'adds up' : st.text; }
    r.plants.forEach(p => { const i = document.getElementById(`sp-${r.id}-${p}`); if (i) i.className = `in sm ${st.ok?'manual':'bad'}`; });
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const id = t.id;
  if (id === 'theme-toggle'){
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark'; return;
  }
  if (id.startsWith('reg-')){ S.region = id.slice(4); S.confirm = null; render(); announce(`Showing ${S.region}`); return; }
  if (id === 'fin-top' || id === 'fin-side'){
    if (P.final[S.region]) return;
    const where = id.slice(4);
    if (P.blockers(S.region).length){
      announce('Finalise is blocked');
      const first = document.querySelector('.card[data-group="choose"] [data-first], .card[data-group="split"] [data-first]');
      if (first){ first.scrollIntoView({block:'center', behavior: reduceMotion()?'auto':'smooth'}); first.focus({preventScroll:true}); }
      return;
    }
    S.confirm = where; render(); focusId('fin-yes-' + where); return;
  }
  if (id.startsWith('fin-no-')){ const w = id.slice(7); S.confirm = null; render(); focusId('fin-' + w); return; }
  if (id.startsWith('fin-yes-')){
    const w = id.slice(8); S.confirm = null;
    const ok = P.finalise(S.region); render();
    announce(ok ? `${S.region} finalised. Still editable; changes are logged` : 'Finalise is blocked'); focusId('fin-' + w); return;
  }
  if (id.startsWith('sec-')){ const s = id.slice(4); S.open[s] = !S.open[s]; render(); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === 'more'){ S.more[t.dataset.g] = true; render(); const c = document.querySelectorAll(`.card[data-group="${t.dataset.g}"]`)[8]; const f = c && c.querySelector('[data-first]'); if (f) f.focus(); return; }
  if (act === 'quiet'){ S.quiet[t.dataset.sec] = !S.quiet[t.dataset.sec]; render(); return; }
  const r = P.rows[+t.dataset.id]; if (!r) return;
  const cardEl = t.closest('.card'), g = cardEl ? cardEl.dataset.group : null;
  switch (act){
    case 'pick': S.openSplit.delete(r.id); P.setChoice(r, t.dataset.p); finish(r, cardEl, g, `${rowName(r)} assigned to ${pname(t.dataset.p)}`); break;
    case 'opensplit': P.setChoice(r, 'split'); S.openSplit.add(r.id); render(); focusId(`q-${r.id}-s-${r.plants[0]}`); break;
    case 'splitdone':
      if (t.getAttribute('aria-disabled') === 'true'){ focusId(`q-${r.id}-s-${r.plants[0]}`); announce(splitState(r).text); break; }
      S.openSplit.delete(r.id); finish(r, cardEl, g, `${rowName(r)} split ${r.plants.map(p => short(p)+' '+T(+r.split[p]||0)).join(', ')}`); break;
    case 'splitback': S.openSplit.delete(r.id); P.setChoice(r, null); render(); focusId(`q-${r.id}-p-${r.plants[0]}`); break;
    case 'keep': P.setPlanned(r, r.typed); finish(r, cardEl, g, `${rowName(r)}: kept ${T(r.typed)} T`); break;
    case 'use': P.setPlanned(r, ''); finish(r, cardEl, g, `${rowName(r)}: using suggestion ${T(P.planned(r))} T`); break;
    case 'ack': S.ack.add(r.id); finish(r, cardEl, g, `${rowName(r)} noted`); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target, act = t.dataset && t.dataset.act; if (!act) return;
  const r = P.rows[+t.dataset.id]; if (!r) return;
  const v = parseNum(t.value); if (v === null) return;
  if (act === 'indent'){ S.pinned.add(r.id); P.setIndent(r, v); updateRowLight(r); renderChrome(); }
  else if (act === 'planned'){ S.pinned.add(r.id); P.setPlanned(r, v); updateRowLight(r); renderChrome(); }
  else if (act === 'tsplit'){ S.pinned.add(r.id); P.setSplit(r, t.dataset.p, v); updateRowLight(r); renderChrome(); }
  else if (act === 'qsplit'){
    P.setSplit(r, t.dataset.p, v);
    const st = splitState(r), s = document.getElementById(`q-${r.id}-state`);
    if (s){ s.className = `sp-state ${st.ok?'ok':'bad'}`; s.textContent = st.text; }
    r.plants.forEach(p => { const i = document.getElementById(`q-${r.id}-s-${p}`); if (i) i.className = `in sm ${st.ok?'manual':'bad'}`; });
    const d = document.getElementById(`q-${r.id}-done`); if (d){ if (st.ok) d.removeAttribute('aria-disabled'); else d.setAttribute('aria-disabled','true'); }
    renderChrome();
  }
  else if (act === 'qplanned'){ P.setPlanned(r, v); renderChrome(); }
});

let sigBefore = null;
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.act) sigBefore = queueSig(); });
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset && t.dataset.act; if (!act) return;
  const r = P.rows[+t.dataset.id]; if (!r) return;
  if (act === 'plant'){ S.pinned.add(r.id); P.setChoice(r, t.value); render(); announce(`${rowName(r)}: ${t.value ? (t.value==='split'?'split between plants':'assigned to ' + pname(t.value)) : 'no plant'}`); if (t.value==='split') focusId(`sp-${r.id}-${r.plants[0]}`); return; }
  if (act === 'qsplit' || act === 'qplanned'){
    const cardEl = t.closest('.card'), g = cardEl && cardEl.dataset.group;
    if (cardEl && groupOf(r) !== g) finish(r, cardEl, g, act === 'qsplit' ? `${rowName(r)} split adds up` : `${rowName(r)}: Planned ${T(P.planned(r))} T`);
    else render();
    return;
  }
  // table edits: only rebuild the queue if membership changed
  if (sigBefore !== null && sigBefore !== queueSig()){ render(); sigBefore = queueSig(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.dataset.act){ e.target.dispatchEvent(new Event('change', {bubbles:true})); }
});

renderNotes();
render();
})();
</script>
</body>
</html>
